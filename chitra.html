<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akanda Chitra - ABST P1-P38 Visualization</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">
  <div class="max-w-3xl mx-auto p-4">
    <header class="mb-6 border-b border-cyan-900 pb-4">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-3xl font-bold text-cyan-400">Akanda Chitra</h1>
          <p class="text-slate-400 text-sm">P1-P38 ABST Visualization Engine | INDIAN.001</p>
        </div>
        <a href="index.html" class="text-cyan-400 hover:text-cyan-300 text-sm">← ABST Home</a>
      </div>
    </header>

    <div class="mb-4">
      <label class="text-slate-300 text-sm mb-2 block">Quick Presets - Pillar Select Chey:</label>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-2" id="presetButtons"></div>
    </div>

    <div class="mb-4">
      <label class="text-slate-300 text-sm mb-2 block">Prompt:</label>
      <textarea id="promptInput" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-sm" placeholder="Pillar select chey leka ne own ABST vision type chey..."></textarea>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-4">
      <select id="styleSelect" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm">
        <option value="photorealistic, 8k, ultra detailed">Photorealistic</option>
        <option value="concept art, digital painting">Concept Art</option>
        <option value="architectural blueprint">Blueprint</option>
        <option value="sci-fi, cinematic">Sci-Fi Cinematic</option>
      </select>
      <select id="aspectSelect" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm">
        <option value="16:9">16:9 Landscape</option>
        <option value="1:1">1:1 Square</option>
        <option value="9:16">9:16 Portrait</option>
      </select>
    </div>

    <div class="flex gap-4 mb-4 text-sm">
      <label class="flex items-center gap-2">
        <input type="checkbox" id="indianId" checked class="w-4 h-4">
        <span>INDIAN.001 ID</span>
      </label>
      <label class="flex items-center gap-2">
        <input type="checkbox" id="sriYantra" class="w-4 h-4">
        <span>Sri Yantra Mode</span>
      </label>
    </div>

    <button id="generateBtn" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 rounded mb-4">
      Generate Image
    </button>

    <div id="resultBox" class="bg-slate-900 border border-slate-700 rounded p-4 min-h-[200px] flex items-center justify-center">
      <p class="text-slate-500 text-sm text-center">P38 click chesi Generate press chey<br>Hugging Face SD v1.5 - Token: ABST-CHITRA ✅</p>
    </div>

    <footer class="mt-8 pt-4 border-t border-slate-800 text-center text-xs text-slate-500">
      <p>Dig Once, Serve Forever | P36 Jarvis AI Core | © INDIAN.001 RAM GANESH MAKINA</p>
    </footer>
  </div>

  <script>
    const ABST_PRESETS = {
      P1: "P1 Plasma Reactor Core: Massive underground plasma energy reactor, glowing fusion core, Bhabha Kavach shielding, Dig Once infrastructure tunnels",
      P3: "P3 JalAqua Grid: Underground water purification system, reverse osmosis plants, smart water tunnels under India",
      P20: "P20 S.T.A.R Tunnel: Underground freight corridor, automated cargo pods, maglev tracks, India-wide logistics network",
      P22: "P22 Kinetic Energy: Piezoelectric highway tiles, vehicle motion energy harvesting, underground power storage",
      P32: "P32 Sentinel Shield: Missile defense network, underground silos, Bhabha Kavach dome protection over India",
      P36: "P36 Jarvis AI: Central AI command center, quantum computers, holographic displays, Dig Once data tunnels",
      P37: "P37 Bharat Metro: Underground high-speed metro, vacuum tunnels, connecting all Indian cities",
      P38: "P38 Hyperloop Bharat: Vacuum tube transport, 1000kmph pods, underground stations across India"
    };

    const presetButtons = document.getElementById('presetButtons');
    Object.keys(ABST_PRESETS).forEach(key => {
      const btn = document.createElement('button');
      btn.className = 'bg-slate-800 hover:bg-cyan-900 border border-slate-700 text-xs py-2 px-2 rounded';
      btn.textContent = key;
      btn.onclick = () => {
        document.getElementById('promptInput').value = ABST_PRESETS[key];
      };
      presetButtons.appendChild(btn);
    });

    document.getElementById('generateBtn').onclick = async () => {
      const prompt = document.getElementById('promptInput').value;
      const style = document.getElementById('styleSelect').value;
      const indianId = document.getElementById('indianId').checked;
      const sriYantra = document.getElementById('sriYantra').checked;

      if (!prompt) {
        alert('Pillar select chey leka prompt type chey');
        return;
      }

      let fullPrompt = prompt + ', ' + style;
      if (indianId) fullPrompt += ', INDIAN.001 RAM GANESH MAKINA signature';
      if (sriYantra) fullPrompt += ', sacred geometry, Sri Yantra pattern, golden ratio';

      const resultBox = document.getElementById('resultBox');
      resultBox.innerHTML = '<div class="text-center"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-cyan-400 mx-auto mb-2"></div><p class="text-cyan-400">Generating... 30 sec wait chey</p><p class="text-slate-500 text-xs mt-2">Hugging Face loading avtundi</p></div>';

      try {
        const response = await fetch('https://api-inference.huggingface.co/models/stable-diffusion-v1-5/stable-diffusion-v1-5', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer 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',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ inputs: fullPrompt })
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error('API Error: ' + response.status + ' ' + errorText);
        }

        const blob = await response.blob();
        const imageUrl = URL.createObjectURL(blob);
        resultBox.innerHTML = '<img src="' + imageUrl + '" class="w-full rounded" alt="ABST Visualization"><p class="text-xs text-slate-500 mt-2 text-center">Right-click → Save Image</p>';
      } catch (error) {
        resultBox.innerHTML = '<p class="text-red-400 text-sm">Error: ' + error.message + '</p><p class="text-slate-500 text-xs mt-2">1. Model loading lo undochu - 1 min wait chesi malli try chey<br>2. Token check chey<br>3. HuggingFace rate limit</p>';
      }
    };
  </script>
</body>
</html>
