<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akanda Chitra - ABST Image Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    button:disabled { cursor: not-allowed; }
  </style>
</head>
<body class="bg-slate-950 text-white">
  <div class="max-w-5xl mx-auto p-4 md:p-6">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-3xl md:text-4xl font-bold text-cyan-400">Akanda Chitra</h1>
        <p class="text-slate-400 text-sm">P1-P38 ABST Visualization Engine | INDIAN.001</p>
      </div>
      <a href="https://ram1025k.github.io/ram1025/" class="text-cyan-400 hover:text-cyan-300 text-sm">← ABST Home</a>
    </div>

    <!-- Pillar Presets -->
    <div class="mb-6">
      <p class="text-slate-300 text-sm mb-2">Quick Presets - Pillar Select Chey:</p>
      <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-8 gap-2">
        <button onclick="setPrompt('P1')" class="bg-slate-800 hover:bg-cyan-700 p-2 rounded text-xs transition">P1 Plasma</button>
        <button onclick="setPrompt('P3')" class="bg-slate-800 hover:bg-cyan-700 p-2 rounded text-xs transition">P3 Water</button>
        <button onclick="setPrompt('P20')" class="bg-slate-800 hover:bg-cyan-700 p-2 rounded text-xs transition">P20 Tunnel</button>
        <button onclick="setPrompt('P22')" class="bg-slate-800 hover:bg-cyan-700 p-2 rounded text-xs transition">P22 Kinetic</button>
        <button onclick="setPrompt('P32')" class="bg-slate-800 hover:bg-cyan-700 p-2 rounded text-xs transition">P32 Sentinel</button>
        <button onclick="setPrompt('P36')" class="bg-slate-800 hover:bg-cyan-700 p-2 rounded text-xs transition">P36 Jarvis</button>
        <button onclick="setPrompt('P37')" class="bg-slate-800 hover:bg-cyan-700 p-2 rounded text-xs transition">P37 Metro</button>
        <button onclick="setPrompt('P38')" class="bg-slate-800 hover:bg-cyan-700 p-2 rounded text-xs transition">P38 Hyperloop</button>
      </div>
    </div>

    <!-- Prompt Box -->
    <div class="mb-4">
      <label class="text-slate-300 text-sm mb-2 block">Prompt:</label>
      <textarea id="prompt" class="w-full p-3 bg-slate-800 rounded border border-slate-700 focus:border-cyan-500 outline-none transition" rows="4"
        placeholder="Pillar select chey leka ne own ABST vision type chey..."></textarea>
    </div>

    <!-- Style Options -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      <select id="style" class="bg-slate-800 p-2 rounded border border-slate-700 text-sm outline-none focus:border-cyan-500">
        <option value="photorealistic 8k">Photorealistic</option>
        <option value="cinematic lighting">Cinematic</option>
        <option value="technical blueprint">Blueprint</option>
        <option value="aerial drone shot">Aerial View</option>
      </select>
      <select id="ratio" class="bg-slate-800 p-2 rounded border border-slate-700 text-sm outline-none focus:border-cyan-500">
        <option value="16:9">16:9 Landscape</option>
        <option value="1:1">1:1 Square</option>
        <option value="9:16">9:16 Portrait</option>
      </select>
      <label class="flex items-center gap-2 bg-slate-800 p-2 rounded text-sm cursor-pointer">
        <input type="checkbox" id="watermark" checked class="accent-cyan-500">
        INDIAN.001 ID
      </label>
      <label class="flex items-center gap-2 bg-slate-800 p-2 rounded text-sm cursor-pointer">
        <input type="checkbox" id="sriYantra" class="accent-cyan-500">
        Sri Yantra Mode
      </label>
    </div>

    <!-- Generate Button -->
    <button onclick="generateDemo()" id="genBtn" class="w-full bg-cyan-600 hover:bg-cyan-700 px-6 py-3 rounded font-bold text-lg transition">
      Generate Image
    </button>

    <!-- Result Area -->
    <div id="result" class="mt-6">
      <div class="bg-slate-900 border border-slate-800 rounded-lg p-8 text-center">
        <p class="text-slate-500 text-sm">P38 click chesi Generate press chey</p>
        <p class="text-slate-600 text-xs mt-2">Hugging Face SD v1.5 - CORS Fixed V2 ✅</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="mt-8 pt-6 border-t border-slate-800">
      <p class="text-xs text-slate-600 text-center">
        Dig Once, Serve Forever | P36 Jarvis AI Core | © INDIAN.001 RAM GANESH MAKINA
      </p>
    </div>
  </div>

<script>
// ABST P1-P38 Preset Prompts
const ABST_PROMPTS = {
  P1: "Futuristic plasma waste-to-energy plant in Akanda Bharat Sovereign Township, clean white facility with Sri Yantra geometry",
  P3: "Amrutavarsha modular water plant ABST, atmospheric water generators, 10000 liter tanks, solar powered",
  P20: "Walkthrough utility tunnel P20 under ABST roads, organized power cables data fiber water pipes, concrete chamber",
  P22: "Kinetic footstep energy walkway in ABST public plaza, glowing tiles generating power, people walking",
  P32: "Sentinel-Eye AI surveillance grid ABST, smart cameras on poles, drone monitoring, holographic display",
  P36: "Jarvis AI Core central command ABST, massive holographic displays, Sri Yantra interface, INDIAN.001",
  P37: "Underground electric metro Bharat Dhara Metro 25m below ABST, driverless glass pods, kinetic tiles",
  P38: "Aerial view Akanda Hyperloop Sri Yantra grid 50m above Vizag Mother Hub, 9 golden triangles, sunset"
};

// Hugging Face Token - Ram1025k ACST-CHITRA
const HF_TOKEN = "hf_QvjFXpiLNowwVSOyW0pyHTzkXJXvCkJDQb";

function setPrompt(pillar) {
  document.getElementById('prompt').value = ABST_PROMPTS[pillar] || '';
  document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
}

let isGenerating = false;

async function generateDemo() {
  if(isGenerating) {
    alert('Already generating Ram! Wait chey');
    return;
  }

  const prompt = document.getElementById('prompt').value;
  const style = document.getElementById('style').value;
  const watermark = document.getElementById('watermark').checked;
  const sriYantra = document.getElementById('sriYantra').checked;
  const resultDiv = document.getElementById('result');
  const genBtn = document.getElementById('genBtn');

  if(!prompt.trim()) return alert('Prompt enter chey Ram');

  isGenerating = true;
  genBtn.disabled = true;
  genBtn.innerText = 'Generating... 15-30 sec';
  genBtn.classList.add('opacity-50');

  let finalPrompt = prompt.split(',')[0];
  finalPrompt += ", " + style;
  if(sriYantra) finalPrompt += ", Sri Yantra sacred geometry";
  if(watermark) finalPrompt += ", INDIAN.001";
  finalPrompt += ", masterpiece, ultra detailed, 8k";

  let seconds = 0;
  resultDiv.innerHTML = `
    <div class="bg-slate-900 border border-cyan-800 rounded-lg p-8 text-center">
      <p class="text-cyan-400 animate-pulse">🎨 Generating via Hugging Face...</p>
      <p class="text-slate-500 text-xs mt-2" id="timer">Time: 0 sec</p>
      <p class="text-green-500 text-xs mt-3">✓ Model: Stable Diffusion v1.5</p>
      <p class="text-slate-700 text-xs mt-2">First request: 20-30 sec load time</p>
    </div>
  `;

  const timerInterval = setInterval(() => {
    seconds++;
    const timerEl = document.getElementById('timer');
    if(timerEl) timerEl.innerText = `Time: ${seconds} sec`;
  }, 1000);

  try {
    // FIX 1: Using allorigins instead of corsproxy.io - More stable
    const apiUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://api-inference.huggingface.co/models/runwayml/stable-diffusion-v1-5')}`;

    const response = await fetch(apiUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${HF_TOKEN}`
      },
      body: JSON.stringify({
        inputs: finalPrompt,
        parameters: {
          negative_prompt: "blurry, bad art, low quality, distorted, watermark, text",
          num_inference_steps: 25,
          guidance_scale: 7.5
        }
      })
    });

    if(!response.ok) {
      const errText = await response.text();
      let errMsg = 'API Error';
      try {
        const errJson = JSON.parse(errText);
        errMsg = errJson.error || errMsg;
        if(errMsg.includes('loading')) {
          errMsg = 'Model loading - 20 sec wait chesi malli try chey';
        }
        if(errMsg.includes('rate limit')) {
          errMsg = 'Rate limit - 1 min wait chey Ram';
        }
      } catch(e) {
        errMsg = `HTTP ${response.status}: Server busy, malli try chey`;
      }
      throw new Error(errMsg);
    }

    const imageBlob = await response.blob();
    const imageUrl = URL.createObjectURL(imageBlob);

    clearInterval(timerInterval);
    isGenerating = false;
    genBtn.disabled = false;
    genBtn.innerText = 'Generate Image';
    genBtn.classList.remove('opacity-50');

    resultDiv.innerHTML = `
      <div class="bg-slate-900 border border-green-800 rounded-lg p-4">
        <p class="text-green-400 text-sm mb-3">✓ Generated in ${seconds} sec by INDIAN.001:</p>
        <img src="${imageUrl}" class="rounded-lg w-full mb-3 border border-slate-700" alt="ABST Generated">
        <a href="${imageUrl}" download="ABST_${Date.now()}.png"
           class="block text-center bg-cyan-600 hover:bg-cyan-700 px-4 py-2 rounded text-sm font-bold transition">
           ⬇️ Download Image
        </a>
        <details class="mt-3">
          <summary class="text-slate-500 text-xs cursor-pointer">View Prompt</summary>
          <p class="text-slate-600 text-xs mt-2 font-mono break-words">${finalPrompt}</p>
        </details>
      </div>
    `;
    resultDiv.scrollIntoView({ behavior: 'smooth' });

  } catch (error) {
    clearInterval(timerInterval);
    isGenerating = false;
    genBtn.disabled = false;
    genBtn.innerText = 'Generate Image';
    genBtn.classList.remove('opacity-50');

    resultDiv.innerHTML = `
      <div class="bg-slate-900 border border-orange-800 rounded-lg p-6 text-center">
        <p class="text-orange-400">⚠️ ${error.message}</p>
        <p class="text-slate-500 text-xs mt-3">Tip: Model sleep lo unte 30 sec padutadi. 2-3 times try chey</p>
        <p class="text-slate-600 text-xs mt-2">Hugging Face free tier - konchem slow untadi</p>
      </div>
    `;
  }
}
</script>
</body>
</html>
