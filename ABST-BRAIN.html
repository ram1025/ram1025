<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABST BRAIN</title>
    <script src="https://cdn.jsdelivr.net/gh/ram1025/abst-brain-sm2@main/sm2-engine.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e27;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { 
            text-align: center; 
            color: #00ff88; 
            text-shadow: 0 0 20px #00ff88;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #ffaa00;
            font-size: 12px;
            margin-bottom: 20px;
        }
        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .mode-btn {
            padding: 12px;
            background: #1a1f3a;
            border: 2px solid #2a3050;
            color: #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .mode-btn:hover { border-color: #00ff88; }
        .mode-btn.active {
            background: #ffaa00;
            color: #000;
            border-color: #ffaa00;
            font-weight: bold;
        }
        .sub-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 10px 0;
        }
        .sub-btn {
            padding: 8px;
            background: #252b4a;
            border: 1px solid #3a4060;
            color: #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .sub-btn:hover { background: #2a3050; }
        .hidden { display: none !important; }
        .card-area {
            background: #1a1f3a;
            border: 2px solid #2a3050;
            border-radius: 12px;
            padding: 30px 20px;
            min-height: 300px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .card-text { font-size: 18px; line-height: 1.6; }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        .stat-box {
            background: #1a1f3a;
            border: 1px solid #2a3050;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .stat-value {
            color: #00ff88;
            font-size: 24px;
            font-weight: bold;
        }
        .stat-label {
            color: #888;
            font-size: 11px;
            margin-top: 5px;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .btn {
            padding: 12px;
            background: #252b4a;
            border: 1px solid #3a4060;
            color: #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover { background: #2a3050; }
        .btn-primary {
            background: #00ff88;
            color: #000;
            font-weight: bold;
            border: none;
        }
        .progress {
            text-align: center;
            color: #00ff88;
            font-size: 16px;
            margin: 10px 0;
        }
        .close-btn {
            background: #1a1f3a;
            border: 2px solid #00ff88;
            color: #00ff88;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="close-btn" onclick="window.close()">← CLOSE</button>
        <h1>ABST BRAIN</h1>
        <div class="subtitle">SOVEREIGN ID: INDIAN.001 | 108 Mantra + 1000 Sahasra</div>

        <div class="mode-grid">
            <button id="pillarsMode" class="mode-btn">🏛️ 36 PILLARS - 108</button>
            <button id="schoolMode" class="mode-btn">📚 SCHOOL - 280</button>
            <button id="collegeMode" class="mode-btn">🎓 COLLEGE - 250</button>
            <button id="compMode" class="mode-btn">🏆 COMPETITIVE - 340</button>
        </div>
        <button id="gkMode" class="mode-btn" style="width:100%;margin-bottom:15px;">📖 GK/PHD - 130</button>

        <div id="schoolSubList" class="sub-list hidden">
            <button class="sub-btn" data-class="6">6th CLASS</button>
            <button class="sub-btn" data-class="7">7th CLASS</button>
            <button class="sub-btn" data-class="8">8th CLASS</button>
            <button class="sub-btn" data-class="9">9th CLASS</button>
            <button class="sub-btn" data-class="10">10th CLASS</button>
        </div>

        <div id="collegeSubList" class="sub-list hidden">
            <button class="sub-btn" data-class="INTER">INTER</button>
            <button class="sub-btn" data-class="DEGREE">DEGREE</button>
        </div>

        <div id="compSubList" class="sub-list hidden">
            <button class="sub-btn" data-class="UPSC">UPSC</button>
            <button class="sub-btn" data-class="APPSC">APPSC</button>
            <button class="sub-btn" data-class="TSPSC">TSPSC</button>
            <button class="sub-btn" data-class="SSC">SSC</button>
            <button class="sub-btn" data-class="BANK">BANK</button>
            <button class="sub-btn" data-class="RAILWAY">RAILWAY</button>
        </div>

        <div class="controls">
            <button class="btn">✏️ TYPE</button>
            <button class="btn">⚪ MCQ</button>
        </div>
        <button class="btn" style="width:100%;">🔄 FLIP</button>

        <div class="progress" id="progress">0/0</div>

        <div class="card-area">
            <div class="card-text" id="cardText">Select a mode to start</div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="dueNow">0</div>
                <div class="stat-label">Due Now</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="streak">0</div>
                <div class="stat-label">days</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="total">0</div>
                <div class="stat-label">/0</div>
            </div>
        </div>
    </div>

    <script>
        let matrix = [];
        let dueCards = [];
        let currentIndex = 0;
        let currentMode = '';
        let userClass = '';
        let showingAnswer = false;

        function hideAllSubLists() {
            document.getElementById('schoolSubList').classList.add('hidden');
            document.getElementById('collegeSubList').classList.add('hidden');
            document.getElementById('compSubList').classList.add('hidden');
        }

        async function loadMatrixFromGitHub() {
            let url = '';
            let storageKey = '';
            
            if (currentMode === 'pillars') {
                url = './36-pillars-108.json';
                storageKey = 'pillars';
            } else if (currentMode === 'school') {
                url = './Education-school-280.json';
                storageKey = 'school';
            } else if (currentMode === 'college') {
                url = './Education-college-250.json';
                storageKey = 'college';
            } else if (currentMode === 'comp') {
                url = './Education-competitive-340.json';
                storageKey = 'competitive';
            } else if (currentMode === 'gk') {
                url = './Education-others-130.json';
                storageKey = 'gk';
            }

            console.log('[BRAIN] Fetching:', url);

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Fetch failed');
                matrix = await response.json();
                console.log('[BRAIN] Matrix loaded:', matrix.length);
                
                localStorage.setItem('abst_brain_' + storageKey, JSON.stringify(matrix));
                console.log('[BRAIN] Saved to localStorage:', storageKey);
                
                initBrain();
            } catch (err) {
                console.log('[BRAIN] Fetch failed:', err.message);
                const saved = localStorage.getItem('abst_brain_' + storageKey);
                if (saved) {
                    matrix = JSON.parse(saved);
                    console.log('[BRAIN] Loaded from localStorage:', matrix.length, 'cards');
                    initBrain();
                } else {
                    alert('No data found. Please connect to internet first time.');
                }
            }
        }

        function initBrain() {
            matrix = matrix.map((c, i) => ({
                id: c.id || `CARD-${i}`,
                q: c.q || c.question || 'No Question',
                a: c.a || c.answer || 'No Answer',
                category: c.category || c.pillar || c.class || 'GENERAL',
                ease: c.ease || 2.5,
                reps: c.reps || 0,
                interval: c.interval || 0,
                due: c.due || 0,
                passCount: c.passCount || 0
            }));

            loadCards();
            updateStats();
            showCard();
        }

        function loadCards() {
            let filteredMatrix = matrix;

            if (currentMode === 'pillars') {
                filteredMatrix = matrix;
            } else if (currentMode === 'gk') {
                filteredMatrix = matrix;
            } else {
                filteredMatrix = matrix.filter(c => String(c.category).trim() === String(userClass).trim());
            }

            console.log('[BRAIN] Filtered:', filteredMatrix.length, 'cards');

            filteredMatrix = filteredMatrix.map(c => window.SM2_ENGINE.initCard(c));

            dueCards = filteredMatrix.filter(c => window.SM2_ENGINE.isDue(c));
            console.log('[BRAIN] Due cards:', dueCards.length);

            if (dueCards.length === 0 && filteredMatrix.length > 0) {
                console.log('[BRAIN] No due cards, showing all');
                dueCards = [...filteredMatrix];
            }

            currentIndex = 0;
            dueCards = dueCards.sort(() => 0.5 - Math.random());
        }

        function showCard() {
            const cardText = document.getElementById('cardText');
            const progress = document.getElementById('progress');
            
            if (dueCards.length === 0) {
                cardText.innerHTML = 'All done! 🎉<br>Come back tomorrow for more cards';
                progress.textContent = '0/0';
                return;
            }

            const card = dueCards[currentIndex];
            progress.textContent = `${currentIndex + 1}/${dueCards.length}`;
            
            if (showingAnswer) {
                cardText.textContent = card.a;
            } else {
                cardText.textContent = card.q;
            }
        }

        function updateStats() {
            document.getElementById('dueNow').textContent = dueCards.length;
            document.getElementById('total').textContent = matrix.length;
            document.getElementById('total').nextElementSibling.textContent = `/${matrix.length}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            console.log('[BRAIN] DOM Ready');
            
            // 36 PILLARS
            document.getElementById('pillarsMode').onclick = () => {
                console.log('[BRAIN] 36 PILLARS clicked');
                hideAllSubLists();
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                document.getElementById('pillarsMode').classList.add('active');
                currentMode = 'pillars';
                userClass = 'GK';
                loadMatrixFromGitHub();
            };

            // SCHOOL
            document.getElementById('schoolMode').onclick = () => {
                document.getElementById('schoolSubList').classList.toggle('hidden');
                document.getElementById('collegeSubList').classList.add('hidden');
                document.getElementById('compSubList').classList.add('hidden');
            };

            // COLLEGE
            document.getElementById('collegeMode').onclick = () => {
                document.getElementById('collegeSubList').classList.toggle('hidden');
                document.getElementById('schoolSubList').classList.add('hidden');
                document.getElementById('compSubList').classList.add('hidden');
            };

            // COMPETITIVE
            document.getElementById('compMode').onclick = () => {
                document.getElementById('compSubList').classList.toggle('hidden');
                document.getElementById('schoolSubList').classList.add('hidden');
                document.getElementById('collegeSubList').classList.add('hidden');
            };

            // GK/PHD
            document.getElementById('gkMode').onclick = () => {
                console.log('[BRAIN] GK clicked');
                hideAllSubLists();
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                document.getElementById('gkMode').classList.add('active');
                currentMode = 'gk';
                userClass = 'GK';
                loadMatrixFromGitHub();
            };

            // School sub buttons
            document.querySelectorAll('#schoolSubList .sub-btn').forEach(btn => {
                btn.onclick = () => {
                    userClass = btn.dataset.class;
                    currentMode = 'school';
                    hideAllSubLists();
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    document.getElementById('schoolMode').classList.add('active');
                    loadMatrixFromGitHub();
                };
            });

            // College sub buttons
            document.querySelectorAll('#collegeSubList .sub-btn').forEach(btn => {
                btn.onclick = () => {
                    userClass = btn.dataset.class;
                    currentMode = 'college';
                    hideAllSubLists();
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    document.getElementById('collegeMode').classList.add('active');
                    loadMatrixFromGitHub();
                };
            });

            // Comp sub buttons
            document.querySelectorAll('#compSubList .sub-btn').forEach(btn => {
                btn.onclick = () => {
                    userClass = btn.dataset.class;
                    currentMode = 'comp';
                    hideAllSubLists();
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    document.getElementById('compMode').classList.add('active');
                    loadMatrixFromGitHub();
                };
            });

            // FLIP button
            document.querySelector('.btn:last-of-type').onclick = () => {
                showingAnswer = !showingAnswer;
                showCard();
            };
        });
    </script>
</body>
  </html>
