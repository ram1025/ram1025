calc: function(card, ease) {
if (!card.reps) card.reps = 0;
if (!card.ease) card.ease = 2.5;
if (!card.interval) card.interval = 0;
if (ease < 3) {
card.reps = 0;
card.interval = 0;
} else {
card.reps++;
if (card.reps === 1) card.interval = 1;
else if (card.reps === 2) card.interval = 6;
else card.interval = Math.round(card.interval * card.ease);
card.ease = card.ease + (0.1 - (5 - ease) * (0.08 + (5 - ease) * 0.02));
if (card.ease < 1.3) card.ease = 1.3;
}
return card;
}

let currentSubject = 'abst';
let answerMode = 'type';
let allCards = [];
let dueCards = [];
let current = 0;
let stats = JSON.parse(localStorage.getItem('abstBrainStats')) || { reviewed: 0, streak: 0, lastDate: null };
let currentEase = 0;
let isAnswered = false;
let userAge = null;
let userClass = null;
let carryForwardCard = null;
function loadCards() {
    const saved = localStorage.getItem('abstBrainCards_' + currentSubject);
    if (saved) {
        allCards = JSON.parse(saved);
    } else {
        if (currentSubject === 'abst') {
            allCards = [...abstCards];
        } else {
            if (userClass) {
                allCards = eduCards.filter(c => 
                    c.subject === userClass || 
                    c.subject === 'GK' || 
                    c.tag === 'GK'
                );
                if (allCards.length === 0) allCards = [...eduCards];
            } else {
                allCards = [...eduCards];
            }
        }
        allCards.forEach(c => {
            c.reps = 0;
            c.ease = 2.5;
            c.interval = 0;
            c.due = Date.now();
        });
    }
    filterDueCards();
}
function filterDueCards() {
    const now = Date.now();
    if (currentSubject === 'edu' && userClass) {
        dueCards = allCards.filter(c => 
            c.subject === userClass || 
            c.tag === 'GK' ||
            c.subject === 'GK'
        );
    } else {
        dueCards = allCards.filter(c => c.due <= now);
    }
    if (carryForwardCard) {
        dueCards.unshift(carryForwardCard);
        carryForwardCard = null;
    }
    if (dueCards.length === 0) {
        dueCards = allCards.slice(0, 10);
    }
    current = 0;
    updateStats();
    showCard();
}
function switchSubject(mode) {
    currentSubject = mode;
    document.getElementById('abstMode').classList.toggle('active', mode === 'abst');
    document.getElementById('eduMode').classList.toggle('active', mode === 'edu');
    if (mode === 'edu') {
        document.getElementById('ageModal').style.display = 'flex';
        document.documentElement.classList.add('modal-open');
        return;
    }
    saveCards();
    loadCards();
}
function switchAnswerMode(mode) {
answerMode = mode;
document.getElementById('typeMode').classList.toggle('active', mode === 'type');
document.getElementById('mcqMode').classList.toggle('active', mode === 'mcq');
document.getElementById('flipMode').classList.toggle('active', mode === 'flip');
showCard();
}
function saveAgeClass() {
const age = document.getElementById('userAge').value;
const cls = document.getElementById('userClass').value;
if (!age ||!cls) {
alert('Please enter Age and select Class');
return;
}
userAge = parseInt(age);
userClass = cls;
localStorage.setItem('abstUserAge', userAge);
localStorage.setItem('abstUserClass', userClass);
document.getElementById('ageModal').style.display = 'none';
document.documentElement.classList.remove('modal-open');
loadCards();
}
function showCard() {
if (current >= dueCards.length) current = 0;
if (dueCards.length === 0) {
document.getElementById('question').innerText = 'No cards due! Great job!';
document.getElementById('pillarTag').innerText = 'COMPLETE';
document.getElementById('typeAnswerBox').style.display = 'none';
document.getElementById('mcqAnswerBox').style.display = 'none';
document.getElementById('showBtn').style.display = 'none';
return;
}
isAnswered = false;
const c = dueCards[current];
const tagText = c.type === 'abst' ? `P${c.pillar}: ${c.tag}` : `${c.subject}: ${c.tag}`;
document.getElementById('pillarTag').innerText = tagText;
document.getElementById('question').innerText = c.front;
document.getElementById('answer').innerText = c.back;
document.getElementById('answerBox').style.display = 'none';
document.getElementById('cardCount').innerText = `${current + 1}/${dueCards.length}`;
document.getElementById('feedbackMsg').innerText = '';
document.getElementById('cardBox').className = 'card';
document.getElementById('typeAnswerBox').style.display = 'none';
document.getElementById('mcqAnswerBox').style.display = 'none';
document.getElementById('showBtn').style.display = 'none';
document.getElementById('nextBtn').style.display = 'none';
document.getElementById('ratingBox').style.display = 'block';
if (answerMode === 'type') {
document.getElementById('typeAnswerBox').style.display = 'block';
document.getElementById('userAnswer').value = '';
document.getElementById('userAnswer').className = 'answer-input';
document.getElementById('userAnswer').disabled = false;
document.getElementById('checkBtn').style.display = 'inline-block';
document.getElementById('userAnswer').focus();
} else if (answerMode === 'mcq') {
document.getElementById('mcqAnswerBox').style.display = 'block';
renderMCQ(c);
} else {
document.getElementById('showBtn').style.display = 'inline-block';
}
}
function renderMCQ(card) {
const grid = document.getElementById('mcqGrid');
grid.innerHTML = '';
const shuffled = [...card.options].sort(() => Math.random() - 0.5);
shuffled.forEach(opt => {
const btn = document.createElement('button');
btn.className = 'mcq-btn';
btn.innerText = opt;
btn.onclick = () => checkMCQ(opt, card.back, btn);
grid.appendChild(btn);
});
}
function checkMCQ(selected, correct, btn) {
if (isAnswered) return;
isAnswered = true;
const buttons = document.querySelectorAll('.mcq-btn');
buttons.forEach(b => b.disabled = true);
if (selected === correct) {
btn.classList.add('correct');
document.getElementById('cardBox').classList.add('correct');
document.getElementById('feedbackMsg').innerText = '✅ Correct!';
document.getElementById('feedbackMsg').style.color = '#44ff88';
currentEase = 4;
setTimeout(() => rateAndNext(), 1500);
} else {
btn.classList.add('wrong');
document.getElementById('cardBox').classList.add('wrong');
document.getElementById('feedbackMsg').innerText = '❌ Wrong! Correct: ' + correct;
document.getElementById('feedbackMsg').style.color = '#ff4444';
buttons.forEach(b => {
if (b.innerText === correct) b.classList.add('correct');
});
currentEase = 1;
carryForwardCard = {...dueCards[current]};
showAnswerAfterWrong();
}
}
function checkTypedAnswer() {
if (isAnswered) return;
isAnswered = true;
const userAns = document.getElementById('userAnswer').value.trim().toLowerCase();
const correctAns = dueCards[current].back.toLowerCase();
const input = document.getElementById('userAnswer');
input.disabled = true;
document.getElementById('checkBtn').style.display = 'none';
if (userAns.includes(correctAns) || correctAns.includes(userAns) || userAns === correctAns) {
input.classList.add('correct');
document.getElementById('cardBox').classList.add('correct');
document.getElementById('feedbackMsg').innerText = '✅ Correct!';
document.getElementById('feedbackMsg').style.color = '#44ff88';
currentEase = 4;
setTimeout(() => rateAndNext(), 1500);
} else {
input.classList.add('wrong');
document.getElementById('cardBox').classList.add('wrong');
document.getElementById('feedbackMsg').innerText = '❌ Wrong! Correct: ' + dueCards[current].back;
document.getElementById('feedbackMsg').style.color = '#ff4444';
currentEase = 1;
carryForwardCard = {...dueCards[current]};
showAnswerAfterWrong();
}
}
function showAnswer() {
document.getElementById('answerBox').style.display = 'block';
document.getElementById('showBtn').style.display = 'none';
document.getElementById('typeAnswerBox').style.display = 'none';
document.getElementById('mcqAnswerBox').style.display = 'none';
}
function showAnswerAfterWrong() {
document.getElementById('answerBox').style.display = 'block';
document.getElementById('nextBtn').style.display = 'inline-block';
document.getElementById('ratingBox').style.display = 'none';
}
function rateAndNext() {
rate(currentEase);
}
function rate(ease) {
const card = dueCards[current];
const updated = ABST_SM2.calc(card, ease);
if (ease === 1) updated.due = Date.now() + 60 * 1000;
else if (ease === 2) updated.due = Date.now() + 10 * 60 * 1000;
else if (ease === 3) updated.due = Date.now() + 24 * 60 * 60 * 1000;
else updated.due = Date.now() + 4 * 24 * 60 * 60 * 1000;
const idx = allCards.findIndex(c => c.front === card.front);
allCards[idx] = updated;
stats.reviewed++;
updateStreak();
saveCards();
saveStats();
nextCard();
}
function nextCard() {
current++;
if (current >= dueCards.length) {
alert('🎯 Session Complete!\n\nReviewed: ' + dueCards.length + '\nStreak: ' + stats.streak + ' days\n\nJai ABST!');
filterDueCards();
} else {
showCard();
}
}
function updateStreak() {
const today = new Date().toDateString();
if (stats.lastDate!== today) {
const yesterday = new Date(Date.now() - 86400000).toDateString();
stats.streak = stats.lastDate === yesterday? stats.streak + 1 : 1;
stats.lastDate = today;
}
}
function updateStats() {
const now = Date.now();
const dueNow = allCards.filter(c => c.due <= now).length;
document.getElementById('dueCount').innerText = dueNow;
document.getElementById('streakCount').innerText = stats.streak;
document.getElementById('progress').innerText = stats.reviewed;
}
function saveCards() {
localStorage.setItem('abstBrainCards_' + currentSubject, JSON.stringify(allCards));
}
function saveStats() {
localStorage.setItem('abstBrainStats', JSON.stringify(stats));
}
// Event Listeners - BULLETPROOF
document.addEventListener('DOMContentLoaded', function() {
document.getElementById('homeBtn').onclick = () => window.location.href = './index.html';
document.getElementById('abstMode').onclick = () => switchSubject('abst');
document.getElementById('eduMode').onclick = () => switchSubject('edu');
document.getElementById('typeMode').onclick = () => switchAnswerMode('type');
document.getElementById('mcqMode').onclick = () => switchAnswerMode('mcq');
document.getElementById('flipMode').onclick = () => switchAnswerMode('flip');
document.getElementById('checkBtn').onclick = checkTypedAnswer;
document.getElementById('showBtn').onclick = showAnswer;
document.getElementById('nextBtn').onclick = rateAndNext;
document.getElementById('startEduBtn').onclick = saveAgeClass;
document.querySelector('.btn-again').onclick = () => rate(1);
document.querySelector('.btn-hard').onclick = () => rate(2);
document.querySelector('.btn-good').onclick = () => rate(3);
document.querySelector('.btn-easy').onclick = () => rate(4);
document.addEventListener('keydown', (e) => {
if (e.key === 'Enter' && answerMode === 'type' &&!isAnswered && document.getElementById('typeAnswerBox').style.display === 'block') {
checkTypedAnswer();
}
if (e.key === 'Escape') {
document.querySelectorAll('.age-modal').forEach(m => m.style.display = 'none');
document.documentElement.classList.remove('modal-open');
}
});
// Initialize
console.log('ABST BRAIN P24 v4.3 | 108 Mantra + 1000 Sahasra | INDIAN.001');
const savedAge = localStorage.getItem('abstUserAge');
const savedClass = localStorage.getItem('abstUserClass');
if (savedAge) userAge = parseInt(savedAge);
if (savedClass) userClass = savedClass;
loadCards();
updateStats();
});
