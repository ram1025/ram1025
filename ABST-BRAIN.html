   .btn-check { background:#ffaa00; color:#0a192f }

    async function loadMatrixFromGitHub() {
      // FIX 1: Space pettanu selector lo
      document.querySelectorAll('.mode-toggle.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(currentMode+'Mode')?.classList.add('active');

      const jsonFile = DATA_FILES[currentMode];
      try {
        document.querySelector('.card-content').innerHTML = `<div style="padding:40px;text-align:center;">Loading ${jsonFile}...</div>`;
        const response = await fetch(jsonFile);
        if (!response.ok) throw new Error('File not found');
        matrix = await response.json();
        matrix = matrix.map(card => {
          const saved = localStorage.getItem(`card_${card.id}`);
          return saved? {...card,...JSON.parse(saved)} : {...card, interval: 0, ease: 2.5, due: 0};
        });
        console.log(`✅ Loaded ${matrix.length} items from ${jsonFile}`);

        console.error('Load error:', err);

    function initBrain() {

    console.log(`Filtering for ${currentTrack}, found: ${dueCards.length} cards`);
  }
  if(dueCards.length === 0 && matrix.length > 0) {
    dueCards = matrix.filter(c => c.category.toUpperCase() === currentTrack);
  }
  currentIndex = 0;
  updateStats();

}

async function loadMatrixFromGitHub() {
