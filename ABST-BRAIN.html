<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABST BRAIN - Adaptive Sovereign Matrix Runtime</title>
    <style>
        :root { --bg-dark: #070c1e; --card-bg: #121b36; --accent-cyan: #00f5d4; --accent-gold: #ffb703; --border-color: #1b264f; }
        body { background-color: #020617; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .phone-container { width: 400px; background: #09132b; border: 2px solid var(--border-color); border-radius: 20px; padding: 20px; }
        .db-file-input { display: block; width: 100%; margin: 10px 0; padding: 10px; background: #020617; color: #fff; border: 1px solid var(--border-color); }
        .btn-action { width: 100%; padding: 15px; background: var(--accent-cyan); color: #000; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
<div class="phone-container">
    <h3>Sovereign Deck File Sync</h3>
    <input type="file" id="upload-raw-36" class="db-file-input">
    <input type="file" id="upload-raw-edu" class="db-file-input">
    <button class="btn-action" onclick="processDataFiles()">Mount Array Matrices</button>
</div>

<script>
    function processDataFiles() {
        const file36 = document.getElementById('upload-raw-36').files[0];
        const fileEdu = document.getElementById('upload-raw-edu').files[0];

        if (!file36 || !fileEdu) { alert("Please select both files."); return; }

        let loadedData = { "36-pillars": null, "education": null };
        let filesProcessed = 0;

        function readFile(file, key) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    loadedData[key] = JSON.parse(e.target.result);
                    filesProcessed++;
                    if (filesProcessed === 2) finalizeSync(loadedData);
                } catch (err) {
                    alert("Error parsing " + file.name + ": Check if it is a valid JSON array.");
                }
            };
            reader.readAsText(file);
        }

        readFile(file36, "36-pillars");
        readFile(fileEdu, "education");
    }

    function finalizeSync(data) {
        localStorage.setItem('abst_memory_vault', JSON.stringify(data));
        alert("Success: Matrix Mounted! Redirecting...");
        window.location.reload();
    }
</script>
</body>
</html>
