<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABST BRAIN - Adaptive Sovereign Matrix Runtime</title>
    <style>
        :root { --bg-dark: #070c1e; --card-bg: #121b36; --accent-cyan: #00f5d4; --accent-gold: #ffb703; --accent-red: #ff595e; --text-light: #ffffff; --text-muted: #798fa8; --border-color: #1b264f; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #020617; color: var(--text-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .phone-container { width: 100%; max-width: 410px; background: linear-gradient(180deg, #09132b 0%, #030614 100%); border: 3px solid var(--border-color); border-radius: 32px; padding: 24px 18px 18px 18px; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.6); min-height: 840px; display: flex; flex-direction: column; overflow: hidden; }
        .top-action-bar { display: flex; justify-content: space-between; align-items: center; background-color: rgba(18, 27, 54, 0.8); padding: 12px 14px; border-radius: 14px; border: 1px solid var(--border-color); margin-bottom: 15px; }
        .app-brand-title { font-size: 18px; font-weight: 800; color: #fff; }
        .deck-sub-state { font-size: 11px; color: var(--accent-gold); font-weight: 600; text-transform: uppercase; }
        .btn-nav-action { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; }
        .queue-badge-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .badge-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 6px; text-align: center; }
        .badge-box .label { font-size: 9px; color: var(--text-muted); }
        .badge-box .count { font-size: 15px; font-weight: 700; }
        .deck-selector-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .deck-tab { background: rgba(18, 27, 54, 0.4); border: 1px solid var(--border-color); color: var(--text-muted); padding: 10px; border-radius: 12px; font-size: 12px; cursor: pointer; text-align: center; }
        .deck-tab.active { border-color: var(--accent-gold); color: var(--accent-gold); background: rgba(255, 183, 3, 0.08); }
        .flashcard-arena { flex-grow: 1; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; margin-bottom: 15px; }
        .question-text { font-size: 17px; text-align: center; font-weight: 600; width: 100%; }
        .answer-box { width: 100%; display: none; border-top: 1px solid var(--border-color); padding-top: 18px; margin-top: 10px; color: #ffca3a; text-align: center; }
        .btn-reveal { width: 100%; background: linear-gradient(135deg, var(--accent-cyan) 0%, #00bbf9 100%); color: #010816; border: none; padding: 15px; border-radius: 14px; font-weight: 700; cursor: pointer; }
        .sm2-grading-row { display: none; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; }
        .grade-btn { padding: 14px 2px; border: none; border-radius: 10px; font-size: 11px; cursor: pointer; color: #fff; }
        .level-modal-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(4, 7, 16, 0.96); border-radius: 32px; display: none; justify-content: center; align-items: center; padding: 20px; z-index: 100; }
        .modal-content-wrapper { background-color: var(--card-bg); border: 2px solid var(--border-color); border-radius: 20px; width: 100%; padding: 24px; text-align: center; }
        .db-file-input { display: block; width: 100%; background: #090f1e; border: 1px dashed var(--border-color); color: #fff; padding: 12px; border-radius: 10px; margin-bottom: 16px; }
    </style>
</head>
<body>
<div class="phone-container">
    <div class="top-action-bar">
        <div>
            <span class="app-brand-title">ABST BRAIN</span>
            <div class="deck-sub-state" id="display-mode-label">No Data Mounted</div>
        </div>
        <button class="btn-nav-action" onclick="openDatabaseConfigModal()">⚙️ Sync</button>
    </div>
    <div class="queue-badge-row">
        <div class="badge-box"><div class="label">Fail</div><div class="count" id="badge-count-fail">0</div></div>
        <div class="badge-box"><div class="label">Queue</div><div class="count" id="badge-count-pending">0</div></div>
        <div class="badge-box"><div class="label">Locked</div><div class="count" id="badge-count-pass">0</div></div>
    </div>
    <div class="deck-selector-tabs">
        <div class="deck-tab active" id="tab-mode-36" onclick="toggleActiveChannel('36-pillars')">🏢 36 PILLARS</div>
        <div class="deck-tab" id="tab-mode-edu" onclick="toggleActiveChannel('education')">📖 EDUCATION</div>
    </div>
    <div class="flashcard-arena">
        <div class="question-text" id="display-question">Mount data files to start...</div>
        <div class="answer-box" id="display-answer"></div>
    </div>
    <div class="action-container">
        <button class="btn-reveal" id="trigger-reveal" onclick="triggerCardValueReveal()" style="display:none;">Show Answer</button>
        <div class="sm2-grading-row" id="sm2-grading-actions">
            <button class="grade-btn" style="background:#ff595e;" onclick="commitAssessmentExecution(1)">Again</button>
            <button class="grade-btn" style="background:#f77f00;" onclick="commitAssessmentExecution(2)">Hard</button>
            <button class="grade-btn" style="background:#06d6a0;" onclick="commitAssessmentExecution(3)">Good</button>
            <button class="grade-btn" style="background:#118ab2;" onclick="commitAssessmentExecution(4)">Easy</button>
        </div>
    </div>
    <div class="level-modal-overlay" id="db-config-modal-view">
        <div class="modal-content-wrapper">
            <div class="modal-title">Sovereign Deck File Sync</div>
            <input type="file" id="upload-raw-36" class="db-file-input" accept=".json,.db">
            <input type="file" id="upload-raw-edu" class="db-file-input" accept=".json,.db">
            <button onclick="initializeLocalFileBufferSync()" style="padding:10px; width:100%; cursor:pointer;">Mount Array Matrices</button>
        </div>
    </div>
</div>

<script>
    let memoryVaultStorage = { "36-pillars": [], "education": [] };
    let activeChannelKey = '36-pillars';
    let currentDeckPointerIndex = 0;

    window.onload = function() {
        const savedData = localStorage.getItem('abst_memory_vault');
        if(savedData) {
            memoryVaultStorage = JSON.parse(savedData);
            refreshInterfaceWorkspace();
        } else {
            openDatabaseConfigModal();
        }
    };

    function openDatabaseConfigModal() { document.getElementById('db-config-modal-view').style.display = 'flex'; }

    function initializeLocalFileBufferSync() {
        const h36 = document.getElementById('upload-raw-36').files[0];
        const hEdu = document.getElementById('upload-raw-edu').files[0];
        let operations = [];

        if (h36) operations.push(h36.text().then(d => memoryVaultStorage["36-pillars"] = JSON.parse(d)));
        if (hEdu) operations.push(hEdu.text().then(d => memoryVaultStorage["education"] = JSON.parse(d)));

        Promise.all(operations).then(() => {
            localStorage.setItem('abst_memory_vault', JSON.stringify(memoryVaultStorage));
            document.getElementById('db-config-modal-view').style.display = 'none';
            refreshInterfaceWorkspace();
        }).catch(e => alert("Sync Error: Check file format."));
    }

    function refreshInterfaceWorkspace() {
        let activeDeck = memoryVaultStorage[activeChannelKey];
        if(!activeDeck || activeDeck.length === 0) return;
        const card = activeDeck[currentDeckPointerIndex];
        document.getElementById('display-question').innerText = card.q;
        document.getElementById('display-answer').innerText = card.a;
        document.getElementById('trigger-reveal').style.display = 'block';
    }

    function triggerCardValueReveal() {
        document.getElementById('display-answer').style.display = 'block';
        document.getElementById('trigger-reveal').style.display = 'none';
        document.getElementById('sm2-grading-actions').style.display = 'grid';
    }
    
    function toggleActiveChannel(targetKey) {
        activeChannelKey = targetKey;
        currentDeckPointerIndex = 0;
        refreshInterfaceWorkspace();
    }
    
    function commitAssessmentExecution(score) {
        currentDeckPointerIndex++;
        refreshInterfaceWorkspace();
        document.getElementById('display-answer').style.display = 'none';
        document.getElementById('trigger-reveal').style.display = 'block';
        document.getElementById('sm2-grading-actions').style.display = 'none';
    }
</script>
</body>
</html>
