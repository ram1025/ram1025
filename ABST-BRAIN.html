<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0">
  <title>ABST BRAIN | P24 | INDIAN.001</title>
  <meta name="theme-color" content="#00ffaa">
  <meta name="description" content="ABST BRAIN - Sovereign Memory Engine. 25K concepts in 84 days. P24 KG to PhD.">
  <script src="sm2.js"></script>
  
  <style>
    * { margin:0; padding:0; box-sizing:border-box }
    body { 
      background:#0a192f; 
      color:#00ffaa; 
      font-family:system-ui,-apple-system,sans-serif; 
      padding:20px; 
      text-align:center;
      min-height:100vh
    }
.header { margin-bottom:20px; position:relative; display:flex; align-items:center; justify-content:center }
.header h1 { font-size:34px; text-shadow:0 0 15px #00ffaa; margin-bottom:8px; letter-spacing:2px; margin-left:70px }
.header p { color:#ffaa00; font-size:14px; font-weight:700; position:absolute; top:45px; width:100% }
.back-btn {
      position:absolute; 
      left:0; 
      top:5px;
      background:#1a2332; 
      color:#00ffaa; 
      border:1px solid #00ffaa; 
      padding:8px 16px; 
      border-radius:8px; 
      font-weight:700;
      cursor:pointer;
      font-size:14px;
      z-index:10
    }
.back-btn:hover { background:#00ffaa; color:#0a192f }
.mode-toggle,.answer-mode-toggle { 
      background:#112240; 
      border:1px solid #ffaa00; 
      padding:10px; 
      border-radius:10px; 
      margin:15px auto; 
      max-width:550px;
      display:flex;
      justify-content:center;
      gap:10px
    }
.mode-btn { 
      background:#1a2332; 
      color:#8892b0; 
      border:none; 
      padding:8px 20px; 
      border-radius:8px; 
      cursor:pointer;
      font-weight:700;
      font-size:13px
    }
.mode-btn.active { background:#ffaa00; color:#0a192f }
.card { 
      background:linear-gradient(145deg,#1a2332,#0f1723); 
      padding:35px; 
      border-radius:24px; 
      border:2px solid #00ffaa; 
      min-height:320px; 
      margin:20px auto; 
      max-width:550px; 
      box-shadow:0 0 40px #00ffaa20;
      position:relative;
      transition:border-color 0.3s
    }
.card.correct { border-color:#44ff88; box-shadow:0 0 40px #44ff8820 }
.card.wrong { border-color:#ff4444; box-shadow:0 0 40px #ff444420 }
.pillar { color:#ffaa00; font-size:13px; font-weight:800; margin-bottom:18px; text-transform:uppercase }
.question { font-size:24px; margin:25px 0; min-height:90px; line-height:1.4; color:#fff }
.answer-input {
      width:100%;
      padding:14px;
      background:#0a192f;
      border:2px solid #00ffaa;
      border-radius:10px;
      color:#fff;
      font-size:18px;
      text-align:center;
      margin:20px 0;
      transition:border-color 0.3s
    }
.answer-input.correct { border-color:#44ff88; background:#44ff8810 }
.answer-input.wrong { border-color:#ff4444; background:#ff444410 }
.mcq-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin:20px 0
    }
.mcq-btn {
      background:#1a2332;
      color:#fff;
      border:2px solid #00ffaa40;
      padding:15px;
      border-radius:10px;
      cursor:pointer;
      font-size:15px;
      transition:all 0.2s
    }
.mcq-btn:hover { border-color:#00ffaa; background:#00ffaa20 }
.mcq-btn.correct { background:#44ff88; color:#0a192f; border-color:#44ff88 }
.mcq-btn.wrong { background:#ff4444; color:#fff; border-color:#ff4444 }
.btn { 
      background:#00ffaa; 
      color:#0a192f; 
      padding:16px 32px; 
      border:none; 
      border-radius:14px; 
      margin:8px; 
      font-weight:900; 
      font-size:16px; 
      cursor:pointer;
      transition:all 0.2s
    }
.btn:hover { transform:scale(1.05); box-shadow:0 0 20px #00ffaa80 }
.btn-check { background:#ffaa00; color:#0a192f }
.btn-next { background:#44ff88; color:#0a192f; display:none }
.btn-again { background:#ff4444; color:#fff }
.btn-hard { background:#ffaa00; color:#0a192f }
.btn-good { background:#00ffaa; color:#0a192f }
.btn-easy { background:#44ff88; color:#0a192f }
.stats { 
      display:flex; 
      justify-content:space-around; 
      margin:35px auto; 
      max-width:550px; 
      font-size:15px;
      background:#1a2332;
      padding:20px;
      border-radius:16px;
      border:1px solid #00ffaa40
    }
.stats b { color:#fff; font-size:20px; display:block; margin-top:5px }
.footer { margin-top:50px; font-size:12px; opacity:0.6 }
.badge { 
      position:absolute; 
      top:-12px; 
      right:20px; 
      background:#ffaa00; 
      color:#0a192f; 
      padding:6px 12px; 
      border-radius:20px; 
      font-size:11px; 
      font-weight:900 
    }
.timer { color:#ffaa00; font-size:14px; margin-top:15px; font-weight:700 }
.feedback-msg { font-size:18px; font-weight:700; margin:15px 0; min-height:25px }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="window.location.href='./index.html'">← HOME</button>
    <h1>ABST BRAIN</h1>
    <p>SOVEREIGN ID: INDIAN.001 | P24: KG to PhD Memory Engine</p>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="abstMode" onclick="switchSubject('abst')">🏛️ 36 PILLARS</button>
    <button class="mode-btn" id="eduMode" onclick="switchSubject('edu')">📚 EDUCATION</button>
  </div>

  <div class="answer-mode-toggle">
    <button class="mode-btn active" id="typeMode" onclick="switchAnswerMode('type')">✍️ TYPE</button>
    <button class="mode-btn" id="mcqMode" onclick="switchAnswerMode('mcq')">🔘 MCQ</button>
    <button class="mode-btn" id="flipMode" onclick="switchAnswerMode('flip')">🔄 FLIP</button>
  </div>

  <div class="card" id="cardBox">
    <div class="badge" id="cardCount">1/10</div>
    <div class="pillar" id="pillarTag">P24: Loading...</div>
    <h2 class="question" id="question">Initializing...</h2>
    
    <div id="typeAnswerBox" style="display:none">
      <input type="text" class="answer-input" id="userAnswer" placeholder="Type your answer here..." autocomplete="off">
      <button class="btn btn-check" id="checkBtn" onclick="checkTypedAnswer()">CHECK ANSWER</button>
    </div>

    <div id="mcqAnswerBox" style="display:none">
      <div class="mcq-grid" id="mcqGrid"></div>
    </div>

    <button class="btn" id="showBtn" onclick="showAnswer()">SHOW ANSWER</button>

    <div class="feedback-msg" id="feedbackMsg"></div>

    <div id="answerBox" style="display:none">
      <hr style="border-color:#00ffaa; margin:30px 0; opacity:0.2">
      <h3 id="answer" style="color:#fff; font-size:20px; line-height:1.5"></h3>
      <button class="btn btn-next" id="nextBtn" onclick="rateAndNext()">NEXT QUESTION →</button>
      <div class="timer" id="timerBox" style="display:none">Next review in: <span id="timerCount">60</span>s</div>
      <div style="margin-top:40px" id="ratingBox">
        <button class="btn btn-again" onclick="rate(1)">AGAIN<br><small>1 min</small></button>
        <button class="btn btn-hard" onclick="rate(2)">HARD<br><small>10 min</small></button>
        <button class="btn btn-good" onclick="rate(3)">GOOD<br><small>1 day</small></button>
        <button class="btn btn-easy" onclick="rate(4)">EASY<br><small>4 days</small></button>
      </div>
    </div>
  </div>

  <div class="stats">
    <div>Due Now<br><b id="dueCount">0</b></div>
    <div>Streak<br><b id="streakCount">0</b> days</div>
    <div>Total<br><b id="progress">0</b>/25000</div>
  </div>

  <div class="footer">
    ABST P24 Civilization OS | SM-2 Algorithm + Active Recall | INDIAN.001
  </div>

<script>
const abstCards = [
  {pillar:2,tag:"Solar Power",front:"ABST P2 Solar capacity enti Vizag Mother Hub lo?",back:"500 MW",options:["200 MW","500 MW","1000 MW","50 MW"],type:"abst"},
  {pillar:6,tag:"Green Fuel",front:"ABST Fuel cost per liter?",back:"₹47",options:["₹100","₹47","₹75","₹25"],type:"abst"},
  {pillar:10,tag:"Water Sovereignty",front:"P10 AWG Plant daily capacity?",back:"10,000 L/day",options:["1,000 L/day","5,000 L/day","10,000 L/day","50,000 L/day"],type:"abst"},
  {pillar:24,tag:"KG to PhD",front:"ABST P24 lo enni days lo 25K concepts?",back:"84 days",options:["30 days","84 days","365 days","180 days"],type:"abst"},
  {pillar:36,tag:"Agni-Pariksha",front:"P36 fail aithe emavthundi?",back:"Personal assets lose",options:["Warning","Fine","Personal assets lose","Nothing"],type:"abst"},
  {pillar:1,tag:"Plasma Plant",front:"P1 Plasma Plant waste capacity?",back:"200 tons/day",options:["50 tons/day","200 tons/day","500 tons/day","1000 tons/day"],type:"abst"},
  {pillar:35,tag:"Jarvis AI",front:"Jarvis AI Core response time?",back:"0.2s",options:["1s","0.2s","5s","0.5s"],type:"abst"},
  {pillar:21,tag:"Footstep Energy",front:"P21 Walkways ekkada untayi?",back:"Matru-Shakti Residential",options:["P1 Plant","Matru-Shakti Residential","P24 School","P30 Mall"],type:"abst"},
  {pillar:30,tag:"RVM Network",front:"RVM full form?",back:"Resource Vending Machine",options:["Recycle Vending Machine","Resource Vending Machine","Revenue Vending Machine","Robot Vending Machine"],type:"abst"},
  {pillar:28,tag:"Simulation Game",front:"P28 Game purpose enti?",back:"KG nunchi CEO training",options:["Entertainment","KG nunchi CEO training","Gaming","Timepass"],type:"abst"}
];

const eduCards = [
  {subject:"KG",tag:"Alphabets",front:"A for?",back:"Apple",options:["Ant","Apple","Aeroplane","Arrow"],type:"edu"},
  {subject:"KG",tag:"Numbers",front:"1 + 1 =?",back:"2",options:["1","2","3","11"],type:"edu"},
  {subject:"KG",tag:"Colors",front:"Sky color?",back:"Blue",options:["Red","Green","Blue","Yellow"],type:"edu"},
  {subject:"KG",tag:"Shapes",front:"How many sides in triangle?",back:"3",options:["2","3","4","5"],type:"edu"},
  {subject:"KG",tag:"Animals",front:"Dog sound?",back:"Bow Bow",options:["Meow","Bow Bow","Moo","Chirp"],type:"edu"},
  {subject:"Math",tag:"1st Class",front:"5 - 3 =?",back:"2",options:["1","2","3","8"],type:"edu"},
  {subject:"EVS",tag:"2nd Class",front:"We drink?",back:"Water",options:["Sand","Water","Stone","Fire"],type:"edu"},
  {subject:"Math",tag:"3rd Class",front:"10 × 10 =?",back:"100",options:["10","20","100","1000"],type:"edu"},
  {subject:"Science",tag:"4th Class",front:"Plant ki food elaga vastundi?",back:"Photosynthesis",options:["Eating","Photosynthesis","Drinking","Sleeping"],type:"edu"},
  {subject:"Social",tag:"5th Class",front:"India capital?",back:"New Delhi",options:["Mumbai","New Delhi","Kolkata","Chennai"],type:"edu"},
  {subject:"Math",tag:"6th Class",front:"Area of Square formula?",back:"side × side",options:["l×b","side×side","πr²","½bh"],type:"edu"},
  {subject:"Science",tag:"7th Class",front:"Water formula?",back:"H₂O",options:["CO₂","H₂O","O₂","NaCl"],type:"edu"},
  {subject:"Geography",tag:"8th Class",front:"Largest ocean?",back:"Pacific Ocean",options:["Atlantic","Indian","Pacific Ocean","Arctic"],type:"edu"},
  {subject:"History",tag:"9th Class",front:"Gandhiji birth year?",back:"1869",options:["1947","1869","1919","1857"],type:"edu"},
  {subject:"Math",tag:"10th Class",front:"Pythagoras theorem?",back:"a²+b²=c²",options:["a+b=c","a²+b²=c²","a²-b²=c²","2ab=c"],type:"edu"},
  {subject:"Physics",tag:"11th Class",front:"Unit of Force?",back:"Newton",options:["Joule","Newton","Watt","Pascal"],type:"edu"},
  {subject:"Chemistry",tag:"12th Class",front:"Atomic number of Carbon?",back:"6",options:["4","6","8","12"],type:"edu"},
  {subject:"Biology",tag:"12th Class",front:"Powerhouse of cell?",back:"Mitochondria",options:["Nucleus","Mitochondria","Ribosome","Chloroplast"],type:"edu"},
  {subject:"GK",tag:"UPSC",front:"Who wrote Indian Constitution?",back:"Dr. B.R. Ambedkar",options:["Nehru","Dr. B.R. Ambedkar","Gandhi","Patel"],type:"edu"},
  {subject:"Economics",tag:"Degree",front:"GDP full form?",back:"Gross Domestic Product",options:["General Data Point","Gross Domestic Product","Global Development Plan","Goods Daily Price"],type:"edu"},
  {subject:"Computer",tag:"BTech",front:"HTML full form?",back:"HyperText Markup Language",options:["HighTech Modern Language","HyperText Markup Language","Home Tool Markup Language","Hyper Transfer Main Link"],type:"edu"},
  {subject:"Physics",tag:"PhD",front:"Heisenberg Uncertainty Principle?",back:"Δx·Δp ≥ ħ/2",options:["E=mc²","Δx·Δp ≥ ħ/2","F=ma","V=IR"],type:"edu"},
  {subject:"Math",tag:"PhD",front:"Euler's Identity?",back:"e^(iπ)+1=0",options:["a²+b²=c²","e^(iπ)+1=0","F=ma","∫eˣ=1"],type:"edu"},
  {subject:"GK",tag:"India",front:"National Animal of India?",back:"Tiger",options:["Lion","Tiger","Elephant","Peacock"],type:"edu"},
  {subject:"GK",tag:"World",front:"Largest Country by area?",back:"Russia",options:["China","USA","Russia","Canada"],type:"edu"},
  {subject:"GK",tag:"Space",front:"First person on Moon?",back:"Neil Armstrong",options:["Yuri Gagarin","Neil Armstrong","Rakesh Sharma","Kalpana Chawla"],type:"edu"},
  {subject:"GK",tag:"Sports",front:"Cricket World Cup 2023 winner?",back:"Australia",options:["India","Australia","England","Pakistan"],type:"edu"},
  {subject:"GK",tag:"Tech",front:"CEO of Tesla?",back:"Elon Musk",options:["Bill Gates","Elon Musk","Sundar Pichai","Mark Zuckerberg"],type:"edu"},
  {subject:"Science",tag:"6th Class",front:"Sun rises in?",back:"East",options:["West","East","North","South"],type:"edu"},
  {subject:"Math",tag:"7th Class",front:"Square root of 144?",back:"12",options:["10","12","14","16"],type:"edu"}
];

let currentSubject = 'abst';
let answerMode = 'type';
let allCards = [...abstCards];
let dueCards = [];
let current = 0;
let stats = JSON.parse(localStorage.getItem('abstBrainStats')) || { reviewed: 0, streak: 0, lastDate: null };
let currentEase = 0;
let isAnswered = false;

function loadCards() {
  const saved = localStorage.getItem('abstBrainCards_' + currentSubject);
  if (saved) {
    allCards = JSON.parse(saved);
  } else {
    allCards = currentSubject === 'abst'? [...abstCards] : [...eduCards];
    allCards.forEach(c => {
      c.reps = 0; c.ease = 2.5; c.interval = 0; c.due = Date.now();
    });
  }
  filterDueCards();
}

function filterDueCards() {
  const now = Date.now();
  dueCards = allCards.filter(c => c.due <= now);
  if (dueCards.length === 0) {
    dueCards = allCards.slice(0, 1);
  }
  current = 0;
  updateStats();
  showCard();
}

function switchSubject(mode) {
  currentSubject = mode;
  document.getElementById('abstMode').classList.toggle('active', mode === 'abst');
  document.getElementById('eduMode').classList.toggle('active', mode === 'edu');
  saveCards();
  loadCards();
}

function switchAnswerMode(mode) {
  answerMode = mode;
  document.getElementById('typeMode').classList.toggle('active', mode === 'type');
  document.getElementById('mcqMode').classList.toggle('active', mode === 'mcq');
  document.getElementById('flipMode').classList.toggle('active', mode === 'flip');
  showCard();
}

function showCard() {
  if (current >= dueCards.length) current = 0;
  isAnswered = false;
  
  const c = dueCards[current];
  const tagText = c.type === 'abst'? `P${c.pillar}: ${c.tag}` : `${c.subject}: ${c.tag}`;
  
  document.getElementById('pillarTag').innerText = tagText;
  document.getElementById('question').innerText = c.front;
  document.getElementById('answer').innerText = c.back;
  document.getElementById('answerBox').style.display = 'none';
  document.getElementById('cardCount').innerText = `${current + 1}/${dueCards.length}`;
  document.getElementById('feedbackMsg').innerText = '';
  document.getElementById('cardBox').className = 'card';
  
  document.getElementById('typeAnswerBox').style.display = 'none';
  document.getElementById('mcqAnswerBox').style.display = 'none';
  document.getElementById('showBtn').style.display = 'none';
  document.getElementById('timerBox').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  
  if (answerMode === 'type') {
    document.getElementById('typeAnswerBox').style.display = 'block';
    document.getElementById('userAnswer').value = '';
    document.getElementById('userAnswer').className = 'answer-input';
    document.getElementById('userAnswer').disabled = false;
    document.getElementById('checkBtn').style.display = 'inline-block';
    document.getElementById('userAnswer').focus();
  } else if (answerMode === 'mcq') {
    document.getElementById('mcqAnswerBox').style.display = 'block';
    renderMCQ(c);
  } else {
    document.getElementById('showBtn').style.display = 'inline-block';
  }
}

function renderMCQ(card) {
  const grid = document.getElementById('mcqGrid');
  grid.innerHTML = '';
  const shuffled = [...card.options].sort(() => Math.random() - 0.5);
  
  shuffled.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'mcq-btn';
    btn.innerText = opt;
    btn.onclick = () => checkMCQ(opt, card.back, btn);
    grid.appendChild(btn);
  });
}

function checkMCQ(selected, correct, btn) {
  if (isAnswered) return;
  isAnswered = true;
  
  const buttons = document.querySelectorAll('.mcq-btn');
  buttons.forEach(b => b.disabled = true);
  
  if (selected === correct) {
    btn.classList.add('correct');
    document.getElementById('cardBox').classList.add('correct');
    document.getElementById('feedbackMsg').innerText = '✅ Correct!';
    document.getElementById('feedbackMsg').style.color = '#44ff88';
    currentEase = 4;
    setTimeout(() => rateAndNext(), 2000);
  } else {
    btn.classList.add('wrong');
    document.getElementById('cardBox').classList.add('wrong');
    document.getElementById('feedbackMsg').innerText = '❌ Wrong! Correct: ' + correct;
    document.getElementById('feedbackMsg').style.color = '#ff4444';
    buttons.forEach(b => {
      if (b.innerText === correct) b.classList.add('correct');
    });
    currentEase = 1;
    showAnswerAfterWrong();
  }
}

function checkTypedAnswer() {
  if (isAnswered) return;
  isAnswered = true;
  
  const userAns = document.getElementById('userAnswer').value.trim().toLowerCase();
  const correctAns = dueCards[current].back.toLowerCase();
  const input = document.getElementById('userAnswer');
  
  input.disabled = true;
  document.getElementById('checkBtn').style.display = 'none';
  
  if (userAns.includes(correctAns) || correctAns.includes(userAns) || userAns === correctAns) {
    input.classList.add('correct');
    document.getElementById('cardBox').classList.add('correct');
    document.getElementById('feedbackMsg').innerText = '✅ Correct!';
    document.getElementById('feedbackMsg').style.color = '#44ff88';
    currentEase = 4;
    setTimeout(() => rateAndNext(), 2000);
  } else {
    input.classList.add('wrong');
    document.getElementById('cardBox').classList.add('wrong');
    document.getElementById('feedbackMsg').innerText = '❌ Wrong! Correct: ' + dueCards[current].back;
    document.getElementById('feedbackMsg').style.color = '#ff4444';
    currentEase = 1;
    showAnswerAfterWrong();
  }
}

function showAnswer() {
  document.getElementById('answerBox').style.display = 'block';
  document.getElementById('showBtn').style.display = 'none';
  document.getElementById('typeAnswerBox').style.display = 'none';
  document.getElementById('mcqAnswerBox').style.display = 'none';
}

function showAnswerAfterWrong() {
  document.getElementById('answerBox').style.display = 'block';
  document.getElementById('nextBtn').style.display = 'inline-block';
  document.getElementById('ratingBox').style.display = 'none';
}

function rateAndNext() {
  rate(currentEase);
}

function rate(ease) {
  const card = dueCards[current];
  const updated = ABST_SM2.calc(card, ease);
  
  if (ease === 1) updated.due = Date.now() + 60 * 1000;
  else if (ease === 2) updated.due = Date.now() + 10 * 60 * 1000;
  else if (ease === 3) updated.due = Date.now() + 24 * 60 * 60 * 1000;
  else updated.due = Date.now() + 4 * 24 * 60 * 60 * 1000;
  
  const idx = allCards.findIndex(c => c.front === card.front);
  allCards[idx] = updated;
  
  stats.reviewed++;
  updateStreak();
  saveCards();
  saveStats();
  nextCard();
}

function nextCard() {
  current++;
  if (current >= dueCards.length) {
    alert('🎯 Session Complete!\n\nReviewed: ' + dueCards.length + '\nStreak: ' + stats.streak + ' days\n\nJai ABST!');
    filterDueCards();
  } else {
    showCard();
  }
}

function updateStreak() {
  const today = new Date().toDateString();
  if (stats.lastDate!== today) {
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    stats.streak = stats.lastDate === yesterday? stats.streak + 1 : 1;
    stats.lastDate = today;
  }
}

function updateStats() {
  const now = Date.now();
  const dueNow = allCards.filter(c => c.due <= now).length;
  document.getElementById('dueCount').innerText = dueNow;
  document.getElementById('streakCount').innerText = stats.streak;
  document.getElementById('progress').innerText = stats.reviewed;
}

function saveCards() {
  localStorage.setItem('abstBrainCards_' + currentSubject, JSON.stringify(allCards));
}

function saveStats() {
  localStorage.setItem('abstBrainStats', JSON.stringify(stats));
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && answerMode === 'type' &&!isAnswered && document.getElementById('typeAnswerBox').style.display === 'block') {
    checkTypedAnswer();
  }
});

window.onload = () => {
  console.log('ABST BRAIN P24 v3.2 | KG to PhD + GK | Active Recall | INDIAN.001');
  loadCards();
  updateStats();
};
</script>
</body>
  </html>
