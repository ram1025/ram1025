<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABST BRAIN | P24 | INDIAN.001</title>
  <meta name="theme-color" content="#00ffaa">
  <meta name="description" content="ABST BRAIN - Sovereign Memory Engine. 25K concepts in 84 days. P24 KG to PhD.">
  
  <!-- SM-2 Algorithm Import -->
  <script src="sm2.js"></script>
  
  <style>
    * { margin:0; padding:0; box-sizing:border-box }
    body { 
      background:#0a0f1a; 
      color:#00ffaa; 
      font-family:system-ui,-apple-system,sans-serif; 
      padding:20px; 
      text-align:center;
      min-height:100vh
    }
  .header { margin-bottom:30px }
  .header h1 { font-size:36px; text-shadow:0 0 15px #00ffaa; margin-bottom:8px; letter-spacing:2px }
  .header p { color:#ffaa00; font-size:14px; font-weight:700 }
  .card { 
      background:linear-gradient(145deg,#1a2332,#0f1723); 
      padding:35px; 
      border-radius:24px; 
      border:2px solid #00ffaa; 
      min-height:320px; 
      margin:20px auto; 
      max-width:550px; 
      box-shadow:0 0 40px #00ffaa20;
      position:relative
    }
  .pillar { color:#ffaa00; font-size:13px; font-weight:800; margin-bottom:18px; text-transform:uppercase }
  .question { font-size:24px; margin:25px 0; min-height:90px; line-height:1.4; color:#fff }
  .btn { 
      background:#00ffaa; 
      color:#0a0f1a; 
      padding:16px 32px; 
      border:none; 
      border-radius:14px; 
      margin:8px; 
      font-weight:900; 
      font-size:16px; 
      cursor:pointer;
      transition:all 0.2s
    }
  .btn:hover { transform:scale(1.05); box-shadow:0 0 20px #00ffaa80 }
  .btn-again { background:#ff4444; color:#fff }
  .btn-hard { background:#ffaa00; color:#0a0f1a }
  .btn-good { background:#00ffaa; color:#0a0f1a }
  .btn-easy { background:#44ff88; color:#0a0f1a }
  .stats { 
      display:flex; 
      justify-content:space-around; 
      margin:35px auto; 
      max-width:550px; 
      font-size:15px;
      background:#1a2332;
      padding:20px;
      border-radius:16px;
      border:1px solid #00ffaa40
    }
  .stats b { color:#fff; font-size:20px; display:block; margin-top:5px }
  .footer { margin-top:50px; font-size:12px; opacity:0.6 }
  .badge { 
      position:absolute; 
      top:-12px; 
      right:20px; 
      background:#ffaa00; 
      color:#0a0f1a; 
      padding:6px 12px; 
      border-radius:20px; 
      font-size:11px; 
      font-weight:900 
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ABST BRAIN</h1>
    <p>SOVEREIGN ID: INDIAN.001 | P24: KG to PhD Memory Engine</p>
  </div>

  <div class="card" id="cardBox">
    <div class="badge" id="cardCount">1/10</div>
    <div class="pillar" id="pillarTag">P24: Loading...</div>
    <h2 class="question" id="question">Initializing 25K Concept Engine...</h2>
    <button class="btn" id="showBtn" onclick="showAnswer()">SHOW ANSWER</button>

    <div id="answerBox" style="display:none">
      <hr style="border-color:#00ffaa; margin:30px 0; opacity:0.2">
      <h3 id="answer" style="color:#fff; font-size:20px; line-height:1.5"></h3>
      <div style="margin-top:40px">
        <button class="btn btn-again" onclick="rate(1)">AGAIN<br><small>1 min</small></button>
        <button class="btn btn-hard" onclick="rate(2)">HARD<br><small>6 min</small></button>
        <button class="btn btn-good" onclick="rate(3)">GOOD<br><small>1 day</small></button>
        <button class="btn btn-easy" onclick="rate(4)">EASY<br><small>4 days</small></button>
      </div>
    </div>
  </div>

  <div class="stats">
    <div>Due Today<br><b id="dueCount">0</b></div>
    <div>Streak<br><b id="streakCount">21</b> days</div>
    <div>25K Goal<br><b id="progress">0</b>/25000</div>
  </div>

  <div class="footer">
    ABST P24 Civilization OS | SM-2 Algorithm + 36 Pillar Videos | INDIAN.001<br>
    Built for 10 Lakh Crore Bharat Infrastructure
  </div>

<script>
// ABST PILLAR CARDS - P24 Dataset
const cards = [
  {pillar:2,tag:"Solar Power",front:"ABST P2 Solar capacity enti Vizag Mother Hub lo?",back:"500 MW | Zero Diesel Mission | 50 Acres | Powers P1-P36"},
  {pillar:6,tag:"Green Fuel",front:"Diesel vs ABST Fuel cost comparison?",back:"Diesel ₹100/Liter vs ABST Fuel ₹47/Liter | P6 Plasma Plant | Saves ₹53/L"},
  {pillar:10,tag:"Water Sovereignty",front:"P10 Amrutavarsha AWG Plant em chestundi?",back:"Air nunchi Water | 10,000 L/day | TDS < 50 | P11 Packaged Water → Market"},
  {pillar:24,tag:"KG to PhD",front:"ABST P24 goal enti?",back:"KG to PhD free education | 25K concepts in 84 days | Civilization OS | Govt Schools"},
  {pillar:36,tag:"Agni-Pariksha",front:"INDIAN.001 P36 contract ante?",back:"Fail aithe personal assets anni lose | MD Leadership Mandate | Jamin teesukoni kattina Hub"},
  {pillar:1,tag:"Plasma Plant",front:"P1 Plasma Plant use enti?",back:"Waste to Energy | 200 tons/day | Zero landfill | Powers P2 Solar backup"},
  {pillar:35,tag:"Jarvis AI",front:"Jarvis AI Core response time?",back:"0.2s Response | 36 Pillars Control | 24/7 Sovereign Brain | Runs on P2 Solar"},
  {pillar:21,tag:"Footstep Energy",front:"P21 Footstep Energy Walkways ekkada?",back:"Matru-Shakti Residential | Walk → Electricity | P19 Tunnel connect | P25 Gen 2"},
  {pillar:30,tag:"RVM Network",front:"P30 RVM Network full form?",back:"Resource Vending Machine | ABST Coin rewards | Plastic→Money | P24 School Integration"},
  {pillar:28,tag:"Simulation Game",front:"P28 Sovereign Simulation Game purpose?",back:"Students ki 36 Pillars game lo nerpinchadam | KG nunchi CEO training | P24 Syllabus"}
];

let current = 0;
let sessionStats = { reviewed: 0, correct: 0 };

// Initialize Cards with SM2 defaults
cards.forEach(card => {
  card.reps = 0;
  card.ease = 2.5;
  card.interval = 0;
  card.due = Date.now();
});

function showCard() {
  if (current >= cards.length) current = 0;
  
  const c = cards[current];
  document.getElementById('pillarTag').innerText = `P${c.pillar}: ${c.tag}`;
  document.getElementById('question').innerText = c.front;
  document.getElementById('answer').innerText = c.back;
  document.getElementById('answerBox').style.display = 'none';
  document.getElementById('showBtn').style.display = 'inline-block';
  document.getElementById('cardCount').innerText = `${current + 1}/${cards.length}`;
  document.getElementById('dueCount').innerText = cards.length - sessionStats.reviewed;
}

function showAnswer() {
  document.getElementById('answerBox').style.display = 'block';
  document.getElementById('showBtn').style.display = 'none';
}

function rate(ease) {
  // Use external SM2.js
  cards[current] = ABST_SM2.calc(cards[current], ease);
  cards[current] = ABST_SM2.pillarBoost(cards[current], cards[current].pillar);
  
  sessionStats.reviewed++;
  if (ease >= 3) sessionStats.correct++;
  
  console.log(`P24 SM-2: Card ${current + 1} | Ease ${ease} | Next: ${cards[current].interval} days`);
  
  // Update stats
  document.getElementById('progress').innerText = sessionStats.reviewed;
  
  // Next card
  current++;
  if (sessionStats.reviewed >= cards.length) {
    alert('🎯 ABST BRAIN Session Complete! \n\nReviewed: ' + sessionStats.reviewed + '\nAccuracy: ' + Math.round(sessionStats.correct/sessionStats.reviewed*100) + '%\n\nJai ABST! P24 Zindabad!');
    sessionStats = { reviewed: 0, correct: 0 };
    current = 0;
  }
  
  showCard();
}

// Init on load
window.onload = () => {
  console.log('ABST BRAIN P24 Initialized | INDIAN.001');
  console.log('SM2 Engine Version:', ABST_SM2.version);
  showCard();
};
</script>
</body>
</html>
