<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABST BRAIN | P24 | INDIAN.001</title>
  <meta name="theme-color" content="#00ffaa">
  <style>
    * { margin:0; padding:0; box-sizing:border-box }
    html { scroll-behavior: smooth; font-size: 16px; }
    body { background:#0a192f; color:#00ffaa; font-family:system-ui,-apple-system,sans-serif; padding:20px; text-align:center; min-height:100vh }
  .header { margin-bottom:20px; position:relative; display:flex; align-items:center; justify-content:center }
  .header h1 { font-size:34px; text-shadow:0 0 15px #00ffaa; margin-bottom:8px; letter-spacing:2px; margin-left:70px }
  .header p { color:#ffaa00; font-size:14px; font-weight:700; position:absolute; top:45px; width:100% }
  .back-btn { position:absolute; left:0; top:5px; background:#1a2332; color:#00ffaa; border:1px solid #00ffaa; padding:8px 16px; border-radius:8px; font-weight:700; cursor:pointer; font-size:14px; z-index:10 }
  .mode-toggle,.answer-mode-toggle {background:#112240; border:1px solid #ffaa00; padding:10px; border-radius:10px; margin:15px auto; max-width:550px; display:flex; justify-content:center; gap:8px; flex-wrap:wrap }
  .mode-btn {background:#1a2332; color:#8892b0; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:700; font-size:12px; flex:1; min-width:150px;}
  .mode-btn.active { background:#ffaa00; color:#0a192f }
  .card { background:linear-gradient(145deg,#1a2332,#0f1723); padding:35px; border-radius:24px; border:2px solid #00ffaa; min-height:320px; margin:20px auto; max-width:550px; box-shadow:0 0 40px #00ffaa20; position:relative; transition:border-color 0.3s }
  .card.correct { border-color:#44ff88; box-shadow:0 0 40px #44ff8820 }
  .card.wrong { border-color:#ff4444; box-shadow:0 0 40px #ff444420 }
  .pillar { color:#ffaa00; font-size:13px; font-weight:800; margin-bottom:18px; text-transform:uppercase }
  .question { font-size:24px; margin:25px 0; min-height:90px; line-height:1.4; color:#fff }
  .answer-input { width:100%; padding:14px; background:#0a192f; border:2px solid #00ffaa; border-radius:10px; color:#fff; font-size:18px; text-align:center; margin:20px 0; transition:border-color 0.3s }
  .answer-input.correct { border-color:#44ff88; background:#44ff8810 }
  .answer-input.wrong { border-color:#ff4444; background:#ff444410 }
  .mcq-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:20px 0 }
  .mcq-btn { background:#1a2332; color:#fff; border:2px solid #00ffaa40; padding:15px; border-radius:10px; cursor:pointer; font-size:15px; transition:all 0.2s }
  .mcq-btn:hover { border-color:#00ffaa; background:#00ffaa20 }
  .mcq-btn.correct { background:#44ff88; color:#0a192f; border-color:#44ff88 }
  .mcq-btn.wrong { background:#ff4444; color:#fff; border-color:#ff4444 }
  .mcq-btn:disabled { opacity:0.6; cursor:not-allowed }
  .btn { background:#00ffaa; color:#0a192f; padding:16px 32px; border:none; border-radius:14px; margin:8px; font-weight:900; font-size:16px; cursor:pointer; transition:all 0.2s }
  .btn:hover { transform:scale(1.05); box-shadow:0 0 20px #00ffaa80 }
  .btn-check { background:#ffaa00; color:#0a192f }
  .quality-btns { display:flex; gap:8px; justify-content:center; margin:20px 0; flex-wrap:wrap }
  .btn-again { background:#ff4444; color:#fff; padding:12px 20px }
  .btn-hard { background:#ffaa00; color:#0a192f; padding:12px 20px }
  .btn-good { background:#00ffaa; color:#0a192f; padding:12px 20px }
  .btn-easy { background:#44ff88; color:#0a192f; padding:12px 20px }
  .stats { display:flex; justify-content:space-around; margin:35px auto; max-width:550px; font-size:15px; background:#1a2332; padding:20px; border-radius:16px; border:1px solid #00ffaa40 }
  .stats b { color:#fff; font-size:20px; display:block; margin-top:5px }
  .footer { margin-top:50px; font-size:12px; opacity:0.6 }
  .loading { color:#ffaa00; font-size:18px; padding:40px; text-align:center }
  .sub-btn { padding:12px 8px; background:#1a2332; border:1px solid #00ffaa40; border-radius:8px; color:#00ffaa; font-size:13px; font-weight:bold; cursor:pointer; transition:0.2s; }
  .sub-btn:active {background:#00ffaa; color:#0a192f; transform:scale(0.95);}
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" id="homeBtn">← CLOSE</button>
    <h1>ABST BRAIN</h1>
    <p>SOVEREIGN ID: INDIAN.001 | 108 Mantra + 1000 Sahasra</p>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn" id="pillarsMode">🏛 36 PILLARS - 108</button>
    <button class="mode-btn" id="schoolMode" onclick="showSchoolList()">📚 SCHOOL - 280</button>
    <button class="mode-btn" id="collegeMode" onclick="showCollegeList()">🎓 COLLEGE - 250</button>
    <button class="mode-btn" id="competitiveMode" onclick="showCompetitiveList()">🏆 COMPETITIVE - 340</button>
    <button class="mode-btn" id="otherMode" onclick="showOthersList()">📖 GK/PHD - 130</button>
  </div>

  <div id="schoolList" class="sub-list" style="display:none; margin:15px auto; max-width:550px; background:#112240; padding:15px; border-radius:12px; border:1px solid #00ffaa40;">
    <div style="color:#ffd700; font-size:13px; font-weight:bold; margin-bottom:12px;">SELECT CLASS:</div>
    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px;">
      <button class="sub-btn" onclick="selectTrack('LKG')">LKG</button>
      <button class="sub-btn" onclick="selectTrack('UKG')">UKG</button>
      <button class="sub-btn" onclick="selectTrack('CLASS1')">Class 1</button>
      <button class="sub-btn" onclick="selectTrack('CLASS2')">Class 2</button>
      <button class="sub-btn" onclick="selectTrack('CLASS3')">Class 3</button>
      <button class="sub-btn" onclick="selectTrack('CLASS4')">Class 4</button>
      <button class="sub-btn" onclick="selectTrack('CLASS5')">Class 5</button>
      <button class="sub-btn" onclick="selectTrack('CLASS6')">Class 6</button>
      <button class="sub-btn" onclick="selectTrack('CLASS7')">Class 7</button>
      <button class="sub-btn" onclick="selectTrack('CLASS8')">Class 8</button>
      <button class="sub-btn" onclick="selectTrack('CLASS9')">Class 9</button>
      <button class="sub-btn" onclick="selectTrack('CLASS10')">Class 10</button>
      <button class="sub-btn" onclick="selectTrack('CLASS11')">Class 11</button>
      <button class="sub-btn" onclick="selectTrack('CLASS12')">Class 12</button>
    </div>
  </div>

  <div id="collegeList" class="sub-list" style="display:none; margin:15px auto; max-width:550px; background:#112240; padding:15px; border-radius:12px; border:1px solid #00ffaa40;">
    <div style="color:#ffd700; font-size:13px; font-weight:bold; margin-bottom:12px;">SELECT STREAM:</div>
    <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:8px;">
      <button class="sub-btn" onclick="selectTrack('DEGREE')">Degree</button>
      <button class="sub-btn" onclick="selectTrack('ENGINEERING')">Engineering</button>
      <button class="sub-btn" onclick="selectTrack('MBBS')">MBBS</button>
      <button class="sub-btn" onclick="selectTrack('MBA-HR')">MBA-HR</button>
      <button class="sub-btn" onclick="selectTrack('MBA-FIN')">MBA-FIN</button>
    </div>
  </div>

  <div id="competitiveList" class="sub-list" style="display:none; margin:15px auto; max-width:550px; background:#112240; padding:15px; border-radius:12px; border:1px solid #00ffaa40;">
    <div style="color:#ffd700; font-size:13px; font-weight:bold; margin-bottom:12px;">SELECT EXAM:</div>
    <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:8px;">
      <button class="sub-btn" onclick="selectTrack('UPSC')">UPSC</button>
      <button class="sub-btn" onclick="selectTrack('NEET')">NEET</button>
      <button class="sub-btn" onclick="selectTrack('JEE')">JEE</button>
      <button class="sub-btn" onclick="selectTrack('SSC')">SSC</button>
      <button class="sub-btn" onclick="selectTrack('BANKING')">BANKING</button>
    </div>
  </div>

  <div id="othersList" class="sub-list" style="display:none; margin:15px auto; max-width:550px; background:#112240; padding:15px; border-radius:12px; border:1px solid #00ffaa40;">
    <div style="color:#ffd700; font-size:13px; font-weight:bold; margin-bottom:12px;">SELECT LEVEL:</div>
    <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:8px;">
      <button class="sub-btn" onclick="selectTrack('GK')">General Knowledge</button>
      <button class="sub-btn" onclick="selectTrack('PHD')">PhD Level</button>
    </div>
  </div>

  <div class="answer-mode-toggle">
    <button class="mode-btn active" id="typeMode">✏️ TYPE</button>
    <button class="mode-btn" id="mcqMode">⚪ MCQ</button>
    <button class="mode-btn" id="flipMode">🔁 FLIP</button>
  </div>
  <div id="cardCounter" style="text-align:center;margin:15px;color:#00ffaa;font-weight:bold;font-size:18px;">0/0</div>
  <div id="card" class="card">
    <div class="card-content">
      <div class="loading">Select a mode to start</div>
    </div>
  </div>
  <div class="stats">
    <div>Due Now<b id="dueCount">0</b></div>
    <div>Streak<b id="streakCount">0<br>days</b></div>
    <div>Total<b id="totalCount">0<br>/0</b></div>
  </div>
  <div class="footer">ABST P24 Civilization OS | SM-2 Algorithm</div>

  <script>
    // FIX 1: EMBEDDED DATA - NO FETCH NEEDED
    const PILLARS_DATA = [
      {"id":1,"q":"What is Dharma?","a":"Righteous duty","category":"DHARMA"},
      {"id":2,"q":"Who wrote Arthashastra?","a":"Chanakya","category":"ARTHA"},
      {"id":3,"q":"What is Karma?","a":"Action and consequence","category":"KARMA"},
      {"id":4,"q":"What is Moksha?","a":"Liberation","category":"MOKSHA"},
      {"id":5,"q":"What is Ahimsa?","a":"Non-violence","category":"DHARMA"}
    ];

    const SCHOOL_DATA = [
      {"id":1,"q":"What is 2+2?","a":"4","category":"CLASS10"},
      {"id":2,"q":"Capital of India?","a":"Delhi","category":"CLASS10"},
      {"id":3,"q":"H2O is?","a":"Water","category":"CLASS10"},
      {"id":4,"q":"Sun rises in?","a":"East","category":"CLASS10"},
      {"id":5,"q":"5x5 =?","a":"25","category":"CLASS10"}
    ];

    const COLLEGE_DATA = [
      {"id":1,"q":"What is HTML?","a":"HyperText Markup Language","category":"ENGINEERING"},
      {"id":2,"q":"What is CPU?","a":"Central Processing Unit","category":"ENGINEERING"}
    ];

    const COMPETITIVE_DATA = [
      {"id":1,"q":"First President of India?","a":"Dr Rajendra Prasad","category":"UPSC"},
      {"id":2,"q":"What is DNA?","a":"Deoxyribonucleic Acid","category":"NEET"}
    ];

    const OTHER_DATA = [
      {"id":1,"q":"Largest ocean?","a":"Pacific Ocean","category":"GK"},
      {"id":2,"q":"Speed of light?","a":"3x10^8 m/s","category":"PHD"}
    ];

    window.ABST_SM2 = {
      calc: function(card, quality) {
        if (quality < 3) {
          card.reps = 0;
          card.interval = 1;
        } else {
          if (card.reps === 0) card.interval = 1;
          else if (card.reps === 1) card.interval = 6;
          else card.interval = Math.round(card.interval * card.ease);
          card.reps += 1;
        }
        card.ease = card.ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
        if (card.ease < 1.3) card.ease = 1.3;
        card.due = Date.now() + card.interval * 24 * 60 * 1000;
        return card;
      },
      initCard: function(card) {
        return {...card, ease: card.ease || 2.5, reps: card.reps || 0, interval: card.interval || 0, due: card.due || 0};
      },
      isDue: function(card) {
        return card.due <= Date.now();
      }
    };

    let currentMode = 'pillars';
    let answerMode = 'type';
    let currentCard = null;
    let dueCards = [];
    let currentIndex = 0;
    let userClass = 'GK';
    let streak = parseInt(localStorage.getItem('abst_streak') || '0');
    let matrix = [];

    function loadCards() {
      let filteredMatrix = matrix;
      if(currentMode === 'school' && userClass!== 'GK') {
        filteredMatrix = matrix.filter(c => c.category === userClass);
      }
      else if(currentMode === 'college' && userClass!== 'GK') {
        filteredMatrix = matrix.filter(c => c.category === userClass);
      }
      else if(currentMode === 'competitive' && userClass!== 'GK') {
        filteredMatrix = matrix.filter(c => c.category === userClass);
      }
      else if(currentMode === 'other' && userClass!== 'GK') {
        filteredMatrix = matrix.filter(c => c.category === userClass);
      }

      filteredMatrix = filteredMatrix.map(c => window.ABST_SM2.initCard(c));
      // FIX 2: Reset due to 0 for testing - remove this in production
      dueCards = [...filteredMatrix];
      currentIndex = 0;
      dueCards = dueCards.sort(() => 0.5 - Math.random());
    }

    function loadMatrixFromGitHub() {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(currentMode+'Mode')?.classList.add('active');
      document.getElementById(answerMode+'Mode')?.classList.add('active');

      // FIX 3: NO FETCH - USE EMBEDDED DATA
      if(currentMode === 'pillars') matrix = PILLARS_DATA;
      else if(currentMode === 'school') matrix = SCHOOL_DATA;
      else if(currentMode === 'college') matrix = COLLEGE_DATA;
      else if(currentMode === 'competitive') matrix = COMPETITIVE_DATA;
      else if(currentMode === 'other') matrix = OTHER_DATA;

      console.log('[BRAIN] Matrix loaded:', matrix.length);
      initBrain();
    }

    function initBrain() {
      matrix = matrix.map((c, i) => ({
        id: c.id || i,
        q: c.q || c.question || 'No Question',
        a: c.a || c.answer || 'No Answer',
        category: c.category || 'GENERAL',
        ease: c.ease || 2.5,
        reps: c.reps || 0,
        interval: c.interval || 0,
        due: c.due || 0
      }));
      loadCards();
      updateStats();
      showCard();
    }

    function showCard() {
      const cardEl = document.getElementById('card');
      cardEl.classList.remove('correct', 'wrong');

      if (currentIndex >= dueCards.length || dueCards.length === 0) {
        document.querySelector('.card-content').innerHTML = `<div style="padding: 40px; text-align: center;"><h3>All done! 🎉</h3><p>No cards in this category</p></div>`;
        document.getElementById('cardCounter').textContent = `0/${dueCards.length}`;
        return;
      }
      currentCard = dueCards[currentIndex];
      document.getElementById('cardCounter').textContent = `${currentIndex + 1}/${dueCards.length}`;

      let content = `<div class="pillar">${currentCard.category || ''}</div>
        <div class="question">${currentCard.q}</div>`;

      if(answerMode === 'type') {
        content += `<input type="text" id="typeAnswerBox" class="answer-input" placeholder="Type your answer here..." onkeypress="if(event.key==='Enter') checkAnswer()">
        <button class="btn btn-check" onclick="checkAnswer()">CHECK ANSWER</button>`;
      } else if(answerMode === 'mcq') {
        let correctAns = currentCard.a;
        let options = [correctAns];
        let wrongOptions = matrix.filter(c => c.a!== correctAns).sort(() => 0.5 - Math.random()).slice(0, 3).map(c => c.a);
        options = [...options,...wrongOptions].sort(() => 0.5 - Math.random());
        content += `<div id="mcqOptions" class="mcq-grid">`;
        options.forEach(opt => {
          content += `<button class="mcq-btn" onclick="checkMCQ('${opt.replace(/'/g, "\\'")}')">${opt}</button>`;
        });
        content += `</div>`;
      } else if(answerMode === 'flip') {
        content += `<div class="answer" style="color:#0f0;margin:20px 0;padding:15px;background:#001100;border-radius:8px;">${currentCard.a}</div>
        <button class="btn" onclick="gradeCard(3)">NEXT</button>`;
      }
      document.querySelector('.card-content').innerHTML = content;
    }

    function checkAnswer() {
      const input = document.getElementById('typeAnswerBox');
      const userAns = input.value.trim().toLowerCase();
      const correctAns = currentCard.a.trim().toLowerCase();
      const cardEl = document.getElementById('card');

      if (userAns === correctAns) {
        cardEl.classList.add('correct');
        input.classList.add('correct');
        input.disabled = true;
        showQualityBtns();
      } else {
        cardEl.classList.add('wrong');
        input.classList.add('wrong');
        input.value = currentCard.a;
        input.disabled = true;
        showQualityBtns();
      }
    }

    function checkMCQ(selected) {
      const correctAns = currentCard.a;
      const buttons = document.querySelectorAll('#mcqOptions button');
      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === correctAns) btn.classList.add('correct');
        else if (btn.textContent === selected) btn.classList.add('wrong');
      });
      showQualityBtns();
    }

    function showQualityBtns() {
      const qualityDiv = document.createElement('div');
      qualityDiv.className = 'quality-btns';
      qualityDiv.innerHTML = `
        <button class="btn btn-again" onclick="gradeCard(0)">AGAIN 1d</button>
        <button class="btn btn-hard" onclick="gradeCard(1)">HARD 1d</button>
        <button class="btn btn-good" onclick="gradeCard(2)">GOOD 6d</button>
        <button class="btn btn-easy" onclick="gradeCard(3)">EASY 15d</button>
      `;
      document.querySelector('.card-content').appendChild(qualityDiv);
      document.querySelector('.btn-check')?.remove();
    }

    function gradeCard(quality) {
      currentCard = window.ABST_SM2.calc(currentCard, quality);
      const idx = matrix.findIndex(c => c.id === currentCard.id);
      if(idx >= 0) matrix[idx] = currentCard;
      localStorage.setItem('abst_brain_cards', JSON.stringify(matrix));
      currentIndex++;
      updateStats();
      showCard();
    }

    function updateStats() {
      document.getElementById('dueCount').innerText = dueCards.length;
      document.getElementById('streakCount').innerHTML = streak + '<br>days';
      document.getElementById('totalCount').innerHTML = matrix.length + '<br>/' + matrix.length;
    }

    document.getElementById('homeBtn').onclick = () => window.close();

    function hideAllSubLists() {
      document.getElementById('schoolList').style.display = 'none';
      document.getElementById('collegeList').style.display = 'none';
      document.getElementById('competitiveList').style.display = 'none';
      document.getElementById('othersList').style.display = 'none';
    }

    function showSchoolList() {
      hideAllSubLists();
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('schoolMode').classList.add('active');
      document.getElementById('schoolList').style.display = 'block';
      document.getElementById('card').style.display = 'none';
    }

    function showCollegeList() {
      hideAllSubLists();
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('collegeMode').classList.add('active');
      document.getElementById('collegeList').style.display = 'block';
      document.getElementById('card').style.display = 'none';
    }

    function showCompetitiveList() {
      hideAllSubLists();
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('competitiveMode').classList.add('active');
      document.getElementById('competitiveList').style.display = 'block';
      document.getElementById('card').style.display = 'none';
    }

    function showOthersList() {
      hideAllSubLists();
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('otherMode').classList.add('active');
      document.getElementById('othersList').style.display = 'block';
      document.getElementById('card').style.display = 'none';
    }

    function selectTrack(trackName) {
      hideAllSubLists();
      document.getElementById('card').style.display = 'block';
      userClass = trackName;

      if(['LKG','UKG','CLASS1','CLASS2','CLASS3','CLASS4','CLASS5','CLASS6','CLASS7','CLASS8','CLASS9','CLASS10','CLASS11','CLASS12'].includes(trackName)) {
        currentMode = 'school';
      } else if(['DEGREE','ENGINEERING','MBBS','MBA-HR','MBA-FIN'].includes(trackName)) {
        currentMode = 'college';
      } else if(['UPSC','NEET','JEE','SSC','BANKING'].includes(trackName)) {
        currentMode = 'competitive';
      } else {
        currentMode = 'other';
      }

      loadMatrixFromGitHub();
    }

    document.getElementById('pillarsMode').onclick = () => {
      hideAllSubLists();
      currentMode = 'pillars';
      loadMatrixFromGitHub();
    };

    document.getElementById('typeMode').onclick = () => {
      answerMode = 'type';
      document.querySelectorAll('.answer-mode-toggle.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('typeMode').classList.add('active');
      showCard();
    };

    document.getElementById('mcqMode').onclick = () => {
      answerMode = 'mcq';
      document.querySelectorAll('.answer-mode-toggle.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('mcqMode').classList.add('active');
      showCard();
    };

    document.getElementById('flipMode').onclick = () => {
      answerMode = 'flip';
      document.querySelectorAll('.answer-mode-toggle.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('flipMode').classList.add('active');
      showCard();
    };

    window.addEventListener('load', () => {
      console.log('[BRAIN] Ready - No external files needed');
      loadMatrixFromGitHub();
    });
  </script>
</body>
</html>
