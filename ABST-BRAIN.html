    * { margin:0; padding:0; box-sizing:border-box }

  .answer-input.correct { border-color:#44ff88; background:#44ff8810 }
  .answer-input.wrong { border-color:#ff4444; background:#ff444410 }
  .mcq-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:20px 0 }
  .mcq-btn { background:#1a2332; color:#fff; border:2px solid #00ffaa40; padding:15px; border-radius:10px; cursor:pointer; font-size:15px; transition:all 0.2s }

  .btn { background:#00ffaa; color:#0a192f; padding:16px 32px; border:none; border-radius:14px; margin:8px; font-weight:900; font-size:16px; cursor:pointer; transition:all 0.2s }
  .btn:hover { transform:scale(1.05); box-shadow:0 0 20px #00ffaa80 }
  .btn-check { background:#ffaa00; color:#0a192f }
  .quality-btns { display:none; gap:8px; justify-content:center; margin:20px 0; flex-wrap:wrap }
  .btn-again { background:#ff4444; color:#fff; padding:12px 20px }
  .btn-hard { background:#ffaa00; color:#0a192f; padding:12px 20px }

  .stats { display:flex; justify-content:space-around; margin:35px auto; max-width:550px; font-size:15px; background:#1a2332; padding:20px; border-radius:16px; border:1px solid #00ffaa40 }

  .feedback-msg { font-size:18px; font-weight:700; margin:15px 0; min-height:25px }
  .timer { position:absolute; top:10px; left:20px; background:#ff4444; color:#fff; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:900; display:none }
  .timer.warning { background:#ffaa00; color:#0a192f }
  .loading { color:#ffaa00; font-size:18px; padding:40px; text-align:center }
  .age-modal { position:fixed; top:0; left:0; width:100%; height:100%; background:#0a192fdd; display:flex; align-items:center; justify-content:center; z-index:100 }
  .age-box { background:#1a2332; padding:30px; border-radius:20px; border:2px solid #00ffaa; max-width:400px; width:90% }
  .age-box h2 { color:#ffaa00; margin-bottom:20px }
  .age-box select { width:100%; padding:12px; margin:10px 0; background:#0a192f; 
    border:2px solid #00ffaa; border-radius:10px; color:#fff; font-size:16px;
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300ffaa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat:no-repeat; background-position:right 12px center; background-size:20px;
    position:relative; z-index:101;}

<div class="mode-toggle">
  <button class="mode-btn active" id="pillarsMode">🏛 36 PILLARS - 108</button>

  <div class="stats">

  <div class="footer">ABST P24 Civilization OS | SM-2 Algorithm | 108 Mantra + 1000 Sahasra</div>
  <script>
    // ===== GITHUB RAW URLs - REPO NAME UPDATE CHEY =====
    const GITHUB_USER = 'ram1025';
    const REPO_NAME = 'abst'; // 👈 NEE REPO NAME IKKADA PETTU
    const PILLARS_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/36-pillars-108.db`;
    const EDU_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/Education-kgtoug-465.db`;
    const EDU_URL2 = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/Education-engtogk-535.db`;

    // ===== SM-2 ALGORITHM =====
    window.ABST_SM2 = {
      calc: function(card, quality) {
        if (quality < 3) {
          card.reps = 0;
          card.interval = 1;
        } else {
          if (card.reps === 0) card.interval = 1;
          else if (card.reps === 1) card.interval = 6;
          else card.interval = Math.round(card.interval * card.ease);
          card.reps += 1;
        }
        card.ease = card.ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
        if (card.ease < 1.3) card.ease = 1.3;
        card.due = Date.now() + card.interval * 24 * 60 * 60 * 1000;
        return card;
      }
    };

    // ===== BRAIN LOGIC =====
    let currentMode = 'pillars';
    let answerMode = 'type';
    let currentCard = null;
    let dueCards = [];
    let currentIndex = 0;
    let userClass = 'gk';
    let streak = parseInt(localStorage.getItem('abst_streak') || '0');
    let timer = null;
    let timeLeft = 10;
    let allCards = [];
    let allEducationCards = [];

    // ===== AUTO LOAD FROM GITHUB =====
async function loadMatrixFromGitHub() {
  try {
    let fileName = '';
    if(currentMode === 'pillars') fileName = '36-pillars-108.json';
    else if(currentMode === 'kgug') fileName = 'Education-kgtoug-465.json';
    else if(currentMode === 'enggk') fileName = 'Education-engtogk-535.json';

    document.getElementById('question').innerHTML = `<div class="loading">Loading ${fileName}...</div>`;
    const url = `https://raw.githubusercontent.com/ram1025/ram1025/main/${fileName}`;
    const response = await fetch(url);
    if (!response.ok) throw new Error(`${fileName} not found`);
    matrix = await response.json();

    // Local storage sync
    const saved = localStorage.getItem('abst_brain_cards');
    if(saved) {
      const parsed = JSON.parse(saved);
      parsed.forEach(savedCard => {
        const idx = matrix.findIndex(c => c.id === savedCard.id);
        if(idx >= 0) matrix[idx] = savedCard;
      });
    }

    initBrain();
  } catch(err) {
    console.error(err);
    document.getElementById('question').innerHTML = 
      `<div style="color:#ff4444">Error: ${err.message}<br><small>Check GitHub repo name & files</small></div>`;
    document.getElementById('pillarTag').innerText = 'LOAD FAILED';
  }
}

    function initBrain() {
      loadCards();
      updateStats();
      nextCard();
    }

    function loadCards() {
      let cards = [];
if(currentMode === 'pillars') {
  cards = matrix.filter(c => c.category === 'pillars' || c.type === 'pillars');
} 
else if(currentMode === 'kgug') {
  const cls = userClass.replace('class', ''); // "9" or "12" etc
  cards = matrix.filter(c => {
    const cat = (c.category || '').toLowerCase();
    return cat.includes('kgug') && (cat.includes(cls) || cat.includes('general'));
  });
} 
else if(currentMode === 'enggk') {
  cards = matrix.filter(c => c.category === 'enggk' || c.type === 'enggk');
}
      dueCards = cards.filter(c =>!c.due || c.due <= Date.now());
      if(dueCards.length === 0) dueCards = [...cards];
      currentIndex = 0;
    }

    function showCard() {
  if (currentIndex >= dueCards.length) {
    document.getElementById('card').innerHTML = `<div style="padding: 40px; text-align: center;">
      <h3>All done! 🎉</h3>
    </div>`;
    document.getElementById('cardCounter').textContent = `${dueCards.length}/${dueCards.length}`;
    return;
  }

  const card = dueCards[currentIndex];
  document.getElementById('cardCounter').textContent = `${currentIndex + 1}/${dueCards.length}`;

  let content = `<div class="card-content">
    <div class="question" style="font-size: 1.2rem; margin-bottom: 20px;">${card.question}</div>`;

  // TYPE MODE
  if(answerMode === 'type') {
    content += `<input type="text" id="typeAnswerBox" placeholder="Type your answer here..."
      style="width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #0ff;background:#001122;color:#fff;font-size:1rem;">
      <button class="btn" onclick="checkAnswer()" style="margin-top:10px;">CHECK ANSWER</button>`;
  }

  // MCQ MODE - 4 OPTIONS GENERATE CHESTADI
  else if(answerMode === 'mcq') {
    let options = [card.answer]; // Correct answer

    // 3 wrong options random ga teesuko
    let wrongOptions = matrix.filter(c => c.answer!== card.answer)
     .sort(() => 0.5 - Math.random())
     .slice(0, 3)
     .map(c => c.answer);

    options = [...options,...wrongOptions].sort(() => 0.5 - Math.random()); // Shuffle

    content += `<div id="mcqOptions" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;">`;
    options.forEach(opt => {
      content += `<button class="btn" onclick="checkMCQ('${opt.replace(/'/g, "\\'")}')"
        style="padding:15px;text-align:left;">${opt}</button>`;
    });
    content += `</div>`;
  }

  // FLIP MODE - Direct answer chupistadi
  else if(answerMode === 'flip') {
    content += `<div class="answer" style="color:#0f0;margin:20px 0;padding:15px;background:#001100;border-radius:8px;">${card.answer}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;">
        <button class="btn btn-danger" onclick="gradeCard(0)">AGAIN 1d</button>
        <button class="btn btn-warning" onclick="gradeCard(1)">HARD 1d</button>
        <button class="btn btn-success" onclick="gradeCard(2)">GOOD 6d</button>
        <button class="btn btn-info" onclick="gradeCard(3)">EASY 15d</button>
      </div>`;
  }

  content += `</div>`;
  document.getElementById('card').innerHTML = content;
}

// MCQ CHECK FUNCTION - IDI KUDA ADD CHEY
function checkMCQ(selected) {
  const card = dueCards[currentIndex];
  const correct = selected === card.answer;

  let feedback = correct?
    `<div style="color:#0f0;margin:20px 0;">✅ Correct!</div>` :
    `<div style="color:#f00;margin:20px 0;">❌ Wrong! Correct: ${card.answer}</div>`;

  document.getElementById('card').innerHTML += feedback + `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;">
      <button class="btn btn-danger" onclick="gradeCard(${correct? 2 : 0})">AGAIN 1d</button>
      <button class="btn btn-warning" onclick="gradeCard(${correct? 2 : 1})">HARD 1d</button>
      <button class="btn btn-success" onclick="gradeCard(${correct? 2 : 2})">GOOD 6d</button>
      <button class="btn btn-info" onclick="gradeCard(${correct? 3 : 3})">EASY 15d</button>
    </div>`;
}
    function generateMCQ() {
      const grid = document.getElementById('mcqGrid');
      grid.innerHTML = '';
      const correct = currentCard.a || currentCard.answer;
      let options = [correct];
      let pool = dueCards.filter(c => (c.a || c.answer)!== correct).map(c => c.a || c.answer);
      pool = [...new Set(pool)];
      while(options.length < 4 && pool.length > 0) {
        const idx = Math.floor(Math.random() * pool.length);
        options.push(pool.splice(idx, 1)[0]);
      }
      options.sort(() => Math.random() - 0.5);
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'mcq-btn';
        btn.innerText = opt;
        btn.onclick = () => checkMCQ(opt === correct, btn);
        grid.appendChild(btn);
      });
    }

    function checkMCQ(isCorrect, btn) {
      clearInterval(timer);
      document.querySelectorAll('.mcq-btn').forEach(b => b.disabled = true);
      const correctAns = currentCard.a || currentCard.answer;
      if(isCorrect) {
        btn.classList.add('correct');
        document.getElementById('feedbackMsg').innerText = '✅ Correct!';
        document.getElementById('feedbackMsg').style.color = '#44ff88';
        document.getElementById('cardBox').classList.add('correct');
        streak++;
        localStorage.setItem('abst_streak', streak);
        updateCard(4);
      } else {
        btn.classList.add('wrong');
        document.querySelectorAll('.mcq-btn').forEach(b => {
          if(b.innerText === correctAns) b.classList.add('correct');
        });
        document.getElementById('feedbackMsg').innerText = '❌ Wrong! Correct: ' + correctAns;
        document.getElementById('feedbackMsg').style.color = '#ff4444';
        document.getElementById('cardBox').classList.add('wrong');
        streak = 0;
        localStorage.setItem('abst_streak', 0);
        updateCard(1);
      }
      updateStats();
      setTimeout(() => { currentIndex++; nextCard(); }, 2000);
    }

    function checkAnswer() {
      clearInterval(timer);
      const userAns = document.getElementById('userAnswer').value.trim().toLowerCase();
      const correctAns = (currentCard.a || currentCard.answer).toLowerCase();
      const isCorrect = userAns === correctAns || correctAns.includes(userAns) || userAns.includes(correctAns);

      if(isCorrect) {
        document.getElementById('feedbackMsg').innerText = '✅ Correct!';
        document.getElementById('feedbackMsg').style.color = '#44ff88';
        document.getElementById('cardBox').classList.add('correct');
        document.getElementById('userAnswer').classList.add('correct');
        streak++;
        localStorage.setItem('abst_streak', streak);
        updateCard(4);
      } else {
        document.getElementById('feedbackMsg').innerText = '❌ Wrong! Correct: ' + (currentCard.a || currentCard.answer);
        document.getElementById('feedbackMsg').style.color = '#ff4444';
        document.getElementById('cardBox').classList.add('wrong');
        document.getElementById('userAnswer').classList.add('wrong');
        streak = 0;
        localStorage.setItem('abst_streak', 0);
        updateCard(1);
      }
      updateStats();
      setTimeout(() => { currentIndex++; nextCard(); }, 2000);
    }

    function showAnswer() {
      clearInterval(timer);
      document.getElementById('answer').innerText = currentCard.a || currentCard.answer;
      document.getElementById('answerBox').style.display = 'block';
      document.getElementById('qualityBtns').style.display = 'flex';
      document.getElementById('showBtn').style.display = 'none';
    }

    function updateCard(quality) {
      currentCard = window.ABST_SM2.calc(currentCard, quality);
      const idx1 = allCards.findIndex(c => c.id === currentCard.id);
      if(idx1 >= 0) allCards[idx1] = currentCard;
      const idx2 = allEducationCards.findIndex(c => c.id === currentCard.id);
      if(idx2 >= 0) allEducationCards[idx2] = currentCard;
      const allSave = [...allCards,...allEducationCards];
      localStorage.setItem('abst_brain_cards', JSON.stringify(allSave));
    }

    function updateStats() {
      document.getElementById('dueCount').innerText = dueCards.length;
      document.getElementById('streakCount').innerHTML = streak + '<br>days';
      document.getElementById('totalCount').innerHTML = (allCards.length + allEducationCards.length) + '<br>/1108';
    }

    function startTimer() {
      timeLeft = 10;
      document.getElementById('timer').style.display = 'block';
      document.getElementById('timer').innerText = timeLeft + 's';
      document.getElementById('timer').classList.remove('warning');
      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft + 's';
        if(timeLeft <= 3) document.getElementById('timer').classList.add('warning');
        if(timeLeft <= 0) {
          clearInterval(timer);
          if(answerMode === 'type') checkAnswer();
          else if(answerMode === 'flip') showAnswer();
        }
      }, 1000);
    }

    // Event Listeners
    document.getElementById('checkBtn').onclick = checkAnswer;
    document.getElementById('showBtn').onclick = showAnswer;
    document.getElementById('userAnswer').addEventListener('keypress', e => {
      if(e.key === 'Enter') checkAnswer();
    });

    // 👈 FIX 5: Close button fix
    document.getElementById('homeBtn').onclick = () => {
      if(window.parent!== window && window.parent.closeM) {
        window.parent.closeM('abstBrainModal');
      } else {
        window.location.href = './index.html';
      }
    };

    document.getElementById('pillarsMode').onclick = () => {
  currentMode = 'pillars';
  document.querySelectorAll('.mode-toggle .mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('pillarsMode').classList.add('active');
  loadMatrixFromGitHub();
};

document.getElementById('kgUgMode').onclick = () => {
  currentMode = 'kgug';
  document.querySelectorAll('.mode-toggle .mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('kgUgMode').classList.add('active');
  loadMatrixFromGitHub();
};

document.getElementById('engGkMode').onclick = () => {
  currentMode = 'enggk';
  document.querySelectorAll('.mode-toggle .mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('engGkMode').classList.add('active');
  loadMatrixFromGitHub();
};

    document.getElementById('typeMode').onclick = () => {
      answerMode = 'type';
      document.getElementById('typeMode').classList.add('active');
      document.getElementById('mcqMode').classList.remove('active');
      document.getElementById('flipMode').classList.remove('active');
      nextCard();
    };
    document.getElementById('mcqMode').onclick = () => {
      answerMode = 'mcq';
      document.getElementById('mcqMode').classList.add('active');
      document.getElementById('typeMode').classList.remove('active');
      document.getElementById('flipMode').classList.remove('active');
      nextCard();
    };
    document.getElementById('flipMode').onclick = () => {
      answerMode = 'flip';
      document.getElementById('flipMode').classList.add('active');
