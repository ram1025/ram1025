<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABST BRAIN | P24 | INDIAN.001</title>
  <meta name="theme-color" content="#00ffaa">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <style>
    * { margin:0; padding:0; box-sizing:border-box }
    body { background:#0a192f; color:#00ffaa; font-family:system-ui,sans-serif; padding:20px; text-align:center; min-height:100vh }
   .header { margin-bottom:20px; position:relative; display:flex; align-items:center; justify-content:center }
   .header h1 { font-size: 28px; margin-left: 85px; padding-top: 5px; line-height: 1.1; text-shadow: 0 0 15px #ffaa00; }
   .header p { color:#ffaa00; font-size:14px; font-weight:700; position:absolute; top:45px; width:100% }
   .back-btn { position: absolute; left: 8px; top: 10px; font-size: 12px; padding: 4px 8px; background: #1a2332; color: #00ffaa; border: 2px solid #00ffaa; border-radius: 8px; }
   .mode-toggle,.answer-mode-toggle {background:#112240; border:1px solid #ffaa00; padding:10px; border-radius:10px; margin:15px auto; max-width:550px; display:flex; justify-content:center; gap:8px; flex-wrap:wrap }
   .mode-btn {background:#1a2332; color:#8892b0; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:700; font-size:11px; flex:1; min-width:100px; position:relative }
   .mode-btn.active { background:#ffaa00; color:#0a192f }
   .count { display:block; font-size:10px; color:#64ffda; margin-top:2px; }
   .mode-btn.active .count { color:#0a192f }
   .card { background:linear-gradient(145deg,#1a2332,#0f1723); padding:35px; border-radius:24px; border:2px solid #00ffaa; min-height:320px; margin:20px auto; max-width:550px; box-shadow:0 0 40px #00ffaa20; position:relative }
   .answer-input { width:100%; padding:14px; background:#0a192f; border:2px solid #00ffaa; border-radius:10px; color:#fff; font-size:18px; text-align:center; margin:20px 0 }
   .answer-input.correct { border-color:#44ff88; background:#44ff8810 }
   .answer-input.wrong { border-color:#ff4444; background:#ff444410 }
   .mcq-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:20px 0 }
   .mcq-btn { background:#1a2332; color:#fff; border:2px solid #00ffaa40; padding:15px; border-radius:10px; cursor:pointer; font-size:15px }
   .mcq-btn:hover { border-color:#00ffaa; background:#00ffaa20 }
   .mcq-btn.correct { background:#44ff88; color:#0a192f; border-color:#44ff88 }
   .mcq-btn.wrong { background:#ff4444; color:#fff; border-color:#ff4444 }
   .mcq-btn:disabled { opacity:0.6; cursor:not-allowed }
   .btn { background:#00ffaa; color:#0a192f; padding:16px 32px; border:none; border-radius:14px; margin:8px; font-weight:900; font-size:16px; cursor:pointer }
   .stats { display:flex; justify-content:space-around; margin:35px auto; max-width:550px; font-size:15px; background:#1a2332; padding:20px; border-radius:16px; border:1px solid #00ffaa40 }
   .stats b { color:#fff; font-size:20px; display:block; margin-top:5px }
   .sub-btn.active .sub-count { color:#0a192f!important }
   .sub-btn.active.sub-count { color:#0a192f!important }
   .sub-count { display:block; font-size:10px; color:#64ffda; margin-top:2px; }
   .sub-list { display:none; margin:15px auto; max-width:550px; background:#112240; padding:15px; border-radius:12px; border:1px solid #00ffaa40; }
   .srs-buttons { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:20px 0 }
   .srs-btn { padding:12px 8px; border-radius:10px; font-weight:800; font-size:13px; cursor:pointer; border:2px solid; display:flex; flex-direction:column; align-items:center; }
   .srs-again { background:#1a2332; color:#ff4444; border-color:#ff4444 }
   .srs-hard { background:#1a2332; color:#ffaa00; border-color:#ffaa00 }
   .srs-good { background:#1a2332; color:#44ff88; border-color:#44ff88 }
   .srs-easy { background:#1a2332; color:#00aaff; border-color:#00aaff }
   .srs-interval { font-size:10px; opacity:0.7; margin-top:2px; }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" id="homeBtn">← HOME</button>
    <h1>ABST BRAIN</h1>
    <p>SOVEREIGN ID: INDIAN.001 | 108 Mantra + 1000 Sahasra</p>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="pillarsMode">🏛 36 PILLARS<span class="count">108 Q</span></button>
    <button class="mode-btn" id="schoolMode" onclick="showSchoolList()">📚 SCHOOL<span class="count">280 Q</span></button>
    <button class="mode-btn" id="collegeMode" onclick="showCollegeList()">🎓 COLLEGE<span class="count">250 Q</span></button>
    <button class="mode-btn" id="competitiveMode" onclick="showCompetitiveList()">🏆 COMPETITIVE<span class="count">340 Q</span></button>
    <button class="mode-btn" id="othersMode" onclick="showOthersList()">📖 OTHERS<span class="count">130 Q</span></button>
  </div>

  <div id="schoolList" class="sub-list">
    <div style="color:#ffd700; font-size:13px; font-weight:bold; margin-bottom:12px;">SELECT CLASS: 14 × 20 Q/A</div>
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px;">
      <button class="sub-btn" onclick="selectTrack('LKG', this)">LKG<span class="sub-count">20 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('UKG', this)">UKG<span class="sub-count">20 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('CLASS1', this)">CLASS 1<span class="sub-count">20 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('CLASS2', this)">CLASS 2<span class="sub-count">20 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('CLASS3', this)">CLASS 3<span class="sub-count">20 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('CLASS4', this)">CLASS 4<span class="sub-count">20 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('CLASS5', this)">CLASS 5<span class="sub-count">20 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('CLASS6', this)">CLASS 6<span class="sub-count">20 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('CLASS7', this)">CLASS 7<span class="sub-count">20 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('CLASS8', this)">CLASS 8<span class="sub-count">20 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('CLASS9', this)">CLASS 9<span class="sub-count">20 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('CLASS10', this)">CLASS 10<span class="sub-count">20 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('CLASS11', this)">CLASS 11<span class="sub-count">20 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('CLASS12', this)">CLASS 12<span class="sub-count">20 Q</span></button>
    </div>
  </div>

  <div id="collegeList" class="sub-list">
    <div style="color:#ffd700; font-size:13px; font-weight:bold; margin-bottom:12px;">SELECT STREAM: 5 × 50 Q/A</div>
    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px;">
      <button class="sub-btn" onclick="selectTrack('DEGREE', this)">DEGREE<span class="sub-count">50 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('ENGINEERING', this)">ENGINEERING<span class="sub-count">50 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('MBBS', this)">MBBS<span class="sub-count">50 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('MBA-HR', this)">MBA-HR<span class="sub-count">50 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('MBA-FIN', this)">MBA-FIN<span class="sub-count">50 Q</span></button>
    </div>
  </div>

  <div id="competitiveList" class="sub-list">
    <div style="color:#ffd700; font-size:13px; font-weight:bold; margin-bottom:12px;">SELECT EXAM: 5 × 68 Q/A</div>
    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px;">
      <button class="sub-btn" onclick="selectTrack('UPSC', this)">UPSC<span class="sub-count">68 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('NEET', this)">NEET<span class="sub-count">68 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('JEE', this)">JEE<span class="sub-count">68 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('SSC', this)">SSC<span class="sub-count">68 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('BANKING', this)">BANKING<span class="sub-count">68 Q</span></button>
    </div>
  </div>

  <div id="othersList" class="sub-list">
    <div style="color:#ffd700; font-size:13px; font-weight:bold; margin-bottom:12px;">SELECT LEVEL: 2 × 65 Q/A</div>
    <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:8px;">
      <button class="sub-btn" onclick="selectTrack('GK', this)">GK<span class="sub-count">65 Q</span></button>
      <button class="sub-btn" onclick="selectTrack('PHD', this)">PHD<span class="sub-count">65 Q</span></button>
    </div>
  </div>

  <div class="answer-mode-toggle">
    <button class="mode-btn active" id="typeMode">✏️ TYPE</button>
    <button class="mode-btn" id="mcqMode">⚪ MCQ</button>
    <button class="mode-btn" id="flipMode">🔁 FLIP</button>
  </div>
  <div id="cardCounter" style="text-align:center;margin:15px;color:#00ffaa;font-weight:bold;font-size:18px;">0/0</div>
  <div id="card" class="card">
    <div class="card-content">
      <div style="padding: 40px; text-align: center;">Loading...</div>
    </div>
  </div>
  <div class="stats">
    <div>Due Now<b id="dueCount">0</b></div>
    <div>Streak<b id="streakCount">0<br>days</b></div>
    <div>Total<b id="totalCount">0<br>/0</b></div>
  </div>

  <script>
    let currentMode = 'pillars';
    let currentTrack = 'GENERAL';
    let answerMode = 'type';
    let currentCard = null;
    let dueCards = [];
    let currentIndex = 0;
    let matrix = [];
    let answered = false;

    const DATA_FILES = {
      'pillars': './36-pillars-108.json',
      'school': './Education-school-280.json',
      'college': './Education-college-250.json',
      'competitive': './Education-competitive-340.json',
      'others': './Education-others-130.json'
    };

    document.getElementById('pillarsMode').onclick = () => {
      currentMode = 'pillars';
      currentTrack = 'GENERAL';
      clearAllModeActive();
      document.getElementById('pillarsMode').classList.add('active');
      hideAllSubLists();
      loadMatrixFromGitHub();
    };

    function showSchoolList() {
      currentMode = 'school';
      clearAllModeActive();
      document.getElementById('schoolMode').classList.add('active');
      hideAllSubLists();
      document.getElementById('schoolList').style.display = 'block';
    }

    function showCollegeList() {
      currentMode = 'college';
      clearAllModeActive();
      document.getElementById('collegeMode').classList.add('active');
      hideAllSubLists();
      document.getElementById('collegeList').style.display = 'block';
    }

    function showCompetitiveList() {
      currentMode = 'competitive';
      clearAllModeActive();
      document.getElementById('competitiveMode').classList.add('active');
      hideAllSubLists();
      document.getElementById('competitiveList').style.display = 'block';
    }

    function showOthersList() {
      currentMode = 'others';
      clearAllModeActive();
      document.getElementById('othersMode').classList.add('active');
      hideAllSubLists();
      document.getElementById('othersList').style.display = 'block';
    }

    function selectTrack(track, btnElement) {
      currentTrack = track;
      document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      hideAllSubLists();
      loadMatrixFromGitHub();
    }

    function clearAllModeActive() {
  document.querySelectorAll('.answer-mode-toggle.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
}

    async function loadMatrixFromGitHub() {
      const version = Date.now();
      const jsonFile = DATA_FILES[currentMode] + `?v=${version}`;
      try {
        document.querySelector('.card-content').innerHTML = `<div style="padding:40px;text-align:center;">Loading...</div>`;
        const response = await fetch(jsonFile);
        if (!response.ok) throw new Error('File not found');
        matrix = await response.json();
        matrix = matrix.map(card => {
          const saved = localStorage.getItem(`card_${card.id}`);
          return saved? {...card,...JSON.parse(saved)} : {...card, interval: 0, ease: 2.5, due: 0};
        });
        initBrain();
      } catch(err) {
        document.querySelector('.card-content').innerHTML = `<div style="padding:40px;text-align:center;"><h3>Error Loading Data</h3><p>JSON file not found</p></div>`;
        document.getElementById('cardCounter').textContent = `0/0`;
      }
    }

    function initBrain() {
      const now = Date.now();
      if(currentMode === 'pillars') {
        dueCards = matrix.filter(c => c.due <= now);
      } else {
        dueCards = matrix.filter(c => c.category.toUpperCase() === currentTrack && c.due <= now);
      }
      if(dueCards.length === 0 && matrix.length > 0) {
        dueCards = matrix.filter(c => currentMode === 'pillars'? true : c.category.toUpperCase() === currentTrack);
      }
      currentIndex = 0;
      updateStats();
      showCard();
    }

    function showCard() {
      answered = false;
      if (dueCards.length === 0) {
        document.querySelector('.card-content').innerHTML = `<div style="padding: 40px; text-align: center;"><h3>No cards found!</h3></div>`;
        document.getElementById('cardCounter').textContent = `0/0`;
        return;
      }
      if (currentIndex >= dueCards.length) currentIndex = 0;
      currentCard = dueCards[currentIndex];

      const qText = currentCard.q || currentCard.question;
      const aText = currentCard.a || currentCard.answer;
      const categoryText = currentCard.category || 'Pillar ' + currentCard.pillar;

      document.getElementById('cardCounter').textContent = `${currentIndex + 1}/${dueCards.length}`;

      if (answerMode === 'type') {
        document.querySelector('.card-content').innerHTML = `
          <div style="padding: 20px; text-align: center;">
            <div style="color: #64ffda; font-size: 14px; margin-bottom: 10px;">${categoryText}</div>
            <div style="font-size: 20px; margin-bottom: 20px; color: #fff;">${qText}</div>
            <input type="text" class="answer-input" id="typeInput" placeholder="Type answer here..." />
            <button class="btn btn-check" onclick="checkTypeAnswer('${aText.replace(/'/g, "\\'")}')">Check</button>
            <div id="answerDiv" style="display:none; margin-top: 20px;">
              <div style="font-size: 18px; color: #ffd700; margin-bottom: 20px; padding: 15px; background: #112240; border-radius: 8px;">${aText}</div>
              <div class="srs-buttons">${getSRSButtons()}</div>
            </div>
          </div>
        `;
        document.getElementById('typeInput').focus();
      } else if (answerMode === 'mcq') {
        let options = [aText];
        const otherCards = matrix.filter(c => c.id!== currentCard.id && (c.a || c.answer));
        for(let i = 0; i < 3 && i < otherCards.length; i++) {
          const rand = otherCards[Math.floor(Math.random() * otherCards.length)];
          const wrongAns = rand.a || rand.answer;
          if(!options.includes(wrongAns)) options.push(wrongAns);
        }
        options = options.sort(() => Math.random() - 0.5);

        document.querySelector('.card-content').innerHTML = `
          <div style="padding: 20px; text-align: center;">
            <div style="color: #64ffda; font-size: 14px; margin-bottom: 10px;">${categoryText}</div>
            <div style="font-size: 20px; margin-bottom: 20px; color: #fff;">${qText}</div>
            <div class="mcq-grid">
              ${options.map(opt => `<button class="mcq-btn" onclick="checkMCQ('${opt.replace(/'/g, "\\'")}', '${aText.replace(/'/g, "\\'")}')">${opt}</button>`).join('')}
            </div>
            <div id="answerDiv" style="display:none; margin-top: 20px;">
              <div class="srs-buttons">${getSRSButtons()}</div>
            </div>
          </div>
        `;
      } else {
        document.querySelector('.card-content').innerHTML = `
          <div style="padding: 20px; text-align: center;">
            <div style="color: #64ffda; font-size: 14px; margin-bottom: 10px;">${categoryText}</div>
            <div style="font-size: 20px; margin-bottom: 20px; color: #fff;">${qText}</div>
            <button onclick="showAnswer()" id="showAnsBtn" style="padding: 12px 24px; background: #64ffda; color: #0a192f; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%;">Show Answer</button>
            <div id="answerDiv" style="display:none; margin-top: 20px;">
              <div style="font-size: 18px; color: #ffd700; margin-bottom: 20px; padding: 15px; background: #112240; border-radius: 8px;">${aText}</div>
              <div class="srs-buttons">${getSRSButtons()}</div>
            </div>
          </div>
        `;
      }
    }

    function checkTypeAnswer(correct) {
      answered = true;
      const input = document.getElementById('typeInput');
      const userAns = input.value.trim().toLowerCase();
      const correctAns = correct.toLowerCase();
      if(userAns === correctAns) {
        input.classList.add('correct');
      } else {
        input.classList.add('wrong');
      }
      input.disabled = true;
      document.getElementById('answerDiv').style.display = 'block';
    }

    function checkMCQ(selected, correct) {
      answered = true;
      document.querySelectorAll('.mcq-btn').forEach(btn => {
        btn.disabled = true;
        if(btn.textContent === correct) btn.classList.add('correct');
        else if(btn.textContent === selected) btn.classList.add('wrong');
      });
      document.getElementById('answerDiv').style.display = 'block';
    }

    function getSRSButtons() {
      const interval = currentCard.interval || 0;
      const ease = currentCard.ease || 2.5;
      const againInt = '<1d';
      const hardInt = interval === 0? '1d' : Math.max(1, Math.round(interval * 1.2)) + 'd';
      const goodInt = interval === 0? '1d' : Math.round(interval * ease) + 'd';
      const easyInt = interval === 0? '4d' : Math.round(interval * ease * 1.3) + 'd';

      return `
        <button class="srs-btn srs-again" onclick="rateCard(1)">Again<span class="srs-interval">${againInt}</span></button>
        <button class="srs-btn srs-hard" onclick="rateCard(2)">Hard<span class="srs-interval">${hardInt}</span></button>
        <button class="srs-btn srs-good" onclick="rateCard(3)">Good<span class="srs-interval">${goodInt}</span></button>
        <button class="srs-btn srs-easy" onclick="rateCard(4)">Easy<span class="srs-interval">${easyInt}</span></button>
      `;
    }

    function showAnswer() {
      answered = true;
      document.getElementById('answerDiv').style.display = 'block';
      document.getElementById('showAnsBtn').style.display = 'none';
    }

    function rateCard(rating) {
      let interval = currentCard.interval || 0;
      let ease = currentCard.ease || 2.5;

      if (rating === 1) { interval = 0; ease = Math.max(1.3, ease - 0.2); }
      else if (rating === 2) { interval = Math.max(1, interval * 1.2); ease = Math.max(1.3, ease - 0.15); }
      else if (rating === 3) { interval = interval === 0? 1 : interval * ease; }
      else if (rating === 4) { interval = interval === 0? 4 : interval * ease * 1.3; ease += 0.15; }

      currentCard.interval = interval;
      currentCard.ease = ease;
      currentCard.due = Date.now() + (interval * 24 * 60 * 60 * 1000);

      localStorage.setItem(`card_${currentCard.id}`, JSON.stringify({
        interval: interval,
        ease: ease,
        due: currentCard.due
      }));
      currentIndex++;
      updateStats();
      showCard();
    }

    function updateStats() {
  const now = Date.now();
  let filteredMatrix = matrix;
  
  // SCHOOL or COLLEGE filter
  if(currentMode === 'school' && currentTrack) {
    filteredMatrix = matrix.filter(c => c.category.toUpperCase() === currentTrack.toUpperCase());
  } else if(currentMode === 'college' && currentTrack) {
    filteredMatrix = matrix.filter(c => c.category.toUpperCase() === currentTrack.toUpperCase());
  }
  
  const dueCount = filteredMatrix.filter(c => c.due <= now).length;
  document.getElementById('dueCount').innerText = dueCount;
  document.getElementById('totalCount').innerHTML = filteredMatrix.length + '<br>/' + filteredMatrix.length;
}
    function hideAllSubLists() {
      document.getElementById('schoolList').style.display = 'none';
      document.getElementById('collegeList').style.display = 'none';
      document.getElementById('competitiveList').style.display = 'none';
      document.getElementById('othersList').style.display = 'none';
    }

    // FIXED: Single selection for TYPE/MCQ/FLIP
    document.getElementById('typeMode').onclick = () => {
      answerMode = 'type';
      document.querySelectorAll('.answer-mode-toggle.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('typeMode').classList.add('active');
      showCard();
    };

    document.getElementById('mcqMode').onclick = () => {
      answerMode = 'mcq';
      document.querySelectorAll('.answer-mode-toggle.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('mcqMode').classList.add('active');
      showCard();
    };

    document.getElementById('flipMode').onclick = () => {
      answerMode = 'flip';
      document.querySelectorAll('.answer-mode-toggle.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('flipMode').classList.add('active');
      showCard();
    };

    document.getElementById('homeBtn').onclick = () => {
      window.location.href = '/ram1025/';
    };

    window.addEventListener('load', () => {
      loadMatrixFromGitHub();
    });
  </script>
</body>
</html>
