<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABST BRAIN | P24 | INDIAN.001</title>
    <meta name="theme-color" content="#00ffaa">
    <style>
        * { margin:0; padding:0; box-sizing:border-box }
        html { scroll-behavior: smooth; font-size: 16px; }
        body { background:#0a192f; color:#00ffaa; font-family:system-ui,-apple-system,sans-serif; padding:20px; text-align:center; min-height:100vh }
      .header { margin-bottom:20px; position:relative; display:flex; align-items:center; justify-content:center }
      .header h1 { font-size:34px; text-shadow:0 0 15px #00ffaa; margin-bottom:8px; letter-spacing:2px; margin-left:70px }
      .header p { color:#ffaa00; font-size:14px; font-weight:700; position:absolute; top:45px; width:100% }
      .back-btn { position:absolute; left:0; top:5px; background:#1a2332; color:#00ffaa; border:1px solid #00ffaa; padding:8px 16px; border-radius:8px; font-weight:700; cursor:pointer; font-size:14px; z-index:10 }
      .mode-toggle,.answer-mode-toggle { background:#112240; border:1px solid #ffaa00; padding:10px; border-radius:10px; margin:15px auto; max-width:550px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap }
      .mode-btn { background:#1a2332; color:#8892b0; border:none; padding:8px 20px; border-radius:8px; cursor:pointer; font-weight:700; font-size:13px }
      .mode-btn.active { background:#ffaa00; color:#0a192f }
      .card { background:linear-gradient(145deg,#1a2332,#0f1723); padding:35px; border-radius:24px; border:2px solid #00ffaa; min-height:320px; margin:20px auto; max-width:550px; box-shadow:0 0 40px #00ffaa20; position:relative; transition:border-color 0.3s }
      .card.correct { border-color:#44ff88; box-shadow:0 0 40px #44ff8820 }
      .card.wrong { border-color:#ff4444; box-shadow:0 0 40px #ff444420 }
      .pillar { color:#ffaa00; font-size:13px; font-weight:800; margin-bottom:18px; text-transform:uppercase }
      .question { font-size:24px; margin:25px 0; min-height:90px; line-height:1.4; color:#fff }
      .answer-input { width:100%; padding:14px; background:#0a192f; border:2px solid #00ffaa; border-radius:10px; color:#fff; font-size:18px; text-align:center; margin:20px 0; transition:border-color 0.3s }
      .answer-input.correct { border-color:#44ff88; background:#44ff8810 }
      .answer-input.wrong { border-color:#ff4444; background:#ff444410 }
      .mcq-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:20px 0 }
      .mcq-btn { background:#1a2332; color:#fff; border:2px solid #00ffaa40; padding:15px; border-radius:10px; cursor:pointer; font-size:15px; transition:all 0.2s }
      .mcq-btn:hover { border-color:#00ffaa; background:#00ffaa20 }
      .mcq-btn.correct { background:#44ff88; color:#0a192f; border-color:#44ff88 }
      .mcq-btn.wrong { background:#ff4444; color:#fff; border-color:#ff4444 }
      .mcq-btn:disabled { opacity:0.6; cursor:not-allowed }
      .btn { background:#00ffaa; color:#0a192f; padding:16px 32px; border:none; border-radius:14px; margin:8px; font-weight:900; font-size:16px; cursor:pointer; transition:all 0.2s }
      .btn:hover { transform:scale(1.05); box-shadow:0 0 20px #00ffaa80 }
      .btn-check { background:#ffaa00; color:#0a192f }
      .quality-btns { display:none; gap:8px; justify-content:center; margin:20px 0; flex-wrap:wrap }
      .btn-again { background:#ff4444; color:#fff; padding:12px 20px }
      .btn-hard { background:#ffaa00; color:#0a192f; padding:12px 20px }
      .btn-good { background:#00ffaa; color:#0a192f; padding:12px 20px }
      .btn-easy { background:#44ff88; color:#0a192f; padding:12px 20px }
      .stats { display:flex; justify-content:space-around; margin:35px auto; max-width:550px; font-size:15px; background:#1a2332; padding:20px; border-radius:16px; border:1px solid #00ffaa40 }
      .stats b { color:#fff; font-size:20px; display:block; margin-top:5px }
      .footer { margin-top:50px; font-size:12px; opacity:0.6 }
      .badge { position:absolute; top:-12px; right:20px; background:#ffaa00; color:#0a192f; padding:6px 12px; border-radius:20px; font-size:11px; font-weight:900 }
      .feedback-msg { font-size:18px; font-weight:700; margin:15px 0; min-height:25px }
      .timer { position:absolute; top:10px; left:20px; background:#ff4444; color:#fff; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:900; display:none }
      .timer.warning { background:#ffaa00; color:#0a192f }
      .loading { color:#ffaa00; font-size:18px; padding:40px; text-align:center }
      .age-modal { position:fixed; top:0; left:0; width:100%; height:100%; background:#0a192fdd; display:flex; align-items:center; justify-content:center; z-index:100 }
      .age-box { background:#1a2332; padding:30px; border-radius:20px; border:2px solid #00ffaa; max-width:400px; width:90% }
      .age-box h2 { color:#ffaa00; margin-bottom:20px }
      .age-box select { width:100%; padding:12px; margin:10px 0; background:#0a192f; border:2px solid #00ffaa; border-radius:10px; color:#fff; font-size:16px }
    </style>
</head>
<body>
    <div class="age-modal" id="ageModal">
        <div class="age-box">
            <h2>Select Your Level</h2>
            <select id="userClass">
                <optgroup label="School">
                    <option value="lkg">LKG</option>
                    <option value="ukg">UKG</option>
                    <option value="class1">Class 1</option>
                    <option value="class2">Class 2</option>
                    <option value="class3">Class 3</option>
                    <option value="class4">Class 4</option>
                    <option value="class5">Class 5</option>
                    <option value="class6">Class 6</option>
                    <option value="class7">Class 7</option>
                    <option value="class8">Class 8</option>
                    <option value="class9">Class 9</option>
                    <option value="class10">Class 10</option>
                    <option value="class11">Class 11</option>
                    <option value="class12">Class 12</option>
                </optgroup>
                <optgroup label="Competitive">
                    <option value="upsc">UPSC</option>
                    <option value="neet">NEET</option>
                    <option value="jee">JEE</option>
                    <option value="ssc">SSC</option>
                    <option value="banking">Banking</option>
                </optgroup>
                <optgroup label="Other">
                    <option value="gk" selected>General Knowledge</option>
                    <option value="phd">PhD Level</option>
                </optgroup>
            </select>
            <button class="btn" id="saveAgeBtn">START LEARNING</button>
        </div>
    </div>

    <div class="header">
        <button class="back-btn" id="homeBtn">← CLOSE</button>
        <h1>ABST BRAIN</h1>
        <p>SOVEREIGN ID: INDIAN.001 | 108 Mantra + 1000 Sahasra</p>
    </div>
    <div class="mode-toggle">
        <button class="mode-btn active" id="abstMode">🏛 36 PILLARS - 108</button>
        <button class="mode-btn" id="eduMode">📖 EDUCATION - KG to PhD</button>
    </div>
    <div class="answer-mode-toggle">
        <button class="mode-btn active" id="typeMode">✏️ TYPE</button>
        <button class="mode-btn" id="mcqMode">⚪ MCQ</button>
        <button class="mode-btn" id="flipMode">🔁 FLIP</button>
    </div>
    <div class="card" id="cardBox">
        <div class="timer" id="timer">10s</div>
        <div class="badge" id="cardCount">0/0</div>
        <div class="pillar" id="pillarTag">Loading...</div>
        <h2 class="question" id="question"><div class="loading">Loading Matrix...</div></h2>
        <div id="typeAnswerBox" style="display:none">
            <input type="text" class="answer-input" id="userAnswer" placeholder="Type your answer here..." autocomplete="off">
            <button class="btn btn-check" id="checkBtn">CHECK ANSWER</button>
        </div>
        <div id="mcqAnswerBox" style="display:none">
            <div class="mcq-grid" id="mcqGrid"></div>
        </div>
        <button class="btn" id="showBtn" style="display:none">SHOW ANSWER</button>
        <div class="feedback-msg" id="feedbackMsg"></div>
        <div id="answerBox" style="display:none">
            <hr style="border-color:#00ffaa; margin:30px 0; opacity:0.2">
            <h3 id="answer" style="color:#44ff88"></h3>
            <div class="quality-btns" id="qualityBtns">
                <button class="btn btn-again" data-quality="1">AGAIN<br><small>1d</small></button>
                <button class="btn btn-hard" data-quality="2">HARD<br><small>1d</small></button>
                <button class="btn btn-good" data-quality="3">GOOD<br><small>6d</small></button>
                <button class="btn btn-easy" data-quality="4">EASY<br><small>15d</small></button>
            </div>
        </div>
    </div>

    <div class="stats">
        <div>Due Now<b id="dueCount">0</b></div>
        <div>Streak<b id="streakCount">0<br>days</b></div>
        <div>Total<b id="totalCount">0<br>/0</b></div>
    </div>

    <div class="footer">ABST P24 Civilization OS | SM-2 Algorithm | 108 Mantra + 1000 Sahasra</div>
    
    <script>
    // ===== GITHUB RAW URLs - NEE FILES =====
    const GITHUB_USER = 'ram1025';
    const PILLARS_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/ram1025/main/36-pillars-108.db`;
    const EDU_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/ram1025/main/Education-kgtogk-1000.db`;

    // ===== SM-2 ALGORITHM =====
    window.ABST_SM2 = {
      calc: function(card, quality) {
        if (quality < 3) {
          card.reps = 0;
          card.interval = 1;
        } else {
          if (card.reps === 0) card.interval = 1;
          else if (card.reps === 1) card.interval = 6;
          else card.interval = Math.round(card.interval * card.ease);
          card.reps += 1;
        }
        card.ease = card.ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
        if (card.ease < 1.3) card.ease = 1.3;
        card.due = Date.now() + card.interval * 24 * 60 * 60 * 1000;
        return card;
      }
    };

    // ===== BRAIN LOGIC =====
    let currentMode = 'abst';
    let answerMode = 'type';
    let currentCard = null;
    let dueCards = [];
    let currentIndex = 0;
    let userClass = 'gk';
    let streak = parseInt(localStorage.getItem('abst_streak') || '0');
    let timer = null;
    let timeLeft = 10;
    let allCards = [];
    let allEducationCards = [];

    // ===== AUTO LOAD FROM GITHUB =====
    async function loadMatrixFromGitHub() {
        try {
            document.getElementById('question').innerHTML = '<div class="loading">Loading 36 Pillars...</div>';
            
            // Load 36 Pillars
            const res36 = await fetch(PILLARS_URL);
            if(!res36.ok) throw new Error('36 Pillars file not found');
            allCards = await res36.json();
            
            document.getElementById('question').innerHTML = '<div class="loading">Loading Education Matrix...</div>';
            
            // Load Education
            const resEdu = await fetch(EDU_URL);
            if(!resEdu.ok) throw new Error('Education file not found');
            allEducationCards = await resEdu.json();
            
            // Save to localStorage for offline
            localStorage.setItem('abst_memory_vault', JSON.stringify({
                "36-pillars": allCards,
                "education": allEducationCards
            }));
            
            // Load saved progress
            const saved = localStorage.getItem('abst_brain_cards');
            if(saved) {
                const parsed = JSON.parse(saved);
                parsed.forEach(savedCard => {
                    const idx1 = allCards.findIndex(c => c.id === savedCard.id);
                    if(idx1 >= 0) allCards[idx1] = savedCard;
                    const idx2 = allEducationCards.findIndex(c => c.id === savedCard.id);
                    if(idx2 >= 0) allEducationCards[idx2] = savedCard;
                });
            }
            
            initBrain();
        } catch(err) {
            console.error(err);
            document.getElementById('question').innerHTML = '<div style="color:#ff4444">Error: ' + err.message + '<br><small>Check GitHub files or internet</small></div>';
            document.getElementById('pillarTag').innerText = 'LOAD FAILED';
        }
    }

    function initBrain() {
        loadCards();
        updateStats();
        nextCard();
    }

    function loadCards() {
        let cards = currentMode === 'abst'? allCards : allEducationCards;
        if(currentMode === 'edu') {
            const cls = userClass.replace('class','');
            cards = cards.filter(c => {
                const cat = (c.category || '').toLowerCase();
                return cat.includes(cls) || cat.includes(userClass) || cat.includes('gk') || cat.includes('general');
            });
        }
        dueCards = cards.filter(c =>!c.due || c.due <= Date.now());
        if(dueCards.length === 0) dueCards = [...cards];
        currentIndex = 0;
    }

    function nextCard() {
        if(dueCards.length === 0) {
            document.getElementById('question').innerText = 'All done! 🎉';
            document.getElementById('pillarTag').innerText = 'COMPLETE';
            document.getElementById('timer').style.display = 'none';
            return;
        }
        currentCard = dueCards[currentIndex % dueCards.length];
        document.getElementById('question').innerText = currentCard.q || currentCard.question;
        document.getElementById('pillarTag').innerText = currentCard.pillar || currentCard.category || 'GENERAL';
        document.getElementById('cardCount').innerText = `${currentIndex + 1}/${dueCards.length}`;
        document.getElementById('answerBox').style.display = 'none';
        document.getElementById('feedbackMsg').innerText = '';
        document.getElementById('cardBox').className = 'card';
        document.getElementById('userAnswer').className = 'answer-input';
        document.getElementById('userAnswer').value = '';
        
        if(answerMode === 'type') {
            document.getElementById('typeAnswerBox').style.display = 'block';
            document.getElementById('mcqAnswerBox').style.display = 'none';
            document.getElementById('showBtn').style.display = 'none';
        } else if(answerMode === 'mcq') {
            document.getElementById('typeAnswerBox').style.display = 'none';
            document.getElementById('mcqAnswerBox').style.display = 'block';
            document.getElementById('showBtn').style.display = 'none';
            generateMCQ();
        } else {
            document.getElementById('typeAnswerBox').style.display = 'none';
            document.getElementById('mcqAnswerBox').style.display = 'none';
            document.getElementById('showBtn').style.display = 'block';
        }
        startTimer();
    }

    function generateMCQ() {
        const grid = document.getElementById('mcqGrid');
        grid.innerHTML = '';
        const correct = currentCard.a || currentCard.answer;
        let options = [correct];
        let pool = dueCards.filter(c => (c.a || c.answer)!== correct).map(c => c.a || c.answer);
        pool = [...new Set(pool)];
        while(options.length < 4 && pool.length > 0) {
            const idx = Math.floor(Math.random() * pool.length);
            options.push(pool.splice(idx, 1)[0]);
        }
        options.sort(() => Math.random() - 0.5);
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'mcq-btn';
            btn.innerText = opt;
            btn.onclick = () => checkMCQ(opt === correct, btn);
            grid.appendChild(btn);
        });
    }

    function checkMCQ(isCorrect, btn) {
        clearInterval(timer);
        document.querySelectorAll('.mcq-btn').forEach(b => b.disabled = true);
        const correctAns = currentCard.a || currentCard.answer;
        if(isCorrect) {
            btn.classList.add('correct');
            document.getElementById('feedbackMsg').innerText = '✅ Correct!';
            document.getElementById('feedbackMsg').style.color = '#44ff88';
            document.getElementById('cardBox').classList.add('correct');
            streak++;
            localStorage.setItem('abst_streak', streak);
            updateCard(4);
        } else {
            btn.classList.add('wrong');
            document.querySelectorAll('.mcq-btn').forEach(b => {
                if(b.innerText === correctAns) b.classList.add('correct');
            });
            document.getElementById('feedbackMsg').innerText = '❌ Wrong! Correct: ' + correctAns;
            document.getElementById('feedbackMsg').style.color = '#ff4444';
            document.getElementById('cardBox').classList.add('wrong');
            streak = 0;
            localStorage.setItem('abst_streak', 0);
            updateCard(1);
        }
        updateStats();
        setTimeout(() => { currentIndex++; nextCard(); }, 2000);
    }

    function checkAnswer() {
        clearInterval(timer);
        const userAns = document.getElementById('userAnswer').value.trim().toLowerCase();
        const correctAns = (currentCard.a || currentCard.answer).toLowerCase();
        const isCorrect = userAns === correctAns || correctAns.includes(userAns) || userAns.includes(correctAns);
        
        if(isCorrect) {
            document.getElementById('feedbackMsg').innerText = '✅ Correct!';
            document.getElementById('feedbackMsg').style.color = '#44ff88';
            document.getElementById('cardBox').classList.add('correct');
            document.getElementById('userAnswer').classList.add('correct');
            streak++;
            localStorage.setItem('abst_streak', streak);
            updateCard(4);
        } else {
            document.getElementById('feedbackMsg').innerText = '❌ Wrong! Correct: ' + (currentCard.a || currentCard.answer);
            document.getElementById('feedbackMsg').style.color = '#ff4444';
            document.getElementById('cardBox').classList.add('wrong');
            document.getElementById('userAnswer').classList.add('wrong');
            streak = 0;
            localStorage.setItem('abst_streak', 0);
            updateCard(1);
        }
        updateStats();
        setTimeout(() => { currentIndex++; nextCard(); }, 2000);
    }

    function showAnswer() {
        clearInterval(timer);
        document.getElementById('answer').innerText = currentCard.a || currentCard.answer;
        document.getElementById('answerBox').style.display = 'block';
        document.getElementById('qualityBtns').style.display = 'flex';
        document.getElementById('showBtn').style.display = 'none';
    }

    function updateCard(quality) {
        currentCard = window.ABST_SM2.calc(currentCard, quality);
        // Save to correct array
        const idx1 = allCards.findIndex(c => c.id === currentCard.id);
        if(idx1 >= 0) allCards[idx1] = currentCard;
        const idx2 = allEducationCards.findIndex(c => c.id === currentCard.id);
        if(idx2 >= 0) allEducationCards[idx2] = currentCard;
        
        // Save to localStorage
        const allSave = [...allCards,...allEducationCards];
        localStorage.setItem('abst_brain_cards', JSON.stringify(allSave));
    }

    function updateStats() {
        document.getElementById('dueCount').innerText = dueCards.length;
        document.getElementById('streakCount').innerHTML = streak + '<br>days';
        document.getElementById('totalCount').innerHTML = (allCards.length + allEducationCards.length) + '<br>/1108';
    }

    function startTimer() {
        timeLeft = 10;
        document.getElementById('timer').style.display = 'block';
        document.getElementById('timer').innerText = timeLeft + 's';
        document.getElementById('timer').classList.remove('warning');
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft + 's';
            if(timeLeft <= 3) document.getElementById('timer').classList.add('warning');
            if(timeLeft <= 0) {
                clearInterval(timer);
                if(answerMode === 'type') checkAnswer();
                else if(answerMode === 'flip') showAnswer();
            }
        }, 1000);
    }

    // Event Listeners
    document.getElementById('checkBtn').onclick = checkAnswer;
    document.getElementById('showBtn').onclick = showAnswer;
    document.getElementById('userAnswer').addEventListener('keypress', e => {
        if(e.key === 'Enter') checkAnswer();
    });
    document.getElementById('homeBtn').onclick = () => {
        if(window.parent!== window) window.parent.closeM('abstBrainModal');
        else window.close();
    };

    document.getElementById('abstMode').onclick = () => {
        currentMode = 'abst';
        document.getElementById('abstMode').classList.add('active');
        document.getElementById('eduMode').classList.remove('active');
        initBrain();
    };
    document.getElementById('eduMode').onclick = () => {
        currentMode = 'edu';
        document.getElementById('eduMode').classList.add('active');
        document.getElementById('abstMode').classList.remove('active');
        initBrain();
    };

    document.getElementById('typeMode').onclick = () => {
        answerMode = 'type';
        document.getElementById('typeMode').classList.add('active');
        document.getElementById('mcqMode').classList.remove('active');
        document.getElementById('flipMode').classList.remove('active');
        nextCard();
    };
    document.getElementById('mcqMode').onclick = () => {
        answerMode = 'mcq';
        document.getElementById('mcqMode').classList.add('active');
        document.getElementById('typeMode').classList.remove('active');
        document.getElementById('flipMode').classList.remove('active');
        nextCard();
    };
    document.getElementById('flipMode').onclick = () => {
        answerMode = 'flip';
        document.getElementById('flipMode').classList.add('active');
        document.getElementById('typeMode').classList.remove('active');
        document.getElementById('mcqMode').classList.remove('active');
        nextCard();
    };

    document.querySelectorAll('[data-quality]').forEach(btn => {
        btn.onclick = () => {
            const quality = parseInt(btn.dataset.quality);
            updateCard(quality);
            currentIndex++;
            nextCard();
        };
    });

    document.getElementById('saveAgeBtn').onclick = () => {
        userClass = document.getElementById('userClass').value;
        localStorage.setItem('abst_user_class', userClass);
        document.getElementById('ageModal').style.display = 'none';
        loadMatrixFromGitHub();
    };

    // Check if class saved
    const savedClass = localStorage.getItem('abst_user_class');
    if(savedClass) {
        userClass = savedClass;
        document.getElementById('userClass').value = savedClass;
        document.getElementById('ageModal').style.display = 'none';
        loadMatrixFromGitHub();
    }
    </script>
</body>
</html>
