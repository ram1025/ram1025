<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0">
    <title>ABST BRAIN | P24 | INDIAN.001</title>
    <meta name="theme-color" content="#00ffaa">
    <style>
        * { margin:0; padding:0; box-sizing:border-box }
        html { scroll-behavior: smooth; font-size: 16px; }
        body { background:#0a192f; color:#00ffaa; font-family:system-ui,-apple-system,sans-serif; padding:20px; text-align:center; min-height:100vh }
      .header { margin-bottom:20px; position:relative; display:flex; align-items:center; justify-content:center }
      .header h1 { font-size:34px; text-shadow:0 0 15px #00ffaa; margin-bottom:8px; letter-spacing:2px; margin-left:70px }
      .header p { color:#ffaa00; font-size:14px; font-weight:700; position:absolute; top:45px; width:100% }
      .back-btn { position:absolute; left:0; top:5px; background:#1a2332; color:#00ffaa; border:1px solid #00ffaa; padding:8px 16px; border-radius:8px; font-weight:700; cursor:pointer; font-size:14px; z-index:10 }
      .mode-toggle,.answer-mode-toggle { background:#112240; border:1px solid #ffaa00; padding:10px; border-radius:10px; margin:15px auto; max-width:550px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap }
      .mode-btn { background:#1a2332; color:#8892b0; border:none; padding:8px 20px; border-radius:8px; cursor:pointer; font-weight:700; font-size:13px }
      .mode-btn.active { background:#ffaa00; color:#0a192f }
      .card { background:linear-gradient(145deg,#1a2332,#0f1723); padding:35px; border-radius:24px; border:2px solid #00ffaa; min-height:320px; margin:20px auto; max-width:550px; box-shadow:0 0 40px #00ffaa20; position:relative; transition:border-color 0.3s }
      .card.correct { border-color:#44ff88; box-shadow:0 0 40px #44ff8820 }
      .card.wrong { border-color:#ff4444; box-shadow:0 0 40px #ff444420 }
      .pillar { color:#ffaa00; font-size:13px; font-weight:800; margin-bottom:18px; text-transform:uppercase }
      .question { font-size:24px; margin:25px 0; min-height:90px; line-height:1.4; color:#fff }
      .answer-input { width:100%; padding:14px; background:#0a192f; border:2px solid #00ffaa; border-radius:10px; color:#fff; font-size:18px; text-align:center; margin:20px 0; transition:border-color 0.3s }
      .answer-input.correct { border-color:#44ff88; background:#44ff8810 }
      .answer-input.wrong { border-color:#ff4444; background:#ff444410 }
      .mcq-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:20px 0 }
      .mcq-btn { background:#1a2332; color:#fff; border:2px solid #00ffaa40; padding:15px; border-radius:10px; cursor:pointer; font-size:15px; transition:all 0.2s }
      .mcq-btn:hover { border-color:#00ffaa; background:#00ffaa20 }
      .mcq-btn.correct { background:#44ff88; color:#0a192f; border-color:#44ff88 }
      .mcq-btn.wrong { background:#ff4444; color:#fff; border-color:#ff4444 }
      .mcq-btn:disabled { opacity:0.6; cursor:not-allowed }
      .btn { background:#00ffaa; color:#0a192f; padding:16px 32px; border:none; border-radius:14px; margin:8px; font-weight:900; font-size:16px; cursor:pointer; transition:all 0.2s }
      .btn:hover { transform:scale(1.05); box-shadow:0 0 20px #00ffaa80 }
      .btn-check { background:#ffaa00; color:#0a192f }
      .quality-btns { display:none; gap:8px; justify-content:center; margin:20px 0; flex-wrap:wrap }
      .btn-again { background:#ff4444; color:#fff; padding:12px 20px }
      .btn-hard { background:#ffaa00; color:#0a192f; padding:12px 20px }
      .btn-good { background:#00ffaa; color:#0a192f; padding:12px 20px }
      .btn-easy { background:#44ff88; color:#0a192f; padding:12px 20px }
      .stats { display:flex; justify-content:space-around; margin:35px auto; max-width:550px; font-size:15px; background:#1a2332; padding:20px; border-radius:16px; border:1px solid #00ffaa40 }
      .stats b { color:#fff; font-size:20px; display:block; margin-top:5px }
      .footer { margin-top:50px; font-size:12px; opacity:0.6 }
      .badge { position:absolute; top:-12px; right:20px; background:#ffaa00; color:#0a192f; padding:6px 12px; border-radius:20px; font-size:11px; font-weight:900 }
      .feedback-msg { font-size:18px; font-weight:700; margin:15px 0; min-height:25px }
      .timer { position:absolute; top:10px; left:20px; background:#ff4444; color:#fff; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:900; display:none }
      .timer.warning { background:#ffaa00; color:#0a192f }
      .age-modal { position:fixed; top:0; left:0; width:100%; height:100%; background:#0a192fdd; display:flex; align-items:center; justify-content:center; z-index:100 }
      .age-box { background:#1a2332; padding:30px; border-radius:20px; border:2px solid #00ffaa; max-width:400px; width:90% }
      .age-box h2 { color:#ffaa00; margin-bottom:20px }
      .age-box select { width:100%; padding:12px; margin:10px 0; background:#0a192f; border:2px solid #00ffaa; border-radius:10px; color:#fff; font-size:16px }
    </style>
</head>
<body>
    <div class="age-modal" id="ageModal">
        <div class="age-box">
            <h2>Select Your Level</h2>
            <select id="userClass">
                <optgroup label="School">
                    <option value="lkg">LKG</option>
                    <option value="ukg">UKG</option>
                    <option value="class1">Class 1</option>
                    <option value="class2">Class 2</option>
                    <option value="class3">Class 3</option>
                    <option value="class4">Class 4</option>
                    <option value="class5">Class 5</option>
                    <option value="class6">Class 6</option>
                    <option value="class7">Class 7</option>
                    <option value="class8">Class 8</option>
                    <option value="class9">Class 9</option>
                    <option value="class10">Class 10</option>
                    <option value="class11">Class 11</option>
                    <option value="class12">Class 12</option>
                </optgroup>
                <optgroup label="Competitive">
                    <option value="upsc">UPSC</option>
                    <option value="neet">NEET</option>
                    <option value="jee">JEE</option>
                    <option value="ssc">SSC</option>
                    <option value="banking">Banking</option>
                </optgroup>
                <optgroup label="Other">
                    <option value="gk" selected>General Knowledge</option>
                    <option value="phd">PhD Level</option>
                </optgroup>
            </select>
            <button class="btn" id="saveAgeBtn">START LEARNING</button>
        </div>
    </div>

    <div class="header">
        <button class="back-btn" id="homeBtn">← HOME</button>
        <h1>ABST BRAIN</h1>
        <p>SOVEREIGN ID: INDIAN.001 | 108 Mantra + 1000 Sahasra</p>
    </div>
    <div class="mode-toggle">
        <button class="mode-btn active" id="abstMode">🏛 36 PILLARS - 108</button>
        <button class="mode-btn" id="eduMode">📖 EDUCATION - KG to PhD</button>
    </div>
    <div class="answer-mode-toggle">
        <button class="mode-btn active" id="typeMode">✏️ TYPE</button>
        <button class="mode-btn" id="mcqMode">⚪ MCQ</button>
        <button class="mode-btn" id="flipMode">🔁 FLIP</button>
    </div>
    <div class="card" id="cardBox">
        <div class="timer" id="timer">10s</div>
        <div class="badge" id="cardCount">0/0</div>
        <div class="pillar" id="pillarTag">Loading...</div>
        <h2 class="question" id="question">Loading questions...</h2>
        <div id="typeAnswerBox" style="display:none">
            <input type="text" class="answer-input" id="userAnswer" placeholder="Type your answer here..." autocomplete="off">
            <button class="btn btn-check" id="checkBtn">CHECK ANSWER</button>
        </div>
        <div id="mcqAnswerBox" style="display:none">
            <div class="mcq-grid" id="mcqGrid"></div>
        </div>
        <button class="btn" id="showBtn" style="display:none">SHOW ANSWER</button>
        <div class="feedback-msg" id="feedbackMsg"></div>
        <div id="answerBox" style="display:none">
            <hr style="border-color:#00ffaa; margin:30px 0; opacity:0.2">
            <h3 id="answer" style="color:#44ff88"></h3>
            <div class="quality-btns" id="qualityBtns">
                <button class="btn btn-again" data-quality="1">AGAIN<br><small>1d</small></button>
                <button class="btn btn-hard" data-quality="2">HARD<br><small>1d</small></button>
                <button class="btn btn-good" data-quality="3">GOOD<br><small>6d</small></button>
                <button class="btn btn-easy" data-quality="4">EASY<br><small>15d</small></button>
            </div>
        </div>
    </div>

    <div class="stats">
        <div>Due Now<b id="dueCount">0</b></div>
        <div>Streak<b id="streakCount">0<br>days</b></div>
        <div>Total<b id="totalCount">0<br>/0</b></div>
    </div>

    <div class="footer">ABST P24 Civilization OS | SM-2 Algorithm | 108 Mantra + 1000 Sahasra</div>

<script>
// ===== SM-2 ALGORITHM - INLINE =====
window.ABST_SM2 = {
  calc: function(card, quality) {
    if (quality < 3) {
      card.reps = 0;
      card.interval = 1;
    } else {
      if (card.reps === 0) {
        card.interval = 1;
      } else if (card.reps === 1) {
        card.interval = 6;
      } else {
        card.interval = Math.round(card.interval * card.ease);
      }
      card.reps += 1;
    }
    card.ease = card.ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
    if (card.ease < 1.3) card.ease = 1.3;
    card.due = Date.now() + card.interval * 24 * 60 * 60 * 1000;
    return card;
  },
  pillarBoost: function(card, pillarNum) {
    const boostFactor = 1 + (pillarNum / 100);
    card.interval = Math.round(card.interval * boostFactor);
    return card;
  }
};

// ===== 36 PILLARS DATA - 108 CARDS =====
// ⚠️ IKKADA NUVVU UNNA 108 QUESTIONS PASTE CHEY
window.allCards = [
  { pillar: 'P1: TATTVAM', question: 'What is the supreme truth?', answer: 'Brahman', subject: 'abst', reps: 0, ease: 2.5, interval: 0, due: null },
  { pillar: 'P1: TATTVAM', question: 'What does Tat Tvam Asi mean?', answer: 'You are That', subject: 'abst', reps: 0, ease: 2.5, interval: 0, due: null },
  { pillar: 'P1: TATTVAM', question: 'What is Maya?', answer: 'Illusion', subject: 'abst', reps: 0, ease: 2.5, interval: 0, due: null },
  { pillar: 'P24: NATION', question: 'P24 represents?', answer: 'Nation', subject: 'abst', reps: 0, ease: 2.5, interval: 0, due: null },
  { pillar: 'P24: NATION', question: 'What is Bharat?', answer: 'India', subject: 'abst', reps: 0, ease: 2.5, interval: 0, due: null },
  // PASTE YOUR 108 PILLAR QUESTIONS HERE - Format same ga undali
];

// ===== EDUCATION DATA - 1000 CARDS =====
// ⚠️ IKKADA NUVVU UNNA 1000 QUESTIONS PASTE CHEY
window.allEducationCards = [
  { pillar: 'GK: CAPITALS', question: 'Capital of India?', answer: 'Delhi', subject: 'gk', reps: 0, ease: 2.5, interval: 0, due: null },
  { pillar: 'GK: CAPITALS', question: 'Capital of Telangana?', answer: 'Hyderabad', subject: 'gk', reps: 0, ease: 2.5, interval: 0, due: null },
  { pillar: 'GK: CAPITALS', question: 'Capital of Maharashtra?', answer: 'Mumbai', subject: 'gk', reps: 0, ease: 2.5, interval: 0, due: null },
  { pillar: 'CLASS1: MATH', question: '2 + 2 =?', answer: '4', subject: 'class1', reps: 0, ease: 2.5, interval: 0, due: null },
  { pillar: 'UPSC: HISTORY', question: 'Who was first PM of India?', answer: 'Nehru', subject: 'upsc', reps: 0, ease: 2.5, interval: 0, due: null },
  // PASTE YOUR 1000 EDUCATION QUESTIONS HERE - Format same ga undali
];

// ===== MAIN APP LOGIC =====
const pillarCards = window.allCards || [];
const eduCards = window.allEducationCards || [];
let allCards = [...pillarCards,...eduCards];

console.log('✅ Pillar:', pillarCards.length, '| Education:', eduCards.length, '| Total:', allCards.length);

allCards = allCards.map(card => {
    if (!card.hasOwnProperty('reps')) card.reps = 0;
    if (!card.hasOwnProperty('ease')) card.ease = 2.5;
    if (!card.hasOwnProperty('interval')) card.interval = 0;
    if (!card.hasOwnProperty('due')) card.due = null;
    if (!card.hasOwnProperty('pillarNum')) {
        const match = card.pillar?.match(/P(\d+)/);
        card.pillarNum = match? parseInt(match[1]) : 0;
    }
    if (!card.hasOwnProperty('subject')) {
        if (card.pillar?.startsWith('P')) card.subject = 'abst';
        else card.subject = 'gk';
    }
    return card;
});

const savedCards = localStorage.getItem('abst_cards');
if (savedCards) {
    const parsed = JSON.parse(savedCards);
    parsed.forEach(savedCard => {
        const idx = allCards.findIndex(c => c.question === savedCard.question);
        if (idx!== -1) allCards[idx] = savedCard;
    });
}

let currentSubject = 'abst';
let currentMode = 'type';
let current = 0;
let dueCards = [];
let userClass = localStorage.getItem('abst_user_class') || 'gk';
let timerInterval = null;
let timeLeft = 10;
let answered = false;

document.addEventListener('DOMContentLoaded', () => {
    if (!localStorage.getItem('abst_user_class')) {
        document.getElementById('ageModal').style.display = 'flex';
    } else {
        initCards();
    }
    setupEventListeners();
    updateStats();
});

document.getElementById('saveAgeBtn').addEventListener('click', () => {
    userClass = document.getElementById('userClass').value;
    localStorage.setItem('abst_user_class', userClass);
    document.getElementById('ageModal').style.display = 'none';
    initCards();
});

function setupEventListeners() {
    document.getElementById('abstMode').onclick = () => switchSubject('abst');
    document.getElementById('eduMode').onclick = () => switchSubject('edu');
    document.getElementById('typeMode').onclick = () => switchMode('type');
    document.getElementById('mcqMode').onclick = () => switchMode('mcq');
    document.getElementById('flipMode').onclick = () => switchMode('flip');
    document.getElementById('checkBtn').onclick = checkAnswer;
    document.getElementById('showBtn').onclick = showAnswer;
    document.getElementById('homeBtn').onclick = () => window.location.href = 'index.html';
    document.getElementById('userAnswer').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkAnswer();
    });
    document.getElementById('qualityBtns').addEventListener('click', (e) => {
        if (e.target.classList.contains('btn')) {
            rateCard(parseInt(e.target.dataset.quality));
        }
    });
}

function startTimer() {
    clearInterval(timerInterval);
    timeLeft = 10;
    answered = false;
    const timerEl = document.getElementById('timer');
    timerEl.style.display = 'block';
    timerEl.textContent = timeLeft + 's';
    timerEl.classList.remove('warning');
    timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft + 's';
        if (timeLeft <= 3) timerEl.classList.add('warning');
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            if (!answered) {
                document.getElementById('feedbackMsg').textContent = '⏰ Time Up!';
                showAnswer();
            }
        }
    }, 1000);
}

function stopTimer() {
    clearInterval(timerInterval);
    document.getElementById('timer').style.display = 'none';
}

function switchSubject(subj) {
    currentSubject = subj;
    document.querySelectorAll('.mode-toggle.mode-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(subj + 'Mode').classList.add('active');
    current = 0;
    initCards();
}

function switchMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.answer-mode-toggle.mode-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(mode + 'Mode').classList.add('active');
    showCard();
}

function initCards() {
    let filteredCards = [];
    if (currentSubject === 'abst') {
        filteredCards = allCards.filter(c => c.subject === 'abst');
    } else {
        filteredCards = allCards.filter(c => c.subject === userClass || c.subject === 'gk');
    }
    console.log('Filtered:', filteredCards.length);
    const now = Date.now();
    dueCards = filteredCards.filter(c =>!c.due || c.due <= now);
    if (dueCards.length === 0) {
        dueCards = filteredCards.filter(c => c.reps === 0).slice(0, 7);
    }
    if (dueCards.length === 0) {
        dueCards = filteredCards.sort(() => Math.random() - 0.5).slice(0, 7);
    }
    current = 0;
    updateStats();
    showCard();
}

function showCard() {
    if (dueCards.length === 0) {
        document.getElementById('question').textContent = '🎉 No cards due today! Come back tomorrow.';
        document.getElementById('typeAnswerBox').style.display = 'none';
        document.getElementById('mcqAnswerBox').style.display = 'none';
        document.getElementById('showBtn').style.display = 'none';
        document.getElementById('cardCount').textContent = '0/0';
        stopTimer();
        return;
    }
    const card = dueCards[current];
    document.getElementById('pillarTag').textContent = card.pillar;
    document.getElementById('question').textContent = card.question;
    document.getElementById('cardCount').textContent = `${current + 1}/${dueCards.length}`;
    document.getElementById('answerBox').style.display = 'none';
    document.getElementById('feedbackMsg').textContent = '';
    document.getElementById('cardBox').className = 'card';
    document.getElementById('qualityBtns').style.display = 'none';
    document.getElementById('userAnswer').value = '';
    document.getElementById('userAnswer').className = 'answer-input';
    if (currentMode === 'type') {
        document.getElementById('typeAnswerBox').style.display = 'block';
        document.getElementById('mcqAnswerBox').style.display = 'none';
        document.getElementById('showBtn').style.display = 'none';
        setTimeout(() => document.getElementById('userAnswer').focus(), 100);
        startTimer();
    } else if (currentMode === 'mcq') {
        document.getElementById('typeAnswerBox').style.display = 'none';
        document.getElementById('mcqAnswerBox').style.display = 'block';
        document.getElementById('showBtn').style.display = 'none';
        generateMCQOptions(card);
        startTimer();
    } else {
        document.getElementById('typeAnswerBox').style.display = 'none';
        document.getElementById('mcqAnswerBox').style.display = 'none';
        document.getElementById('showBtn').style.display = 'block';
        stopTimer();
    }
}

function generateMCQOptions(card) {
    const options = [card.answer];
    const wrongOptions = allCards.filter(c => c.answer!== card.answer).sort(() => Math.random() - 0.5).slice(0, 3).map(c => c.answer);
    options.push(...wrongOptions);
    options.sort(() => Math.random() - 0.5);
    const mcqGrid = document.getElementById('mcqGrid');
    mcqGrid.innerHTML = '';
    options.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'mcq-btn';
        btn.textContent = option;
        btn.onclick = () => checkMCQAnswer(option, card.answer);
        mcqGrid.appendChild(btn);
    });
}

function checkMCQAnswer(selected, correct) {
    stopTimer();
    answered = true;
    const buttons = document.querySelectorAll('.mcq-btn');
    buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === correct) btn.classList.add('correct');
        if (btn.textContent === selected && selected!== correct) btn.classList.add('wrong');
    });
    if (selected === correct) {
        document.getElementById('feedbackMsg').textContent = '✓ Correct!';
        document.getElementById('cardBox').classList.add('correct');
    } else {
        document.getElementById('feedbackMsg').textContent = '✗ Wrong!';
        document.getElementById('cardBox').classList.add('wrong');
    }
    document.getElementById('answerBox').style.display = 'block';
    document.getElementById('answer').textContent = correct;
    document.getElementById('qualityBtns').style.display = 'flex';
    updateQualityButtonLabels();
}

function checkAnswer() {
    stopTimer();
    answered = true;
    const userAnswer = document.getElementById('userAnswer').value.trim();
    const correctAnswer = dueCards[current].answer;
    if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
        document.getElementById('feedbackMsg').textContent = '✓ Correct!';
        document.getElementById('cardBox').classList.add('correct');
        document.getElementById('userAnswer').classList.add('correct');
    } else {
        document.getElementById('feedbackMsg').textContent = '✗ Wrong!';
        document.getElementById('cardBox').classList.add('wrong');
        document.getElementById('userAnswer').classList.add('wrong');
    }
    document.getElementById('answerBox').style.display = 'block';
    document.getElementById('answer').textContent = correctAnswer;
    document.getElementById('qualityBtns').style.display = 'flex';
    updateQualityButtonLabels();
}

function showAnswer() {
    answered = true;
    document.getElementById('answerBox').style.display = 'block';
    document.getElementById('answer').textContent = dueCards[current].answer;
    document.getElementById('qualityBtns').style.display = 'flex';
    updateQualityButtonLabels();
    document.getElementById('showBtn').style.display = 'none';
}

function updateQualityButtonLabels() {
    const card = dueCards[current];
    const temp1 = {...card}, temp2 = {...card}, temp3 = {...card}, temp4 = {...card};
    const again = ABST_SM2.calc(temp1, 1).interval;
    const hard = ABST_SM2.calc(temp2, 2).interval;
    const good = ABST_SM2.calc(temp3, 3).interval;
    const easy = ABST_SM2.calc(temp4, 4).interval;
    document.querySelector('.btn-again small').textContent = again + 'd';
    document.querySelector('.btn-hard small').textContent = hard + 'd';
    document.querySelector('.btn-good small').textContent = good + 'd';
    document.querySelector('.btn-easy small').textContent = easy + 'd';
}

function rateCard(quality) {
    let card = dueCards[current];
    card = ABST_SM2.calc(card, quality);
    if (card.pillarNum) card = ABST_SM2.pillarBoost(card, card.pillarNum);
    const cardIndex = allCards.findIndex(c => c.question === card.question);
    if (cardIndex!== -1) {
        allCards[cardIndex] = card;
        localStorage.setItem('abst_cards', JSON.stringify(allCards));
    }
    document.getElementById('qualityBtns').style.display = 'none';
    document.getElementById('feedbackMsg').textContent = `Next review in ${card.interval} day(s)`;
    setTimeout(() => {
        nextCard();
    }, 1000);
}

function nextCard() {
    current++;
    if (current >= dueCards.length) {
        current = 0;
        initCards();
    } else {
        showCard();
    }
    updateStats();
}

function updateStats() {
    const now = Date.now();
    const due = allCards.filter(c =>!c.due || c.due <= now).length;
    const mastered = allCards.filter(c => c.interval >= 30).length;
    document.getElementById('dueCount').textContent = due;
    document.getElementById('totalCount').innerHTML = `${mastered}<br>/${allCards.length}`;
}

setInterval(() => {
    localStorage.setItem('abst_cards', JSON.stringify(allCards));
}, 30000);
</script>
</body>
    </html>
