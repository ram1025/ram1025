<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABST BRAIN | P24 | INDIAN.001</title>
  <meta name="theme-color" content="#00ffaa">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    * { margin:0; padding:0; box-sizing:border-box }
    html { scroll-behavior: smooth; font-size: 16px; }
    body { background:#0a192f; color:#00ffaa; font-family:system-ui,-apple-system,sans-serif; padding:20px; text-align:center; min-height:100vh }
  .header { margin-bottom:20px; position:relative; display:flex; align-items:center; justify-content:center }
  .header h1 { font-size:34px; text-shadow:0 0 15px #00ffaa; margin-bottom:8px; letter-spacing:2px; margin-left:70px }
  .header p { color:#ffaa00; font-size:14px; font-weight:700; position:absolute; top:45px; width:100% }
  .back-btn { position:absolute; left:0; top:5px; background:#1a2332; color:#00ffaa; border:1px solid #00ffaa; padding:8px 16px; border-radius:8px; font-weight:700; cursor:pointer; font-size:14px; z-index:10 }
  .mode-toggle,.answer-mode-toggle {background:#112240; border:1px solid #ffaa00; padding:10px; border-radius:10px; margin:15px auto; max-width:550px; display:flex; justify-content:center; gap:8px; flex-wrap:wrap }
  .mode-btn {background:#1a2332; color:#8892b0; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:700; font-size:12px; flex:1; min-width:150px;}
  .mode-btn.active { background:#ffaa00; color:#0a192f }
  .card { background:linear-gradient(145deg,#1a2332,#0f1723); padding:35px; border-radius:24px; border:2px solid #00ffaa; min-height:320px; margin:20px auto; max-width:550px; box-shadow:0 0 40px #00ffaa20; position:relative; transition:border-color 0.3s }
  .card.correct { border-color:#44ff88; box-shadow:0 0 40px #44ff8820 }
  .card.wrong { border-color:#ff4444; box-shadow:0 0 40px #ff444420 }
  .pillar { color:#ffaa00; font-size:13px; font-weight:800; margin-bottom:18px; text-transform:uppercase }
  .question { font-size:24px; margin:25px 0; min-height:90px; line-height:1.4; color:#fff }
  .answer-input { width:100%; padding:14px; background:#0a192f; border:2px solid #00ffaa; border-radius:10px; color:#fff; font-size:18px; text-align:center; margin:20px 0; transition:border-color 0.3s }
  .answer-input.correct { border-color:#44ff88; background:#44ff8810 }
  .answer-input.wrong { border-color:#ff4444; background:#ff444410 }
  .mcq-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:20px 0 }
  .mcq-btn { background:#1a2332; color:#fff; border:2px solid #00ffaa40; padding:15px; border-radius:10px; cursor:pointer; font-size:15px; transition:all 0.2s }
  .mcq-btn:hover { border-color:#00ffaa; background:#00ffaa20 }
  .mcq-btn.correct { background:#44ff88; color:#0a192f; border-color:#44ff88 }
  .mcq-btn.wrong { background:#ff4444; color:#fff; border-color:#ff4444 }
  .mcq-btn:disabled { opacity:0.6; cursor:not-allowed }
  .btn { background:#00ffaa; color:#0a192f; padding:16px 32px; border:none; border-radius:14px; margin:8px; font-weight:900; font-size:16px; cursor:pointer; transition:all 0.2s }
  .btn:hover { transform:scale(1.05); box-shadow:0 0 20px #00ffaa80 }
  .btn-check { background:#ffaa00; color:#0a192f }
  .quality-btns { display:none; gap:8px; justify-content:center; margin:20px 0; flex-wrap:wrap }
  .btn-again { background:#ff4444; color:#fff; padding:12px 20px }
  .btn-hard { background:#ffaa00; color:#0a192f; padding:12px 20px }
  .btn-good { background:#00ffaa; color:#0a192f; padding:12px 20px }
  .btn-easy { background:#44ff88; color:#0a192f; padding:12px 20px }
  .stats { display:flex; justify-content:space-around; margin:35px auto; max-width:550px; font-size:15px; background:#1a2332; padding:20px; border-radius:16px; border:1px solid #00ffaa40 }
  .stats b { color:#fff; font-size:20px; display:block; margin-top:5px }
  .footer { margin-top:50px; font-size:12px; opacity:0.6 }
  .badge { position:absolute; top:-12px; right:20px; background:#ffaa00; color:#0a192f; padding:6px 12px; border-radius:20px; font-size:11px; font-weight:900 }
  .feedback-msg { font-size:18px; font-weight:700; margin:15px 0; min-height:25px }
  .timer { position:absolute; top:10px; left:20px; background:#ff4444; color:#fff; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:900; display:none }
  .timer.warning { background:#ffaa00; color:#0a192f }
  .loading { color:#ffaa00; font-size:18px; padding:40px; text-align:center }
  .age-modal { position:fixed; top:0; left:0; width:100%; height:100%; background:#0a192fdd; display:flex; align-items:center; justify-content:center; z-index:100 }
  .age-box { background:#1a2332; padding:30px; border-radius:20px; border:2px solid #00ffaa; max-width:400px; width:90% }
  .age-box h2 { color:#ffaa00; margin-bottom:20px }
  .age-box select { width:100%; padding:12px; margin:10px 0; background:#0a192f; border:2px solid #00ffaa; border-radius:10px; color:#fff; font-size:16px; appearance:none; -webkit-appearance:none; -moz-appearance:none; background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300ffaa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat:no-repeat; background-position:right 12px center; background-size:20px; position:relative; z-index:101;}
  </style>
</head>
<body>
  <div class="age-modal" id="ageModal">
    <div class="age-box">
      <h2>Select Your Level</h2>
      <select id="userClass">
        <optgroup label="School">
          <option value="lkg">LKG</option>
          <option value="ukg">UKG</option>
          <option value="class1">Class 1</option>
          <option value="class2">Class 2</option>
          <option value="class3">Class 3</option>
          <option value="class4">Class 4</option>
          <option value="class5">Class 5</option>
          <option value="class6">Class 6</option>
          <option value="class7">Class 7</option>
          <option value="class8">Class 8</option>
          <option value="class9">Class 9</option>
          <option value="class10">Class 10</option>
          <option value="class11">Class 11</option>
          <option value="class12">Class 12</option>
        </optgroup>
        <optgroup label="Competitive">
          <option value="upsc">UPSC</option>
          <option value="neet">NEET</option>
          <option value="jee">JEE</option>
          <option value="ssc">SSC</option>
          <option value="banking">Banking</option>
        </optgroup>
        <optgroup label="Other">
          <option value="gk" selected>General Knowledge</option>
          <option value="phd">PhD Level</option>
        </optgroup>
      </select>
      <button class="btn" id="saveAgeBtn">START LEARNING</button>
    </div>
  </div>
  <div class="header">
    <button class="back-btn" id="homeBtn">← CLOSE</button>
    <h1>ABST BRAIN</h1>
    <p>SOVEREIGN ID: INDIAN.001 | 108 Mantra + 1000 Sahasra</p>
  </div>
  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="pillars" data-file="36-pillars-108.json">🏛 36 PILLARS - 108</button>
    <button class="mode-btn" data-mode="school" data-file="Education-school-280.json">📚 SCHOOL - 280</button>
    <button class="mode-btn" data-mode="college" data-file="Education-college-180.json">🎓 COLLEGE - 180</button>
    <button class="mode-btn" data-mode="competitive" data-file="Education-competitive-340.json">🎯 COMPETITIVE - 340</button>
    <button class="mode-btn" data-mode="other" data-file="Education-other-200.json">🧠 GK & PHD - 200</button>
  </div>
  <div class="answer-mode-toggle">
    <button class="mode-btn active" id="typeMode">✏️ TYPE</button>
    <button class="mode-btn" id="mcqMode">⚪ MCQ</button>
    <button class="mode-btn" id="flipMode">🔁 FLIP</button>
  </div>
  <div id="cardCounter" style="text-align:center;margin:15px;color:#00ffaa;font-weight:bold;font-size:18px;">0/0</div>
  <div id="card" style="min-height:320px;padding:35px;border:2px solid #00ffaa;border-radius:24px;margin:20px auto;max-width:550px;background:linear-gradient(145deg,#1a2332,#0f1723);box-shadow:0 0 40px #00ffaa20;"></div>
  <div class="stats">
    <div>Due Now<b id="dueCount">0</b></div>
    <div>Streak<b id="streakCount">0<br>days</b></div>
    <div>Total<b id="totalCount">0<br>/0</b></div>
  </div>
  <div class="footer">ABST P24 Civilization OS | SM-2 Algorithm | 108 Mantra + 1000 Sahasra</div>
  <script>
    // ===== GITHUB RAW URLs =====
    const GITHUB_USER = 'ram1025';
    const REPO_NAME = 'ram1025';

    // ===== SM-2 ALGORITHM =====
    window.ABST_SM2 = {
      calc: function(card, quality) {
        if (quality < 3) {
          card.reps = 0;
          card.interval = 1;
        } else {
          if (card.reps === 0) card.interval = 1;
          else if (card.reps === 1) card.interval = 6;
          else card.interval = Math.round(card.interval * card.ease);
          card.reps += 1;
        }
        card.ease = card.ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
        if (card.ease < 1.3) card.ease = 1.3;
        card.due = Date.now() + card.interval * 24 * 60 * 60 * 1000;
        return card;
      }
    };

    // ===== BRAIN LOGIC =====
    let currentMode = 'pillars';
    let currentFile = '36-pillars-108.json';
    let answerMode = 'type';
    let currentCard = null;
    let dueCards = [];
    let currentIndex = 0;
    let selectedLevel = 'GENERAL'; // userClass badhulu idi
    let streak = parseInt(localStorage.getItem('abst_streak') || '0');
    let matrix = [];
    let allCards = []; // idi add chesam

    function loadCards() {
      dueCards = matrix.filter(c => {
        if (!c.due) return true;
        return c.due <= Date.now();
      });
      if (dueCards.length === 0) {
        dueCards = [...matrix];
      }
      currentIndex = 0;
      dueCards = dueCards.sort(() => 0.5 - Math.random());
    }

    function filterByLevel() {
      if (selectedLevel === 'all') {
        matrix = [...allCards];
      } else if (selectedLevel === 'GENERAL') {
        matrix = allCards.filter(c => ['GK', 'EXTRAS', 'PhD Level'].includes(c.category));
      } else {
        matrix = allCards.filter(c => c.category === selectedLevel);
      }

      if (matrix.length === 0) {
        alert(`${selectedLevel} lo questions levu. All Categories try chey.`);
        selectedLevel = 'all';
        matrix = [...allCards];
      }
      loadCards();
      updateStats();
      showCard();
    }

    function checkAnswer() {
      const input = document.getElementById('typeAnswerBox');
      const userAns = input.value.trim().toLowerCase();
      const correctAns = (currentCard.a || currentCard.answer).trim().toLowerCase();
      const cardEl = document.getElementById('card');

      if (userAns === correctAns) {
        cardEl.classList.add('correct');
        input.classList.add('correct');
        input.disabled = true;
        showQualityBtns();
      } else {
        cardEl.classList.add('wrong');
        input.classList.add('wrong');
        input.value = currentCard.a || currentCard.answer;
        input.disabled = true;
        showQualityBtns();
      }
    }

    function checkMCQ(selected) {
      const correctAns = currentCard.a || currentCard.answer;
      const buttons = document.querySelectorAll('#mcqOptions button');
      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === correctAns) {
          btn.classList.add('correct');
        } else if (btn.textContent === selected) {
          btn.classList.add('wrong');
        }
      });
      showQualityBtns();
    }

    function showQualityBtns() {
      const qualityDiv = document.createElement('div');
      qualityDiv.className = 'quality-btns';
      qualityDiv.style.display = 'flex';
      qualityDiv.innerHTML = `
        <button class="btn btn-again" onclick="gradeCard(0)">AGAIN 1d</button>
        <button class="btn btn-hard" onclick="gradeCard(1)">HARD 1d</button>
        <button class="btn btn-good" onclick="gradeCard(2)">GOOD 6d</button>
        <button class="btn btn-easy" onclick="gradeCard(3)">EASY 15d</button>
      `;
      document.querySelector('.card-content').appendChild(qualityDiv);
      document.querySelector('.btn-check')?.remove();
    }

    async function loadMatrixFromGitHub() {
  try {
    document.getElementById('card').innerHTML = `<div class="loading">Loading ${currentFile}... <br>🔄</div>`;

    const url = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/${currentFile}`;
    const response = await fetch(url);
    if (!response.ok) throw new Error(`${currentFile} not found`);
    allCards = await response.json();

    const saved = localStorage.getItem(`abst_brain_${currentFile}`);
    if(saved) {
      const parsed = JSON.parse(saved);
      parsed.forEach(savedCard => {
        const idx = allCards.findIndex(c => c.id === savedCard.id);
        if(idx >= 0) allCards[idx] = savedCard;
      });
    }
    initBrain();
  } catch(err) {
    console.error(err);
    document.getElementById('card').innerHTML = `<div style="color:#ff4444;padding:40px;">Error: ${err.message}<br><br>Check if ${currentFile} exists in GitHub repo</div>`;
  }
    }

    function initBrain() {
      matrix = matrix.map((c, i) => ({
        id: c.id || i,
        q: c.q || c.question,
        a: c.a || c.answer,
        category: c.category || 'GENERAL',
        ease: c.ease || 2.5,
        reps: c.reps || 0,
        interval: c.interval || 0,
        due: c.due || Date.now()
      }));
      loadCards();
      updateStats();
      showCard();
    }

    function showCard() {
      if (currentIndex >= dueCards.length) {
        document.getElementById('card').innerHTML = `<div style="padding: 40px; text-align: center;">
          <h3>All done! 🎉</h3>
          <p>Come back tomorrow for more cards</p>
        </div>`;
        document.getElementById('cardCounter').textContent = `${dueCards.length}/${dueCards.length}`;
        return;
      }
      currentCard = dueCards[currentIndex];
      document.getElementById('cardCounter').textContent = `${currentIndex + 1}/${dueCards.length}`;
      let content = `<div class="card-content">
        <div class="pillar">${currentCard.category || ''}</div>
        <div class="question">${currentCard.q || currentCard.question}</div>`;

      if(answerMode === 'type') {
        content += `<input type="text" id="typeAnswerBox" class="answer-input" placeholder="Type your answer here..." onkeypress="if(event.key==='Enter') checkAnswer()">
        <button class="btn btn-check" onclick="checkAnswer()">CHECK ANSWER</button>`;
      } else if(answerMode === 'mcq') {
        let correctAns = currentCard.a || currentCard.answer;
        let options = [correctAns];
        let wrongOptions = matrix.filter(c => (c.a || c.answer)!== correctAns)
        .sort(() => 0.5 - Math.random())
        .slice(0, 3)
        .map(c => (c.a || c.answer));
        options = [...options,...wrongOptions].sort(() => 0.5 - Math.random());
        content += `<div id="mcqOptions" class="mcq-grid">`;
        options.forEach(opt => {
          content += `<button class="mcq-btn" onclick="checkMCQ('${opt.replace(/'/g, "\\'")}')">${opt}</button>`;
        });
        content += `</div>`;
      } else if(answerMode === 'flip') {
        content += `<div class="answer" style="color:#0f0;margin:20px 0;padding:15px;background:#001100;border-radius:8px;">${currentCard.a || currentCard.answer}</div>
        <button class="btn" onclick="gradeCard(3)">NEXT</button>`;
      }

      content += `</div>`;
      document.getElementById('card').innerHTML = content;
    }

    function gradeCard(quality) {
      currentCard = window.ABST_SM2.calc(currentCard, quality);
      const idx = matrix.findIndex(c => c.id === currentCard.id);
      if(idx >= 0) matrix[idx] = currentCard;
      localStorage.setItem(`abst_brain_${currentFile}`, JSON.stringify(matrix));
      currentIndex++;
      updateStats();
      showCard();
    }

    function updateStats() {
      document.getElementById('dueCount').innerText = dueCards.length;
      document.getElementById('streakCount').innerHTML = streak + '<br>days';
      document.getElementById('totalCount').innerHTML = matrix.length + '<br>/' + matrix.length;
    }

    // ===== EVENT LISTENERS =====
    document.getElementById('homeBtn').onclick = () => {
      if(window.parent!== window && window.parent.closeM) {
        window.parent.closeM('abstBrainModal');
      } else {
        window.location.href = './index.html';
      }
    };

// 5 Buttons - Single Listener + Modal Show
document.querySelectorAll('.mode-toggle .mode-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    currentMode = this.dataset.mode;
    currentFile = this.dataset.file;
    document.querySelectorAll('.mode-toggle .mode-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    
    // Modal chupinchu prathi button click ki
    document.getElementById('ageModal').style.display = 'flex';
    
    loadMatrixFromGitHub();
  });
});

document.getElementById('typeMode').onclick = () => {
  answerMode = 'type';
  document.querySelectorAll('.answer-mode-toggle .mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('typeMode').classList.add('active');
  showCard();
};

document.getElementById('mcqMode').onclick = () => {
  answerMode = 'mcq';
  document.querySelectorAll('.answer-mode-toggle .mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mcqMode').classList.add('active');
  showCard();
};

document.getElementById('flipMode').onclick = () => {
  answerMode = 'flip';
  document.querySelectorAll('.answer-mode-toggle .mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('flipMode').classList.add('active');
  showCard();
};

    // ===== AUTO START =====
    window.addEventListener('load', function() {
      const savedClass = localStorage.getItem('abst_user_class');
      if(!savedClass) {
        localStorage.setItem('abst_user_class', 'gk');
        document.getElementById('userClass').value = 'gk';
        userClass = 'gk';
      } else {
        userClass = savedClass;
      }
      document.getElementById('ageModal').style.display = 'none';
      loadMatrixFromGitHub();
    });
  </script>
</body>
</html>
