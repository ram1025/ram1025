<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABST GAME | P24 | INDIAN.001</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box }
        body { background:#0a0a2f; color:#ff00aa; font-family:system-ui,sans-serif; padding:20px; text-align:center; min-height:100vh; }
        .header { margin-bottom:20px }
        .header h1 { font-size:34px; text-shadow:0 0 15px currentColor; letter-spacing:2px }
        .game-toggle { background:#112240; border:1px solid currentColor; padding:10px; border-radius:10px; margin:15px auto; max-width:600px; display:flex; justify-content:center; gap:10px }
        .mode-btn { background:#1a1a32; color:#8892b0; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:700; font-size:12px }
        .mode-btn.active { background:currentColor; color:#0a0a2f }
        .game-area { background:linear-gradient(145deg,#1a1a32,#0f0f23); padding:35px; border-radius:24px; border:2px solid currentColor; min-height:450px; margin:20px auto; max-width:600px; position:relative; overflow:hidden; }
        .score-board { display:flex; justify-content:space-around; margin:20px auto; max-width:600px; background:#1a1a32; padding:15px; border-radius:16px }
        .score-board b { color:#fff; font-size:24px; display:block; margin-top:5px }
        .level-info { background:#00000040; padding:12px; border-radius:12px; margin:15px auto; max-width:600px }
        .level-info span { color:#ffaa00; font-weight:900 }
        .btn { background:currentColor; color:#0a0a2f; padding:16px 32px; border:none; border-radius:14px; margin:8px; font-weight:900; font-size:16px; cursor:pointer }
        .target { position:absolute; cursor:pointer; box-shadow:0 0 30px currentColor; display:none; align-items:center; justify-content:center; font-weight:900; color:#fff; z-index:5; border-radius:50%; text-shadow:0 0 10px #000; }
        .timer-display { font-size:48px; font-weight:900; color:#ffaa00; text-shadow:0 0 20px #ffaa00; margin:20px 0 }
        .scramble-word { font-size:42px; font-weight:900; letter-spacing:8px; color:#fff; margin:25px 0 }
        .scramble-hint { color:#ffaa00; font-size:16px; margin:10px 0; min-height:40px }
        .wisdom-text { font-size:20px; line-height:1.6; color:#fff; margin:20px 0; padding:20px; background:#00000040; border-radius:12px }
        .answer-input { width:100%; padding:14px; background:#0a0a2f; border:2px solid currentColor; border-radius:10px; color:#fff; font-size:18px; text-align:center; margin:20px 0 }
        .feedback-msg { font-size:18px; font-weight:700; margin:15px 0; min-height:25px }
        @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.1); } }
    </style>
</head>
<body>
    <div class="header">
        <h1>ABST GAME</h1>
        <p>SOVEREIGN ID: INDIAN.001 | LEVEL MASTER</p>
    </div>
    <div class="game-toggle">
        <button class="mode-btn active" id="speedMode">⚡ SPEED</button>
        <button class="mode-btn" id="scrambleMode">🔤 SCRAMBLE</button>
        <button class="mode-btn" id="wisdomMode">🧠 WISDOM</button>
    </div>
    <div class="score-board">
        <div>Score<b id="score">0</b></div>
        <div>Hints<b id="hintCount">10</b></div>
        <div>Level<b id="level">1</b></div>
    </div>
    <div class="level-info" id="levelInfo">
        <div>Target: <span id="targetScore">50</span> | Time: <span id="targetTime">30s</span></div>
    </div>
    <div class="game-area" id="gameArea">
        <div id="speedGame">
            <div class="timer-display" id="timerDisplay">Ready?</div>
            <div class="target" id="target"></div>
            <button class="btn" id="startBtn">START GAME</button>
        </div>
        <div id="scrambleGame" style="display:none">
            <div class="scramble-word" id="scrambleWord">READY?</div>
            <div class="scramble-hint" id="scrambleHint">Unscramble the word</div>
            <input class="answer-input" id="scrambleInput" placeholder="Type answer..." style="display:none">
            <div class="feedback-msg" id="scrambleFeedback"></div>
            <button class="btn" id="scrambleStartBtn">START SCRAMBLE</button>
            <button class="btn" id="hintBtn" style="display:none">Use Hint (-1)</button>
        </div>
        <div id="wisdomGame" style="display:none">
            <div class="wisdom-text" id="wisdomText">Ready for Wisdom?</div>
            <input class="answer-input" id="wisdomInput" placeholder="Your answer..." style="display:none">
            <div class="feedback-msg" id="wisdomFeedback"></div>
            <button class="btn" id="wisdomStartBtn">START WISDOM</button>
            <button class="btn" id="wisdomHintBtn" style="display:none">Use Hint (-1)</button>
        </div>
    </div>
    <script>
    let score = 0, level = 1, hints = 10, gameActive = false, currentMode = 'speed';
    let currentTarget = null, gameTimer = null, timeLeft = 30;
    let wisdomCorrectCount = 0, wisdomAsked = [], currentWisdom = null;
    let scrambleScore = 0, scrambleAsked = [], currentScramble = null;

    const speedLevels = [
        // 1-10: SHAPES - BIG & COLORFUL for kids
        {shape:'●', name:'CIRCLE', color:'#ff0000', size:120, time:30, target:50}, // Red
        {shape:'■', name:'SQUARE', color:'#0000ff', size:120, time:28, target:55}, // Blue
        {shape:'▲', name:'TRIANGLE', color:'#ffff00', size:120, time:26, target:60}, // Yellow
        {shape:'★', name:'STAR', color:'#ff69b4', size:120, time:24, target:65}, // Pink
        {shape:'◆', name:'DIAMOND', color:'#00ff00', size:120, time:22, target:70}, // Green
        {shape:'⬡', name:'HEXAGON', color:'#ffa500', size:120, time:22, target:75}, // Orange
        {shape:'♥', name:'HEART', color:'#ff0000', size:120, time:20, target:80}, // Red
        {shape:'⬣', name:'OCTAGON', color:'#00ffff', size:120, time:20, target:85}, // Cyan
        {shape:'⬟', name:'PENTAGON', color:'#ff00ff', size:120, time:18, target:90}, // Magenta
        {shape:'∞', name:'INFINITY', color:'#ffd700', size:120, time:18, target:95}, // Gold
        // 11-36: ALPHABETS A-Z - COLORFUL
        {shape:'A', name:'ALPHABET A', color:'#ff4757', size:100, time:16, target:100},
        {shape:'B', name:'ALPHABET B', color:'#5352ed', size:100, time:16, target:105},
        {shape:'C', name:'ALPHABET C', color:'#2ed573', size:100, time:15, target:110},
        {shape:'D', name:'ALPHABET D', color:'#ffa502', size:100, time:15, target:115},
        {shape:'E', name:'ALPHABET E', color:'#ff6348', size:100, time:15, target:120},
        {shape:'F', name:'ALPHABET F', color:'#1e90ff', size:100, time:15, target:125},
        {shape:'G', name:'ALPHABET G', color:'#32ff7e', size:100, time:15, target:130},
        {shape:'H', name:'ALPHABET H', color:'#ff3838', size:100, time:14, target:135},
        {shape:'I', name:'ALPHABET I', color:'#7d5fff', size:100, time:14, target:140},
        {shape:'J', name:'ALPHABET J', color:'#18dcff', size:100, time:14, target:145},
        {shape:'K', name:'ALPHABET K', color:'#ff9f1a', size:100, time:14, target:150},
        {shape:'L', name:'ALPHABET L', color:'#3ae374', size:100, time:14, target:155},
        {shape:'M', name:'ALPHABET M', color:'#ff5e57', size:100, time:13, target:160},
        {shape:'N', name:'ALPHABET N', color:'#5758bb', size:100, time:13, target:165},
        {shape:'O', name:'ALPHABET O', color:'#17c0eb', size:100, time:13, target:170},
        {shape:'P', name:'ALPHABET P', color:'#ffda79', size:100, time:13, target:175},
        {shape:'Q', name:'ALPHABET Q', color:'#7158e2', size:100, time:13, target:180},
        {shape:'R', name:'ALPHABET R', color:'#3d3d3d', size:100, time:12, target:185},
        {shape:'S', name:'ALPHABET S', color:'#ff3838', size:100, time:12, target:190},
        {shape:'T', name:'ALPHABET T', color:'#17c0eb', size:100, time:12, target:195},
        {shape:'U', name:'ALPHABET U', color:'#3ae374', size:100, time:12, target:200},
        {shape:'V', name:'ALPHABET V', color:'#ff9f1a', size:100, time:12, target:205},
        {shape:'W', name:'ALPHABET W', color:'#7d5fff', size:100, time:11, target:210},
        {shape:'X', name:'ALPHABET X', color:'#ff6348', size:100, time:11, target:215},
        {shape:'Y', name:'ALPHABET Y', color:'#2ed573', size:100, time:11, target:220},
        {shape:'Z', name:'ALPHABET Z', color:'#5352ed', size:100, time:11, target:225},
        // 37-56: NUMBERS 1-20 - COLORFUL
        {shape:'1', name:'NUMBER 1', color:'#ff4757', size:100, time:11, target:230},
        {shape:'2', name:'NUMBER 2', color:'#5352ed', size:100, time:11, target:235},
        {shape:'3', name:'NUMBER 3', color:'#2ed573', size:100, time:10, target:240},
        {shape:'4', name:'NUMBER 4', color:'#ffa502', size:100, time:10, target:245},
        {shape:'5', name:'NUMBER 5', color:'#ff6348', size:100, time:10, target:250},
        {shape:'6', name:'NUMBER 6', color:'#1e90ff', size:100, time:10, target:255},
        {shape:'7', name:'NUMBER 7', color:'#32ff7e', size:100, time:10, target:260},
        {shape:'8', name:'NUMBER 8', color:'#ff3838', size:100, time:9, target:265},
        {shape:'9', name:'NUMBER 9', color:'#7d5fff', size:100, time:9, target:270},
        {shape:'10', name:'NUMBER 10', color:'#18dcff', size:100, time:9, target:275},
        {shape:'11', name:'NUMBER 11', color:'#ff9f1a', size:100, time:9, target:280},
        {shape:'12', name:'NUMBER 12', color:'#3ae374', size:100, time:9, target:285},
        {shape:'13', name:'NUMBER 13', color:'#ff5e57', size:100, time:8, target:290},
        {shape:'14', name:'NUMBER 14', color:'#5758bb', size:100, time:8, target:295},
        {shape:'15', name:'NUMBER 15', color:'#17c0eb', size:100, time:8, target:300},
        {shape:'16', name:'NUMBER 16', color:'#ffda79', size:100, time:8, target:305},
        {shape:'17', name:'NUMBER 17', color:'#7158e2', size:100, time:8, target:310},
        {shape:'18', name:'NUMBER 18', color:'#3d3d3d', size:100, time:7, target:315},
        {shape:'19', name:'NUMBER 19', color:'#ff3838', size:100, time:7, target:320},
        {shape:'20', name:'NUMBER 20', color:'#17c0eb', size:100, time:7, target:325},
        // 57-60: BONUS MIXED
        {shape:'⚡', name:'LIGHTNING', color:'#ffff00', size:120, time:7, target:330},
        {shape:'☀', name:'SUN', color:'#ffa500', size:120, time:6, target:335},
        {shape:'☾', name:'MOON', color:'#c0c0c0', size:120, time:6, target:340},
        {shape:'⚜', name:'ROYAL', color:'#ffd700', size:120, time:5, target:350}
    ];

    const scrambleWords = [
        {word:'CAT', hint:'A pet that says meow'},
        {word:'DOG', hint:'A loyal pet'},
        {word:'SUN', hint:'Bright in the sky'},
        {word:'CAR', hint:'You drive it'},
        {word:'BALL', hint:'Round toy'},
        {word:'BOOK', hint:'You read it'},
        {word:'TREE', hint:'Has leaves'},
        {word:'FISH', hint:'Lives in water'},
        {word:'STAR', hint:'Twinkles at night'},
        {word:'CAKE', hint:'Birthday dessert'}
    ];
          const scrambleConfig = { 1: {time:60, target:50}, 2: {time:55, target:100}, 3: {time:50, target:150}, 4: {time:45, target:200}, 5: {time:40, target:250}, 6: {time:35, target:300}, 7: {time:30, target:350}, 8: {time:25, target:400}, 9: {time:20, target:450}, 10: {time:15, target:500} };

    const wisdomQuestions = [
        {q:"What has keys but can't open locks?", a:"piano", hint:"You can play music"},
        {q:"What starts with E, ends with E, but only contains one letter?", a:"envelope", hint:"Send letters"},
        {q:"What gets wetter the more it dries?", a:"towel", hint:"Use after bath"},
        {q:"What has hands but can't clap?", a:"clock", hint:"Tells time"},
        {q:"What can you catch but not throw?", a:"cold", hint:"You get sick"}
    ];

    // COMMON FUNCTIONS
    function resetGame() {
        clearInterval(gameTimer);
        score = 0;
        level = 1;
        timeLeft = 30;
        gameActive = false;
        currentTarget = null;
        document.getElementById('target').style.display = 'none';
        document.getElementById('levelInfo').style.display = 'none';
        document.getElementById('scrambleInput').style.display = 'none';
        document.getElementById('wisdomInput').style.display = 'none';
        document.getElementById('startBtn').style.display = 'inline-block';
        document.getElementById('timerDisplay').textContent = 'Ready?';
    }

    function updateUI() {
        document.getElementById('score').textContent = score;
        document.getElementById('hintCount').textContent = hints;
        document.getElementById('level').textContent = level;
    }

    function endGame(msg) {
        clearInterval(gameTimer);
        alert(msg);
        resetGame();
        document.getElementById('speedGame').style.display = 'block';
        document.getElementById('scrambleGame').style.display = 'none';
        document.getElementById('wisdomGame').style.display = 'none';
        updateUI();
    }

    // SPEED GAME FUNCTIONS
    function startSpeedGame() {
        document.getElementById('speedGame').style.display = 'block';
        document.getElementById('scrambleGame').style.display = 'none';
        document.getElementById('wisdomGame').style.display = 'none';
        currentMode = 'speed';
        resetGame();
        level = 1;
        score = 0;
        updateUI();
        startLevel();
    }

    function startLevel() {
        if (level > speedLevels.length) {
            endGame("🎉 CONGRATULATIONS! YOU COMPLETED ALL LEVELS! 🎉");
            return;
        }
        const cfg = speedLevels[level-1];
        timeLeft = cfg.time;
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('target').style.display = 'flex';
        document.getElementById('timerDisplay').textContent = timeLeft;
        document.getElementById('targetScore').textContent = cfg.target;
        document.getElementById('targetTime').textContent = cfg.time + 's';
        document.getElementById('levelInfo').style.display = 'block';
        createTarget(cfg);
        gameActive = true;
        gameTimer = setInterval(() => {
            timeLeft--;
            document.getElementById('timerDisplay').textContent = timeLeft;
            if (timeLeft <= 0) {
                gameActive = false;
                clearInterval(gameTimer);
                if (score >= cfg.target) nextLevel();
                else endGame("💔 Time's up! Target: " + cfg.target);
            }
        }, 1000);
    }

    function createTarget(cfg) {
        const target = document.getElementById('target');
        target.textContent = cfg.shape;
        target.style.backgroundColor = cfg.color;
        target.style.color = '#fff';
        target.style.fontSize = cfg.size + 'px';
        target.style.width = (cfg.size * 1.2) + 'px';
        target.style.height = (cfg.size * 1.2) + 'px';
        target.style.borderRadius = '50%';
        moveTarget();
        target.onclick = () => {
            if (gameActive) {
                score++;
                document.getElementById('score').textContent = score;
                moveTarget();
            }
        };
    }

    function moveTarget() {
        const target = document.getElementById('target');
        const cfg = speedLevels[level-1];
        const area = document.getElementById('gameArea');
        const maxX = area.clientWidth - cfg.size * 1.2;
        const maxY = area.clientHeight - cfg.size * 1.2;
        const x = Math.random() * maxX;
        const y = Math.random() * maxY;
        target.style.left = x + 'px';
        target.style.top = y + 'px';
        if (score >= cfg.target) {
            clearInterval(gameTimer);
            nextLevel();
        }
    }

    function nextLevel() {
        level++;
        score = 0;
        updateUI();
        startLevel();
    }

    // SCRAMBLE GAME FUNCTIONS
    function startScrambleGame() {
        document.getElementById('speedGame').style.display = 'none';
        document.getElementById('scrambleGame').style.display = 'block';
        document.getElementById('wisdomGame').style.display = 'none';
        currentMode = 'scramble';
        resetGame();
        level = 1;
        scrambleScore = 0;
        scrambleAsked = [];
        updateUI();
        document.getElementById('scrambleWord').textContent = 'READY?';
        document.getElementById('scrambleStartBtn').style.display = 'inline-block';
        document.getElementById('scrambleInput').style.display = 'none';
        document.getElementById('hintBtn').style.display = 'none';
    }

    function startScrambleLevel() {
        if (level > 10) {
            endGame("🎉 SCRAMBLE MASTER! 🎉 Score: " + scrambleScore);
            return;
        }
        const cfg = scrambleConfig[level];
        timeLeft = cfg.time;
        document.getElementById('scrambleStartBtn').style.display = 'none';
        document.getElementById('scrambleInput').style.display = 'block';
        document.getElementById('hintBtn').style.display = 'inline-block';
        document.getElementById('timerDisplay').textContent = timeLeft;
        document.getElementById('targetScore').textContent = cfg.target;
        document.getElementById('targetTime').textContent = cfg.time + 's';
        document.getElementById('levelInfo').style.display = 'block';
        nextScrambleWord();
        gameActive = true;
        gameTimer = setInterval(() => {
            timeLeft--;
            document.getElementById('timerDisplay').textContent = timeLeft;
            if (timeLeft <= 0) {
                gameActive = false;
                clearInterval(gameTimer);
                if (scrambleScore >= cfg.target) nextScrambleLevel();
                else endGame("💔 Time's up! Target: " + cfg.target);
            }
        }, 1000);
      }
          function nextScrambleWord() {
        if (scrambleAsked.length >= scrambleWords.length) {
            endGame("🎉 SCRAMBLE COMPLETE! 🎉 Score: " + scrambleScore);
            return;
        }
        let wordObj = scrambleWords[Math.floor(Math.random() * scrambleWords.length)];
        while (scrambleAsked.includes(wordObj.word)) {
            wordObj = scrambleWords[Math.floor(Math.random() * scrambleWords.length)];
        }
        scrambleAsked.push(wordObj.word);
        currentScramble = wordObj;
        const scrambled = scramble(wordObj.word);
        document.getElementById('scrambleWord').textContent = scrambled;
        document.getElementById('scrambleHint').textContent = wordObj.hint;
        document.getElementById('scrambleInput').value = '';
        document.getElementById('scrambleFeedback').textContent = '';
        document.getElementById('scrambleInput').focus();
    }

    function scramble(word) {
        let array = word.split('');
        for (let i = array.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        if (array.join('') === word) return scramble(word); // avoid same word
        return array.join('');
    }

    function checkScramble() {
        const answer = document.getElementById('scrambleInput').value.toLowerCase();
        if (answer === currentScramble.word.toLowerCase()) {
            scrambleScore++;
            document.getElementById('score').textContent = scrambleScore;
            document.getElementById('scrambleFeedback').textContent = '✅ Correct!';
            setTimeout(nextScrambleWord, 800);
        } else {
            document.getElementById('scrambleFeedback').textContent = '❌ Try again!';
        }
    }

    function useScrambleHint() {
        if (hints > 0) {
            hints--;
            alert('Hint: ' + currentScramble.hint);
            updateUI();
        } else {
            alert('No hints left!');
        }
    }

    function nextScrambleLevel() {
        level++;
        updateUI();
        startScrambleLevel();
    }

    // WISDOM GAME FUNCTIONS
    function startWisdomGame() {
        document.getElementById('speedGame').style.display = 'none';
        document.getElementById('scrambleGame').style.display = 'none';
        document.getElementById('wisdomGame').style.display = 'block';
        currentMode = 'wisdom';
        resetGame();
        wisdomCorrectCount = 0;
        wisdomAsked = [];
        updateUI();
        document.getElementById('wisdomText').textContent = 'Ready for Wisdom?';
        document.getElementById('wisdomStartBtn').style.display = 'inline-block';
        document.getElementById('wisdomInput').style.display = 'none';
        document.getElementById('wisdomHintBtn').style.display = 'none';
    }

    function nextWisdomQuestion() {
        if (wisdomAsked.length >= wisdomQuestions.length) {
            endGame("🎉 WISDOM MASTER! 🎉 Score: " + score);
            return;
        }
        document.getElementById('wisdomStartBtn').style.display = 'none';
        document.getElementById('wisdomInput').style.display = 'block';
        document.getElementById('wisdomHintBtn').style.display = 'inline-block';

        let qObj = wisdomQuestions[Math.floor(Math.random() * wisdomQuestions.length)];
        while (wisdomAsked.includes(qObj.q)) {
            qObj = wisdomQuestions[Math.floor(Math.random() * wisdomQuestions.length)];
        }
        wisdomAsked.push(qObj.q);
        currentWisdom = qObj;
        document.getElementById('wisdomText').textContent = qObj.q;
        document.getElementById('wisdomInput').value = '';
        document.getElementById('wisdomFeedback').textContent = '';
        document.getElementById('wisdomInput').focus();
    }

    function checkWisdom() {
        const answer = document.getElementById('wisdomInput').value.toLowerCase().trim();
        if (answer === currentWisdom.a) {
            score += 10;
            wisdomCorrectCount++;
            document.getElementById('wisdomFeedback').textContent = '✅ Correct!';
            updateUI();
            if (wisdomCorrectCount % 5 === 0) {
                hints += 2;
                alert('🎉 +2 Hints! 🎉');
                updateUI();
            }
            setTimeout(nextWisdomQuestion, 800);
        } else {
            document.getElementById('wisdomFeedback').textContent = '❌ Try again!';
        }
    }

    function useWisdomHint() {
        if (hints > 0) {
            hints--;
            alert('Hint: ' + currentWisdom.hint);
            updateUI();
        } else {
            alert('No hints left!');
        }
    }

    // MODE SWITCH FUNCTIONS
    function switchMode(mode) {
        clearInterval(gameTimer);
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(mode + 'Mode').classList.add('active');

        if (mode === 'speed') startSpeedGame();
        else if (mode === 'scramble') startScrambleGame();
        else if (mode === 'wisdom') startWisdomGame();
    }

    // EVENT LISTENERS
    document.getElementById('startBtn').onclick = startLevel;
    document.getElementById('speedMode').onclick = () => switchMode('speed');
    document.getElementById('scrambleMode').onclick = () => switchMode('scramble');
    document.getElementById('wisdomMode').onclick = () => switchMode('wisdom');
    document.getElementById('scrambleStartBtn').onclick = startScrambleLevel;
    document.getElementById('hintBtn').onclick = useScrambleHint;
    document.getElementById('wisdomStartBtn').onclick = nextWisdomQuestion;
    document.getElementById('wisdomHintBtn').onclick = useWisdomHint;

    document.getElementById('scrambleInput').onkeypress = (e) => {
        if (e.key === 'Enter') checkScramble();
    };
    document.getElementById('wisdomInput').onkeypress = (e) => {
        if (e.key === 'Enter') checkWisdom();
    };

    // INIT
    window.onload = function() {
        updateUI();
        document.getElementById('speedMode').classList.add('active');
        document.getElementById('speedGame').style.display = 'block';
        document.getElementById('scrambleGame').style.display = 'none';
        document.getElementById('wisdomGame').style.display = 'none';
    };
</script>
</body>
</html>
