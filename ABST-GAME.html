<!DOCTYPE html>

  <style>

    .mode-btn { background:#1a1a32; color:#8892b0; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:700; font-size:12px }

    .game-area { background:linear-gradient(145deg,#1a1a32,#0f0f23); padding:35px; border-radius:24px; border:2px solid currentColor; min-height:450px; margin:20px auto; max-width:600px; box-shadow:0 0 40px currentColor20; position:relative; overflow:hidden; }
    .score-board { display:flex; justify-content:space-around; margin:20px auto; max-width:600px; background:#1a1a32; padding:15px; border-radius:16px; border:1px solid currentColor40 }
    .score-board b { color:#fff; font-size:24px; display:block; margin-top:5px }
    .target { position:absolute; cursor:pointer; box-shadow:0 0 30px currentColor; display:none; transition: all 0.3s; display:flex; align-items:center; justify-content:center; font-weight:900; color:#0a0a2f; z-index:5; }
    @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.1); } }
  </style>
</head>
