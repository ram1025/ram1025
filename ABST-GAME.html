<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABST GAME | P24 | INDIAN.001</title>
  <meta name="theme-color" content="#ff00aa">
  <style>
    * { margin:0; padding:0; box-sizing:border-box }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background:#0a0a2f;
      color:#ff00aa;
      font-family:system-ui,-apple-system,sans-serif;
      padding:20px;
      text-align:center;
      min-height:100vh;
      transition: all 0.5s;
    }
    body.level-1 { background:#0a0a2f; color:#ff00aa }
    body.level-2 { background:#0a1a2f; color:#00aaff }
    body.level-3 { background:#1a0a2f; color:#aa00ff }
    body.level-4 { background:#0a2f1a; color:#00ffaa }
    body.level-5 { background:#2f0a0a; color:#ffaa00 }
    body.level-6 { background:#2f2f0a; color:#ffff00 }
    body.level-7 { background:#0a2f2f; color:#00ffff }
    body.level-8 { background:#2f0a2f; color:#ff00ff }
    body.level-9 { background:#1f1f1f; color:#ffffff }
    body.level-10 { background:linear-gradient(45deg,#ff00aa,#00aaff); color:#fff }
   .header { margin-bottom:20px; position:relative; display:flex; align-items:center; justify-content:center }
   .header h1 { font-size:34px; text-shadow:0 0 15px currentColor; margin-bottom:8px; letter-spacing:2px; margin-left:70px }
   .header p { color:#ffaa00; font-size:14px; font-weight:700; position:absolute; top:45px; width:100% }
   .back-btn { position:absolute; left:0; top:5px; background:#1a1a32; color:currentColor; border:1px solid currentColor; padding:8px 16px; border-radius:8px; font-weight:700; cursor:pointer; font-size:14px; z-index:10 }
   .game-toggle { background:#112240; border:1px solid currentColor; padding:10px; border-radius:10px; margin:15px auto; max-width:600px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap }
   .mode-btn { background:#1a1a32; color:#8892b0; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:700; font-size:12px }
   .mode-btn.active { background:currentColor; color:#0a0a2f }
   .game-area { background:linear-gradient(145deg,#1a1a32,#0f0f23); padding:35px; border-radius:24px; border:2px solid currentColor; min-height:450px; margin:20px auto; max-width:600px; box-shadow:0 0 40px currentColor20; position:relative; }
   .score-board { display:flex; justify-content:space-around; margin:20px auto; max-width:600px; background:#1a1a32; padding:15px; border-radius:16px; border:1px solid currentColor40 }
   .score-board b { color:#fff; font-size:24px; display:block; margin-top:5px }
   .level-info { background:#00000040; padding:12px; border-radius:12px; margin:15px auto; max-width:600px; border:1px solid currentColor40 }
   .level-info span { color:#ffaa00; font-weight:900 }
   .btn { background:currentColor; color:#0a0a2f; padding:16px 32px; border:none; border-radius:14px; margin:8px; font-weight:900; font-size:16px; cursor:pointer; transition:all 0.2s }
   .btn:hover { transform:scale(1.05); box-shadow:0 0 20px currentColor80 }
   .btn:disabled { opacity:0.4; cursor:not-allowed; transform:scale(1) }
   .btn-start { background:#00ffaa; color:#0a0a2f }
   .target { width:80px; height:80px; background:currentColor; position:absolute; cursor:pointer; box-shadow:0 0 30px currentColor; display:none; transition: all 0.3s; display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:900; color:#0a0a2f; }
    @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.1); } }
    @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }
    @keyframes glow { 0%,100%{box-shadow:0 0 30px currentColor} 50%{box-shadow:0 0 60px currentColor} }
   .timer-display { font-size:48px; font-weight:900; color:#ffaa00; text-shadow:0 0 20px #ffaa00; margin:20px 0 }
   .scramble-word { font-size:42px; font-weight:900; letter-spacing:8px; color:#fff; margin:25px 0; text-shadow:0 0 15px currentColor }
   .scramble-hint { color:#ffaa00; font-size:16px; margin:10px 0; min-height:40px }
   .wisdom-text { font-size:20px; line-height:1.6; color:#fff; margin:20px 0; padding:20px; background:#00000040; border-radius:12px; border-left:4px solid currentColor }
   .answer-input { width:100%; padding:14px; background:#0a0a2f; border:2px solid currentColor; border-radius:10px; color:#fff; font-size:18px; text-align:center; margin:20px 0 }
   .feedback-msg { font-size:18px; font-weight:700; margin:15px 0; min-height:25px }
   .footer { margin-top:50px; font-size:12px; opacity:0.6 }
   .badge { position:absolute; top:-12px; right:20px; background:#ffaa00; color:#0a0a2f; padding:6px 12px; border-radius:20px; font-size:11px; font-weight:900 }
   .level-name { font-size:18px; color:#ffaa00; margin:10px 0; font-weight:900; text-transform:uppercase }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="window.location.href='./index.html'">← CLOSE</button>
    <h1>ABST GAME</h1>
    <p>SOVEREIGN ID: INDIAN.001 | LEVEL MASTER</p>
  </div>

  <div class="game-toggle">
    <button class="mode-btn active" id="speedMode">⚡ SPEED</button>
    <button class="mode-btn" id="scrambleMode">🔤 SCRAMBLE</button>
    <button class="mode-btn" id="wisdomMode">🧠 WISDOM</button>
  </div>

  <div class="score-board">
    <div>Score<b id="score">0</b></div>
    <div>Hints<b id="hintCount">10</b></div>
    <div>High Score<b id="highScore">0</b></div>
    <div>Level<b id="level">1</b></div>
  </div>

  <div class="level-info" id="levelInfo">
    <div class="level-name" id="levelName">CIRCLE MASTER</div>
    <div>Target: <span id="targetScore">50</span> | Time: <span id="targetTime">30s</span></div>
    <div style="font-size:12px; margin-top:5px">Beat target = Next Level +1 Hint 🎁</div>
  </div>

  <div class="game-area" id="gameArea">
    <div id="speedGame">
      <div class="timer-display" id="timerDisplay">Ready?</div>
      <button class="btn btn-start" id="startBtn">START GAME</button>
      <div class="target" id="target"></div>
    </div>

    <div id="scrambleGame" style="display:none">
      <div class="badge" id="scrambleLevelBadge">LKG</div>
      <div class="scramble-word" id="scrambleWord">READY?</div>
      <div class="scramble-hint" id="scrambleHint">Unscramble the word</div>
      <input type="text" class="answer-input" id="scrambleInput" placeholder="Type answer..." autocomplete="off">
      <button class="btn" id="hintBtn" style="background:#ffaa00; color:#0a0a2f; margin-top:0">💡 HINT (<span id="hintsLeft">10</span>)</button>
      <button class="btn btn-start" id="scrambleBtn">START</button>
      <div class="feedback-msg" id="scrambleFeedback"></div>
    </div>

    <div id="wisdomGame" style="display:none">
      <div class="wisdom-text" id="wisdomText">Press START to forge wisdom</div>
      <input type="text" class="answer-input" id="wisdomInput" placeholder="What is the key lesson?" autocomplete="off" style="display:none">
      <button class="btn" id="wisdomHintBtn" style="display:none; background:#ffaa00; color:#0a0a2f; margin-top:0">💡 HINT (<span id="wisdomHintsLeft">10</span>)</button>
      <button class="btn btn-start" id="wisdomBtn">START</button>
      <div class="feedback-msg" id="wisdomFeedback"></div>
    </div>
  </div>

  <div class="footer">ABST P24 Civilization OS | Mind + Character Training</div>

<script>
    let score = 0;
    let highScore = parseInt(localStorage.getItem('abst_game_high') || '0');
    let level = 1;
    let timeLeft = 30;
    let gameTimer = null;
    let targetTimer = null;
    let gameActive = false;
    let currentGameMode = 'speed';
    let hints = 10;
    let correctStreak = 0;
    let wisdomCorrectStreak = 0;

    const levelConfig = {
      speed: {
        1: {target: 50, time: 30, targetSize: 80, speed: 1000, shape: 'circle', name: 'CIRCLE MASTER', text: 'O', animation: 'pulse'},
        2: {target: 100, time: 30, targetSize: 70, speed: 900, shape: 'square', name: 'SQUARE MASTER', text: '□', animation: 'pulse'},
        3: {target: 150, time: 25, targetSize: 60, speed: 800, shape: 'triangle', name: 'TRIANGLE MASTER', text: '△', animation: 'spin'},
        4: {target: 200, time: 25, targetSize: 55, speed: 700, shape: 'star', name: 'STAR MASTER', text: '★', animation: 'spin'},
        5: {target: 250, time: 20, targetSize: 50, speed: 600, shape: 'diamond', name: 'DIAMOND MASTER', text: '♦', animation: 'bounce'},
        6: {target: 300, time: 20, targetSize: 45, speed: 550, shape: 'hexagon', name: 'HEXAGON MASTER', text: 'A', animation: 'bounce'},
        7: {target: 350, time: 18, targetSize: 40, speed: 500, shape: 'heart', name: 'HEART MASTER', text: '1', animation: 'shake'},
        8: {target: 400, time: 18, targetSize: 38, speed: 450, shape: 'pentagon', name: 'PENTAGON MASTER', text: 'B', animation: 'shake'},
        9: {target: 450, time: 15, targetSize: 35, speed: 400, shape: 'octagon', name: 'OCTAGON MASTER', text: '2', animation: 'glow'},
        10: {target: 500, time: 15, targetSize: 30, speed: 350, shape: 'circle', name: 'INFINITY MASTER', text: '∞', animation: 'glow'}
      },
      scramble: {
        1: {target: 100, time: 60, difficulty: 'lkg', label: 'LKG'},
        2: {target: 200, time: 60, difficulty: 'class2', label: 'CLASS 2'},
        3: {target: 300, time: 60, difficulty: 'class5', label: 'CLASS 5'},
        4: {target: 400, time: 60, difficulty: 'class8', label: 'CLASS 8'},
        5: {target: 500, time: 50, difficulty: 'class10', label: 'CLASS 10'}
      }
    };

    const scrambleData = {
      lkg: [{word:"CAT", hint:"Meow animal", lesson:"Cats teach independence"}, {word:"SUN", hint:"Gives us light", lesson:"Be like sun - give without expecting"}],
      class2: [{word:"HELP", hint:"Support others", lesson:"Helping others helps yourself"}, {word:"SHARE", hint:"Give to others", lesson:"Sharing multiplies happiness"}],
      class5: [{word:"HONEST", hint:"Always tell truth", lesson:"Honesty is first chapter of wisdom"}, {word:"FOCUS", hint:"Key to success", lesson:"Where focus goes, energy flows"}],
      class8: [{word:"COURAGE", hint:"Face your fears", lesson:"Courage is not absence of fear"}, {word:"DREAM", hint:"Vision of future", lesson:"Dreams don't work unless you do"}],
      class10: [{word:"DISCIPLINE", hint:"Bridge between goals & success", lesson:"Discipline is choosing what you want most"}, {word:"PERSISTENCE", hint:"Never give up", lesson:"Persistence beats resistance"}]
    };

    const wisdomData = [
      {q:"A person who never made a mistake never tried anything new. Who said this?", a:"Einstein", lesson:"Failure is proof you are trying. Embrace it.", hint:"Theory of Relativity"},
      {q:"What habit makes you 1% better daily?", a:"Reading", lesson:"Small daily improvements = 37x better in 1 year", hint:"Books"},
      {q:"Rich vs Wealthy: Rich has money. Wealthy has ___?", a:"Time", lesson:"Build assets that buy you freedom", hint:"Money tho konalem"},
      {q:"If you help 1000 people get what they want, you get ___?", a:"Everything", lesson:"Zig Ziglar Law: Service creates abundance", hint:"Zig Ziglar quote"},
      {q:"Compound interest is the 8th wonder. What compounds fastest?", a:"Knowledge", lesson:"Invest in learning. It pays best interest", hint:"School/College"},
      {q:"Why do most people fail?", a:"Quit", lesson:"Success is not final, failure is not fatal", hint:"Success ki opposite"}
    ];

    let currentScramble = null;
    let currentWisdom = null;
    let scrambleList = [];
    document.getElementById('highScore').innerText = highScore;

    // MODE SWITCHING
    function switchMode(mode) {
      currentGameMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(mode + 'Mode').classList.add('active');
      document.getElementById('speedGame').style.display = mode === 'speed'? 'block' : 'none';
      document.getElementById('scrambleGame').style.display = mode === 'scramble'? 'block' : 'none';
      document.getElementById('wisdomGame').style.display = mode === 'wisdom'? 'block' : 'none';
      resetGame();
      updateLevelInfo();
    }
    document.getElementById('speedMode').onclick = () => switchMode('speed');
    document.getElementById('scrambleMode').onclick = () => switchMode('scramble');
    document.getElementById('wisdomMode').onclick = () => switchMode('wisdom');

    function resetGame() {
      gameActive = false;
      clearInterval(gameTimer);
      clearTimeout(targetTimer);
      score = 0;
      level = 1;
      updateUI();
    }

    function updateUI() {
      document.getElementById('score').innerText = score;
      document.getElementById('level').innerText = level;
      document.getElementById('highScore').innerText = highScore;
      document.getElementById('hintCount').innerText = hints;
      document.getElementById('hintsLeft').innerText = hints;
      document.getElementById('wisdomHintsLeft').innerText = hints;
      document.body.className = 'level-' + Math.min(level, 10);
    }

    function updateLevelInfo() {
      if(currentGameMode === 'speed') {
        const config = levelConfig.speed[level];
        if(config) {
          document.getElementById('levelName').innerText = config.name;
          document.getElementById('targetScore').innerText = config.target;
          document.getElementById('targetTime').innerText = config.time + 's';
        }
      } else if(currentGameMode === 'scramble') {
        const config = levelConfig.scramble[level];
        if(config) {
          document.getElementById('scrambleLevelBadge').innerText = config.label;
          document.getElementById('targetScore').innerText = config.target;
          document.getElementById('targetTime').innerText = config.time + 's';
        }
      }
    }

    // SPEED GAME - SHAPES CHANGING
    function getShapeStyle(shape, size) {
      const styles = {
        circle: `border-radius:50%; width:${size}px; height:${size}px;`,
        square: `border-radius:8px; width:${size}px; height:${size}px;`,
        triangle: `width:0; height:0; border-left:${size/2}px solid transparent; border-right:${size/2}px solid transparent; border-bottom:${size}px solid currentColor; background:transparent;`,
        star: `clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); width:${size}px; height:${size}px;`,
        diamond: `clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); width:${size}px; height:${size}px;`,
        hexagon: `clip-path:polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); width:${size}px; height:${size}px;`,
        heart: `clip-path:path('M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'); width:${size}px; height:${size}px;`,
        pentagon: `clip-path:polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); width:${size}px; height:${size}px;`,
        octagon: `clip-path:polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%); width:${size}px; height:${size}px;`
      };
      return styles[shape] || styles.circle;
    }

    function startSpeedGame() {
      score = 0;
      level = 1;
      const config = levelConfig.speed[level];
      timeLeft = config.time;
      gameActive = true;
      updateUI();
      updateLevelInfo();
      document.getElementById('startBtn').style.display = 'none';
      updateTimer();
      spawnTarget();
      gameTimer = setInterval(() => {
        timeLeft--;
        updateTimer();
        if(timeLeft <= 0) endSpeedGame();
      }, 1000);
    }

    function updateTimer() {
      document.getElementById('timerDisplay').innerText = timeLeft + 's';
    }

    function spawnTarget() {
      if(!gameActive) return;
      const config = levelConfig.speed[level];
      const target = document.getElementById('target');
      const gameArea = document.getElementById('gameArea');
      target.style.cssText = getShapeStyle(config.shape, config.targetSize);
      target.style.animation = config.animation + ' 1s infinite';
      target.innerText = config.text || '';
      target.style.fontSize = (config.targetSize * 0.5) + 'px';
      const maxX = gameArea.offsetWidth - config.targetSize;
      const maxY = gameArea.offsetHeight - config.targetSize;
      target.style.left = Math.random() * maxX + 'px';
      target.style.top = Math.random() * maxY + 'px';
      target.style.display = 'flex';
      clearTimeout(targetTimer);
      targetTimer = setTimeout(() => {
        if(gameActive) {
          target.style.display = 'none';
          setTimeout(spawnTarget, 200);
        }
      }, config.speed);
    }

    document.getElementById('target').onclick = () => {
      if(!gameActive) return;
      score += level;
      updateUI();
      const config = levelConfig.speed[level];
      if(score >= config.target) {
        level++;
        hints++; // +1 free hint
        if(levelConfig.speed[level]) {
          const newConfig = levelConfig.speed[level];
          timeLeft = newConfig.time;
          updateLevelInfo();
          updateUI();
          document.getElementById('timerDisplay').innerText = 'LEVEL UP! +1 HINT 🎁';
          setTimeout(() => spawnTarget(), 1500);
        } else {
          endSpeedGame(true);
        }
      } else {
        document.getElementById('target').style.display = 'none';
        spawnTarget();
      }
    };

    document.getElementById('startBtn').onclick = startSpeedGame;

    function endSpeedGame(won = false) {
      gameActive = false;
      clearInterval(gameTimer);
      clearTimeout(targetTimer);
      document.getElementById('target').style.display = 'none';
      document.getElementById('timerDisplay').innerText = won? 'ALL LEVELS CLEARED! 🎉' : 'Game Over!';
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('startBtn').innerText = 'PLAY AGAIN';
      if(score > highScore) {
        highScore = score;
        localStorage.setItem('abst_game_high', highScore);
        updateUI();
        alert('🎉 New High Score: ' + score);
      }
    }

    // SCRAMBLE GAME - TARGET + TIME + HINT
    function startScrambleGame() {
      score = 0;
      level = 1;
      correctStreak = 0;
      const config = levelConfig.scramble[level];
      timeLeft = config.time;
      gameActive = true;
      updateUI();
      updateLevelInfo();
      document.getElementById('scrambleBtn').style.display = 'none';
      buildScrambleList();
      nextScramble();
      startScrambleTimer();
    }

    function buildScrambleList() {
      const config = levelConfig.scramble[level];
      scrambleList = [...scrambleData[config.difficulty]];
    }

    function startScrambleTimer() {
      clearInterval(gameTimer);
      gameTimer = setInterval(() => {
        timeLeft--;
        if(timeLeft <= 0) endScrambleGame();
      }, 1000);
    }

    function nextScramble() {
      if(scrambleList.length === 0) buildScrambleList();
      const idx = Math.floor(Math.random() * scrambleList.length);
      currentScramble = scrambleList.splice(idx, 1)[0];
      const scrambled = currentScramble.word.split('').sort(() => Math.random() - 0.5).join('');
      document.getElementById('scrambleWord').innerText = scrambled;
      document.getElementById('scrambleHint').innerText = 'Hint: ' + currentScramble.hint;
      document.getElementById('scrambleInput').value = '';
      document.getElementById('scrambleInput').focus();
      document.getElementById('scrambleFeedback').innerText = '';
      document.getElementById('hintBtn').disabled = hints <= 0;
    }

    document.getElementById('hintBtn').onclick = () => {
      if(hints <= 0) return;
      hints--;
      updateUI();
      document.getElementById('scrambleFeedback').innerHTML = '<span style="color:#ffaa00">Answer: ' + currentScramble.word + '<br>Lesson: ' + currentScramble.lesson + '</span>';
      document.getElementById('hintBtn').disabled = true;
    };

    document.getElementById('scrambleBtn').onclick = startScrambleGame;
    document.getElementById('scrambleInput').addEventListener('keypress', e => {
      if(e.key === 'Enter') checkScramble();
    });

    function checkScramble() {
      if(!gameActive) return;
      const ans = document.getElementById('scrambleInput').value.trim().toUpperCase();
      if(ans === currentScramble.word) {
        score += level * 5;
        correctStreak++;
        if(correctStreak % 5 === 0) {
          hints += 2;
          document.getElementById('scrambleFeedback').innerHTML = '✅ Correct! +2 HINTS BONUS 🎁<br><span style="color:#ffaa00">' + currentScramble.lesson + '</span>';
        } else {
          document.getElementById('scrambleFeedback').innerHTML = '✅ Correct!<br><span style="color:#ffaa00">' + currentScramble.lesson + '</span>';
        }
        updateUI();
        const config = levelConfig.scramble[level];
        if(score >= config.target) {
          level++;
          hints++; // +1 free hint
          if(levelConfig.scramble[level]) {
            const newConfig = levelConfig.scramble[level];
            timeLeft = newConfig.time;
            updateLevelInfo();
            buildScrambleList();
            updateUI();
          } else {
            endScrambleGame(true);
            return;
          }
        }
        setTimeout(nextScramble, 2000);
      } else {
        correctStreak = 0;
        document.getElementById('scrambleFeedback').innerHTML = '❌ Wrong! It was: ' + currentScramble.word + '<br><span style="color:#ffaa00">' + currentScramble.lesson + '</span>';
        setTimeout(nextScramble, 3000);
      }
    }

    function endScrambleGame(won = false) {
      gameActive = false;
      clearInterval(gameTimer);
      document.getElementById('scrambleWord').innerText = won? 'ALL LEVELS CLEARED! 🎉' : 'Time Up!';
      document.getElementById('scrambleBtn').style.display = 'block';
      document.getElementById('scrambleBtn').innerText = 'PLAY AGAIN';
      if(score > highScore) {
        highScore = score;
        localStorage.setItem('abst_game_high', highScore);
        updateUI();
        alert('🎉 New High Score: ' + score);
      }
    }

    // WISDOM GAME - 10 HINTS, 5 CORRECT = +2 HINTS
    function startWisdomGame() {
      score = 0;
      level = 1;
      gameActive = true;
      wisdomCorrectStreak = 0;
      updateUI();
      document.getElementById('wisdomBtn').style.display = 'none';
      document.getElementById('wisdomInput').style.display = 'block';
      document.getElementById('wisdomHintBtn').style.display = 'block';
      nextWisdom();
    }

    function nextWisdom() {
      const idx = Math.floor(Math.random() * wisdomData.length);
      currentWisdom = wisdomData[idx];
      document.getElementById('wisdomText').innerText = currentWisdom.q;
      document.getElementById('wisdomInput').value = '';
      document.getElementById('wisdomInput').focus();
      document.getElementById('wisdomFeedback').innerText = '';
      document.getElementById('wisdomHintBtn').disabled = hints <= 0;
    }

    document.getElementById('wisdomHintBtn').onclick = () => {
      if(hints <= 0) return;
      hints--;
      updateUI();
      document.getElementById('wisdomFeedback').innerHTML = '<span style="color:#ffaa00">Hint: ' + currentWisdom.hint + '</span>';
      document.getElementById('wisdomHintBtn').disabled = true;
    };

    document.getElementById('wisdomBtn').onclick = startWisdomGame;
    document.getElementById('wisdomInput').addEventListener('keypress', e => {
      if(e.key === 'Enter') checkWisdom();
    });

    function checkWisdom() {
      if(!gameActive) return;
      const ans = document.getElementById('wisdomInput').value.trim().toLowerCase();
      const correct = currentWisdom.a.toLowerCase();
      if(ans === correct || correct.includes(ans) || ans.includes(correct)) {
        score += 20;
        level++;
        wisdomCorrectStreak++;
        if(wisdomCorrectStreak % 5 === 0) {
          hints += 2;
          document.getElementById('wisdomFeedback').innerHTML = '✅ Wise! +2 HINTS 🎁<br><b style="color:#ffaa00">' + currentWisdom.lesson + '</b>';
        } else {
          document.getElementById('wisdomFeedback').innerHTML = '✅ Wise!<br><b style="color:#ffaa00">' + currentWisdom.lesson + '</b>';
        }
        if(score > highScore) {
          highScore = score;
          localStorage.setItem('abst_game_high', highScore);
        }
        updateUI();
        setTimeout(nextWisdom, 4000);
      } else {
        wisdomCorrectStreak = 0;
        document.getElementById('wisdomFeedback').innerHTML = '❌ Answer: ' + currentWisdom.a + '<br><b style="color:#ffaa00">' + currentWisdom.lesson + '</b>';
        setTimeout(nextWisdom, 5000);
      }
    }

    updateUI();
</script>
</body>
</html>
