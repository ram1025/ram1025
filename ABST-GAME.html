<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABST GAME | P24 | INDIAN.001</title>
  <meta name="theme-color" content="#ff00aa">
  <style>
    * { margin:0; padding:0; box-sizing:border-box }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background:#0a0a2f;
      color:#ff00aa;
      font-family:system-ui,-apple-system,sans-serif;
      padding:20px;
      text-align:center;
      min-height:100vh;
      transition: all 0.5s;
    }
    /* Add all your existing CSS here */
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="window.location.href='./index.html'">← CLOSE</button>
    <h1>ABST GAME</h1>
    <p>SOVEREIGN ID: INDIAN.001 | LEVEL MASTER</p>
  </div>

  <div class="game-toggle">
    <button class="mode-btn active" id="speedMode">⚡ SPEED</button>
    <button class="mode-btn" id="scrambleMode">🔤 SCRAMBLE</button>
    <button class="mode-btn" id="wisdomMode">🧠 WISDOM</button>
  </div>

  <div class="score-board">
    <div>Score<b id="score">0</b></div>
    <div>Hints<b id="hintCount">10</b></div>
    <div>High Score<b id="highScore">0</b></div>
    <div>Level<b id="level">1</b></div>
  </div>

  <div class="level-info" id="levelInfo">
    <div class="level-name" id="levelName">CIRCLE MASTER</div>
    <div>Target: <span id="targetScore">50</span> | Time: <span id="targetTime">30s</span></div>
  </div>

  <div class="game-area" id="gameArea">
    <!-- Speed Game -->
    <div id="speedGame">
      <div class="timer-display" id="timerDisplay">Ready?</div>
      <button class="btn btn-start" id="startBtn">START GAME</button>
      <div class="target" id="target"></div>
    </div>

    <!-- Scramble Game -->
    <div id="scrambleGame" style="display:none">
      <div class="scramble-word" id="scrambleWord">READY?</div>
      <input type="text" class="answer-input" id="scrambleInput" placeholder="Type answer...">
      <button class="btn" id="hintBtn">💡 HINT (<span id="hintsLeft">10</span>)</button>
    </div>

    <!-- Wisdom Game -->
    <div id="wisdomGame" style="display:none">
      <div class="wisdom-text" id="wisdomText">Press START to forge wisdom</div>
      <input type="text" class="answer-input" id="wisdomInput" placeholder="What is the key lesson?">
      <button class="btn" id="wisdomHintBtn">💡 HINT (<span id="wisdomHintsLeft">10</span>)</button>
    </div>
  </div>

  <script>
    let score = 0;
    let highScore = parseInt(localStorage.getItem('abst_game_high') || '0');
    let level = 1;
    let hints = 10;
    let wisdomHints = 10;
    let gameActive = false;

    const levelConfig = {
      speed: {
        1: {target: 50, time: 30, shape: 'circle', word: 'CIRCLE', meaning: 'A round shape'},
        2: {target: 100, time: 25, shape: 'square', word: 'SQUARE', meaning: 'A four-sided shape'},
        3: {target: 150, time: 20, shape: 'triangle', word: 'TRIANGLE', meaning: 'A three-sided shape'},
        // Add more levels
      }
    };

    function updateUI() {
      document.getElementById('score').innerText = score;
      document.getElementById('level').innerText = level;
      document.getElementById('highScore').innerText = highScore;
      document.getElementById('hintCount').innerText = hints;
      document.body.className = 'level-' + Math.min(level, 10);
    }

    // Speed Game Logic
    function startSpeedGame() {
      score = 0;
      level = 1;
      hints = 10;
      gameActive = true;
      updateUI();
      document.getElementById('startBtn').style.display = 'none';
      spawnTarget();
    }

    // Scramble Game Logic
    function startScrambleGame() {
      // Logic here
    }

    // Wisdom Game Logic
    function startWisdomGame() {
      wisdomHints = 10;
      // Logic here
    }

    document.getElementById('wisdomHintBtn').onclick = () => {
      if(wisdomHints > 0) {
        wisdomHints--;
        document.getElementById('wisdomHintsLeft').innerText = wisdomHints;
        // Show hint logic
      }
    };

    updateUI();
  </script>
</body>
</html>
