<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE JARVIS TRANSPARENCY FEED - ABST</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #00ff88;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    text-align: center;
    border-bottom: 2px solid #00ff88;
    padding: 20px 10px;
    background: #111;
  }
  .header h1 {
    color: #ff6600;
    font-size: 22px;
    margin-bottom: 5px;
  }
  .header p {
    color: #00ccff;
    font-size: 12px;
    margin: 3px 0;
  }
  .status {
    color: #00ff88;
    font-size: 11px;
    margin-top: 8px;
  }
  .status .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #00ff88;
    border-radius: 50%;
    animation: blink 1s infinite;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
  .feed-container {
    flex: 1;
    padding: 15px;
    display: flex;
    justify-content: center;
  }
  .feed {
    width: 100%;
    max-width: 900px;
    height: calc(100vh - 220px);
    overflow-y: auto;
    border: 1px solid #333;
    padding: 15px;
    background: #0d0d0d;
    border-radius: 8px;
  }
  .log {
    margin: 10px 0;
    padding: 8px 10px;
    border-left: 2px solid #00ff88;
    background: #151515;
    font-size: 13px;
    animation: slideIn 0.4s;
  }
  .timestamp {
    color: #888;
    margin-right: 8px;
  }
  .footer {
    text-align: center;
    padding: 15px 10px;
    border-top: 1px solid #333;
    background: #111;
  }
  .back-btn a {
    color: #ff6600;
    text-decoration: none;
    border: 1px solid #ff6600;
    padding: 10px 25px;
    border-radius: 6px;
    display: inline-block;
    font-size: 14px;
  }
  .founder {
    color: #666;
    font-size: 10px;
    margin-top: 8px;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
</style>
</head>
<body>
  <div class="header">
    <h1>🔴 LIVE JARVIS TRANSPARENCY FEED</h1>
    <p>ABST - Absolute Bharat Sovereign Technology</p>
    <p>Open • Honest • Transparent</p>
    <div class="status"><span class="dot"></span> LIVE STREAM ACTIVE</div>
  </div>
  
  <div class="feed-container">
    <div class="feed" id="feed"></div>
  </div>
  
  <div class="footer">
    <div class="back-btn">
      <a href="https://ram1025.github.io/ram1025/" target="_blank">← BACK TO ABST HOME</a>
    </div>
    <div class="founder">Founder: INDIAN.001 RAM GANESH MAKINA</div>
  </div>

<script>
const logTypes = [
  "System: Jarvis AI core initialized",
  "Security: ABST Constitution compliance verified", 
  "Success: DPR proposal scanned transparently",
  "System: New citizen query from Telangana received",
  "Security: Blockchain transparency log updated",
  "Success: All ABST modules running at 99.9% uptime",
  "System: Sovereign Constitution Article 3 verified",
  "Security: Live feed encryption active - Public access"
];

const feed = document.getElementById('feed');

function addLog() {
  const time = new Date().toLocaleTimeString('en-IN', { hour12: false });
  const msg = logTypes[Math.floor(Math.random() * logTypes.length)];
  
  const div = document.createElement('div');
  div.className = 'log';
  div.innerHTML = `<span class="timestamp">[${time}]</span> ${msg}`;
  
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
  
  if (feed.children.length > 100) {
    feed.removeChild(feed.firstChild);
  }
}

// Initial logs
for(let i = 0; i < 8; i++) {
  setTimeout(() => addLog(), i * 200);
}

// Add new log every 3 seconds
setInterval(addLog, 3000);
</script>
</body>
</html>
